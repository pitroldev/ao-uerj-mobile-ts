pluginManagement {
  includeBuild("../node_modules/@react-native/gradle-plugin")
  // Plugins do Expo (os módulos do Expo e o expo-updates), pelo expo-modules-autolinking que o
  // pacote expo usa, como no template do Expo SDK 58.
  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}
plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}
// As bibliotecas do React Native continuam pelo autolinking do React Native CLI (o modo
// EXPO_USE_COMMUNITY_AUTOLINKING do template do Expo); os módulos do Expo, pelo do Expo.
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
expoAutolinking.useExpoModules()
rootProject.name = 'aouerjmobile'
expoAutolinking.useExpoVersionCatalog()
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
