apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")
    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]
    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []
    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'


// Single source of truth for the version: package.json, bumped by release-please.
// versionCode = MAJOR * 10^7 + MINOR * 10^4 + PATCH (1.3.6 -> 10030006). It must stay
// above 3145828, the last hand-edited code (3 * 2^20 + 100: the old per-ABI split
// formula of the React Native template, arm64-v8a = 3, then bumped by hand).
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json")).version
def appVersionParts = appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!appVersionParts.matches()) {
    throw new GradleException("package.json version must be MAJOR.MINOR.PATCH, got ${appVersion}.")
}
def (versionMajor, versionMinor, versionPatch) = (1..3).collect { appVersionParts.group(it).toInteger() }
if (versionMajor < 1 || versionMinor > 999 || versionPatch > 9999) {
    throw new GradleException("Version ${appVersion} does not fit the versionCode formula.")
}
def appVersionCode = versionMajor * 10_000_000 + versionMinor * 10_000 + versionPatch

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
// CI passes the upload key through environment variables, which take precedence
// over android/keystore.properties key by key.
[
    storeFile: "ANDROID_KEYSTORE_FILE",
    storePassword: "ANDROID_KEYSTORE_PASSWORD",
    keyAlias: "ANDROID_KEY_ALIAS",
    keyPassword: "ANDROID_KEY_PASSWORD",
].each { key, variable ->
    def value = providers.environmentVariable(variable).getOrNull()
    if (value) {
        keystoreProperties[key] = value
    }
}

// Debug/CI builds never require publication secrets. Release fails explicitly
// rather than falling back to the public debug key.
def releaseSigningKeys = ["keyAlias", "keyPassword", "storeFile", "storePassword"]
def hasReleaseSigning = releaseSigningKeys.every { keystoreProperties[it] }
def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException("Release requires keyAlias, keyPassword, storeFile and storePassword in android/keystore.properties, or ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_KEYSTORE_FILE and ANDROID_KEYSTORE_PASSWORD.")
        }
        def releaseStoreFile = file(keystoreProperties["storeFile"])
        if (!releaseStoreFile.isFile()) {
            throw new GradleException("Release keystore file was not found. Check storeFile in android/keystore.properties or ANDROID_KEYSTORE_FILE.")
        }
        // In CI an unset ANDROID_KEYSTORE_BASE64 decodes to an empty file, which would
        // only fail when the bundle is signed, at the end of a long build.
        if (releaseStoreFile.length() == 0) {
            throw new GradleException("Release keystore ${releaseStoreFile} is empty. Check storeFile in android/keystore.properties or ANDROID_KEYSTORE_FILE; in CI, the ANDROID_KEYSTORE_BASE64 secret of the play environment.")
        }
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn(verifyReleaseSigning)
}

// Sentry: release bundles get Hermes source maps with a Debug ID (see metro.config.js).
// They are uploaded only when SENTRY_AUTH_TOKEN is set, as in the release workflow;
// local and CI builds without the token skip the upload and build as before.
// sentry-cli reads SENTRY_ORG, SENTRY_PROJECT and SENTRY_URL (EU: https://de.sentry.io/).
// No Sentry Android Gradle Plugin: it would instrument OkHttp, which sees the portal
// login URL with the password.
apply from: "../../node_modules/@sentry/react-native/sentry.gradle"
def sentryUploadEnabled = !providers.environmentVariable("SENTRY_AUTH_TOKEN").getOrElse("").trim().isEmpty() &&
    providers.environmentVariable("SENTRY_DISABLE_AUTO_UPLOAD").getOrElse("") != "true"
project.ext.shouldSentryAutoUploadGeneral = { -> sentryUploadEnabled }
// The SDK is configured in JS (src/app/observability), without sentry.options.json.
project.ext.shouldCopySentryOptionsFile = { -> false }

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.aouerjmobile"
    defaultConfig {
        applicationId "com.aouerjmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName "v${appVersion}"
        externalNativeBuild {
            cmake {
                // On Windows, ninja fails past MAX_PATH (260) on the deep codegen
                // sources of react-native-gesture-handler 3. CMake only hashes a
                // long object path when the hashed name fits under this limit
                // (default 250), which the longer ABI folders (arm64-v8a,
                // armeabi-v7a) miss by a few characters; 255 leaves room for the
                // hash and keeps the full path under 260.
                arguments "-DCMAKE_OBJECT_PATH_MAX=255"
            }
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Native debug symbols go inside the AAB (BUNDLE-METADATA), where Play reads them to
            // symbolicate native crashes and ANRs. SYMBOL_TABLE (function names) stays well under
            // Play's 300 MB limit for symbols; FULL would add line numbers at many times the size.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    sourceSets {
        // The React Native plugin creates debugOptimized with initWith(debug), which copies
        // the build type but not its source set. Without this, that variant would get the
        // network security config of src/main, which blocks Metro's cleartext HTTP, and no
        // aouerj-dev:// scheme. With setRoot, a src/debugOptimized folder would be ignored.
        debugOptimized {
            setRoot "src/debug"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${variant.applicationId}-${variant.versionName}-${variant.versionCode}.apk"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Play In-App Updates for the local InAppUpdates module (src/specs/NativeInAppUpdates.ts).
    implementation("com.google.android.play:app-update:2.1.0")
    // Periodic portal check of the local AppNotifications module (src/specs/NativeAppNotifications.ts).
    implementation("androidx.work:work-runtime:2.12.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
