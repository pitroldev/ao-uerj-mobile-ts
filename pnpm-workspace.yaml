# pnpm settings (pnpm 11+ no longer reads the "pnpm" field of package.json
# nor non-registry settings from .npmrc).

# React Native tooling (Metro, Gradle autolinking, CocoaPods) expects a flat
# node_modules.
nodeLinker: hoisted

# Dependencies whose install scripts may run.
allowBuilds:
  '@parcel/watcher': true
  # Checks the sentry-cli binary used to upload source maps.
  '@sentry/cli': true
  # Installs the git hooks from lefthook.yml.
  lefthook: true
  unrs-resolver: true

# uuid < 11.1.1 (GHSA-w5hq-g745-h8pq: missing buffer bounds check in v3/v5/v6) comes
# through xcode, in the Expo config plugin of react-native-bootsplash (asset
# generation only, not bundled). 11.x keeps the CommonJS entry xcode requires;
# 12+ is ESM-only.
overrides:
  uuid@<11.1.1: ^11.1.1

# react-native-share (Android): the "target chosen" broadcast named the runtime
# receiver as an explicit component, which only reaches manifest receivers, so
# Share.open never reported a share as done (only the chosen app's result).
# expo-updates (Android): after its startup recovery window, a fatal JS error
# was swallowed (ExpoReactHostFactory only rethrows with no host handlers), so
# the app froze blank with no Play crash report; it now rethrows, as plain RN.
patchedDependencies:
  expo-updates@58.0.21: patches/expo-updates@58.0.21.patch
  react-native-share@12.3.1: patches/react-native-share@12.3.1.patch
