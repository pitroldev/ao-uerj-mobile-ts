# pnpm settings (pnpm 11+ no longer reads the "pnpm" field of package.json
# nor non-registry settings from .npmrc).

# React Native tooling (Metro, Gradle autolinking, CocoaPods) expects a flat
# node_modules.
nodeLinker: hoisted

# Dependencies whose install scripts may run.
allowBuilds:
  '@parcel/watcher': true
  # Checks the sentry-cli binary used to upload source maps.
  '@sentry/cli': true
  # Installs the git hooks from lefthook.yml.
  lefthook: true
  unrs-resolver: true

# uuid < 11.1.1 (GHSA-w5hq-g745-h8pq: missing buffer bounds check in v3/v5/v6) comes
# through xcode, in the Expo config plugin of react-native-bootsplash (asset
# generation only, not bundled). 11.x keeps the CommonJS entry xcode requires;
# 12+ is ESM-only.
overrides:
  uuid@<11.1.1: ^11.1.1
