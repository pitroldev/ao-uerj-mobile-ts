name: iOS simulator build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # O Expo SDK 58 (ExpoModulesJSI) pede o Swift 6.2, que vem no Xcode 26; o
      # padrão do macos-15 ainda é o 16.4 (Swift 6.1). Usa o 26 mais novo da imagem.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::a imagem não tem o Xcode 26 (há: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' '))"
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      # v6.1.0 ou mais nova: a v6.0.x não tem suporte nativo ao pnpm 12 (pnpm/action-setup#289).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      # O runtime version das atualizações OTA sai do código como está no Git,
      # antes do pod install, que mexe no projeto do Xcode: é o valor que o
      # publicador calcula (scripts/ota/runtime-version.cjs). O build o grava
      # no app pelo EXPO_UPDATES_FINGERPRINT_OVERRIDE.
      - name: OTA runtime version (before pod install)
        run: |
          runtime=$(node scripts/ota/runtime-version.cjs ios)
          echo "runtime version: $runtime"
          echo "EXPO_UPDATES_FINGERPRINT_OVERRIDE=$runtime" >> "$GITHUB_ENV"
      - run: bundle exec pod install --project-directory=ios
      # Só informa: o que o pod install mudou em ios/ (o que, sem o override,
      # mudaria o runtime version de um build feito à mão no Mac).
      - name: What pod install changed in ios/
        run: |
          git status --porcelain -- ios
          after=$(EXPO_UPDATES_FINGERPRINT_OVERRIDE= node scripts/ota/runtime-version.cjs ios)
          if [ "$after" != "$EXPO_UPDATES_FINGERPRINT_OVERRIDE" ]; then
            echo "::notice::o pod install muda o runtime version ($after); o build usa o de antes ($EXPO_UPDATES_FINGERPRINT_OVERRIDE)"
          fi
      # Release, como vai para a loja: o Xcode empacota o JS de iOS (o que só
      # quebra nessa plataforma: resolução de módulos, assets) e o Hermes o
      # compila. Assinatura local ("Sign to Run Locally", sem conta da Apple):
      # sem ela o app fica sem os entitlements, e o Keychain do simulador recusa
      # tudo (-34018), o que o iPhone de verdade não faz.
      - name: Build for simulator, signed to run locally (Release)
        run: >-
          xcodebuild
          -workspace ios/AOUerjMobile.xcworkspace
          -scheme AOUerjMobile
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=
          PROVISIONING_PROFILE_SPECIFIER=
          build
      # O app leva a configuração do expo-updates (Expo.plist), o runtime
      # version calculado antes do pod install e o manifesto do pacote
      # embutido (EXUpdates.bundle, gerado no build).
      - name: The app embeds the OTA runtime version and configuration
        run: |
          app=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          fingerprint=$(find "$app" -path '*EXUpdates.bundle/fingerprint' | head -1)
          manifest=$(find "$app" -path '*EXUpdates.bundle/app.manifest' | head -1)
          if [ -z "$fingerprint" ] || [ -z "$manifest" ]; then
            echo "::error::falta o EXUpdates.bundle (fingerprint e app.manifest) no app"
            exit 1
          fi
          embedded=$(cat "$fingerprint")
          echo "runtime version embutido: $embedded"
          if [ "$embedded" != "$EXPO_UPDATES_FINGERPRINT_OVERRIDE" ]; then
            echo "::error::o app embute $embedded, mas o publicador calcula $EXPO_UPDATES_FINGERPRINT_OVERRIDE"
            exit 1
          fi
          test "$(plutil -extract EXUpdatesURL raw "$app/Expo.plist")" = "https://pitrol.dev/aouerj/ota/manifest"
          test "$(plutil -extract EXUpdatesRuntimeVersion raw "$app/Expo.plist")" = "file:fingerprint"
      # Abre o app num iPhone simulado e confere que ele não cai (abertura,
      # tema escuro, link aouerj://, segunda abertura e uma rodada da
      # verificação em segundo plano, com o React Native aberto sem janela e
      # reaproveitado pela tela), com capturas de tela.
      - name: Smoke test on the iPhone simulator
        run: |
          app=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "app: $app"
          bash scripts/ci/ios-smoke.sh "$app" "$RUNNER_TEMP/ios-smoke"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-smoke
          path: ${{ runner.temp }}/ios-smoke
          retention-days: 14
          if-no-files-found: ignore
