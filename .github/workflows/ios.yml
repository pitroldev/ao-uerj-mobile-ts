name: iOS simulator build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v6.1.0 ou mais nova: a v6.0.x não tem suporte nativo ao pnpm 12 (pnpm/action-setup#289).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      # O build Debug abaixo não empacota o JS: o bundle de release para iOS
      # pega o que só quebra nessa plataforma (resolução de módulos, assets).
      - name: Bundle the JS for iOS (release)
        run: >-
          pnpm exec react-native bundle
          --platform ios
          --dev false
          --entry-file index.js
          --bundle-output "$RUNNER_TEMP/main.jsbundle"
          --assets-dest "$RUNNER_TEMP/assets"
      - run: bundle exec pod install --project-directory=ios
      - name: Build without signing for simulator
        run: >-
          xcodebuild
          -workspace ios/AOUerjMobile.xcworkspace
          -scheme AOUerjMobile
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO
          build
