name: iOS simulator build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v6.1.0 ou mais nova: a v6.0.x não tem suporte nativo ao pnpm 12 (pnpm/action-setup#289).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - run: bundle exec pod install --project-directory=ios
      # Release, como vai para a loja: o Xcode empacota o JS de iOS (o que só
      # quebra nessa plataforma: resolução de módulos, assets) e o Hermes o
      # compila. Sem assinatura, o simulador abre o app do mesmo jeito.
      - name: Build without signing for simulator (Release)
        run: >-
          xcodebuild
          -workspace ios/AOUerjMobile.xcworkspace
          -scheme AOUerjMobile
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO
          build
      # Abre o app num iPhone simulado e confere que ele não cai (abertura,
      # tema escuro, link aouerj:// e segunda abertura), com capturas de tela.
      - name: Smoke test on the iPhone simulator
        run: |
          app=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "app: $app"
          bash scripts/ci/ios-smoke.sh "$app" "$RUNNER_TEMP/ios-smoke"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-smoke
          path: ${{ runner.temp }}/ios-smoke
          retention-days: 14
          if-no-files-found: ignore
