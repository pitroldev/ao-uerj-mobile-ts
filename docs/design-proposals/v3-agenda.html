<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AO UERJ · Variante 3 · Agenda limpa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0..1,0&display=block">
<style>
:root{
  color-scheme:light;
  --brand:#003468;--brand-hl:#004891;--on-brand:#FFFFFF;--on-brand-2:rgba(255,255,255,.76);--brand-rule:rgba(255,255,255,.14);
  --bg:#FFFFFF;--bg-2:#F6F7F9;--bg-3:#EDF0F4;--sheet:#FFFFFF;
  --rule:#E4E7EC;--rule-2:#D0D5DD;--field:#B8BFCA;
  --surface:#FFFFFF;--surface-hover:#F6F7F9;
  --ink:#101828;--ink-2:#5D6679;--ink-3:#7C8596;
  --accent:#004891;--accent-soft:#E8F0FA;--accent-line:#BBD0EC;--sel:#CFE0F5;
  --fill:#004891;--on-fill:#FFFFFF;--fill-hover:color-mix(in srgb,#004891 88%,#101828);
  --good:#17673A;--good-bg:#DDF5E3;--good-line:#A9DDB7;
  --warn:#715600;--warn-bg:#FAF4CC;--warn-line:#E5D682;--warn-wash:#FAF4CC;--warn-wash-line:#E5D682;
  --bad:#A4261E;--bad-bg:#FCE4E2;--bad-line:#F1B5AF;--bad-wash:#FCE4E2;--bad-wash-line:#F1B5AF;
  --neu:#4A5263;--neu-bg:#EDEFF3;--neu-line:#D3D8E0;
  --m:#665400;--m-bg:#FBF8D6;--m-line:#E6DC98;
  --a:#894A0F;--a-bg:#FFEEDB;--a-line:#F0CBA4;
  --n:#0A5A73;--n-bg:#DEF3FA;--n-line:#A6D8E9;
  --logo:#003468;
  --scrim:rgba(10,20,40,.44);
  --snack:#1C2433;--snack-ink:#F2F4F7;--snack-ok:#8FD9A8;--snack-err:#F7A39B;--snack-shadow:0 8px 24px rgba(0,0,0,.24);
  --notice-warn-act:var(--accent);--notice-bad-act:var(--accent);--float:#FFFFFF;
  --panel-shadow:-12px 0 32px rgba(0,12,32,.30);
  --sheet-shadow:0 -10px 32px rgba(16,24,40,.18);
  --desk:#E8EBF0;--desk-card:#FFFFFF;--desk-ink:#101828;--desk-ink-2:#5D6679;--desk-rule:#D9DEE5;--desk-hover:#F1F3F6;--desk-sel:#003468;--fab:rgba(16,24,40,.8);--device-line:#2A2F38;
}
/* escuro: "a mesma agenda, à noite". Cabeçalho e menu no mesmo azul UERJ do claro (não redefinidos aqui);
   superfícies azul-marinho no matiz da UERJ, com elevação por degraus (painel < elevada < mais alta), sem sombras;
   o acento claro fica para texto, ícones, indicadores e linhas, e o preenchimento (--fill) é um azul médio com texto branco;
   status e turnos viram superfícies tingidas com texto claro do mesmo matiz; em áreas grandes (avisos, células marcadas)
   o tom é um degrau mais calmo (--*-wash), no claro igual ao pastel de sempre */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1626;--bg-2:#111F33;--bg-3:#182A43;--sheet:#111F33;
  --surface:#111F33;--surface-hover:#182A43;
  --rule:#304259;--rule-2:#3B4E68;--field:#63768F;
  --ink:#E6EDF6;--ink-2:#A7B4C6;--ink-3:#7E8DA3;
  --accent:#6DAEF0;--accent-soft:#123458;--accent-line:#2D5786;--sel:#17497B;
  --fill:#2A6BC0;--on-fill:#FFFFFF;--fill-hover:#3273C9;
  --good:#A4EBB8;--good-bg:#1E4A2E;--good-line:#3B6A4A;
  --warn:#F8D48B;--warn-bg:#573900;--warn-line:#78571D;--warn-wash:#462D00;--warn-wash-line:#6A4C1D;
  --bad:#FF9C92;--bad-bg:#612E2B;--bad-line:#854B47;--bad-wash:#4C221F;--bad-wash-line:#743E3B;
  --neu:#B3BFCF;--neu-bg:#36414F;--neu-line:#535F6E;
  --m:#F2D98C;--m-bg:#4E3A03;--m-line:#715A24;
  --a:#FFCC9C;--a-bg:#593014;--a-line:#7F4F31;
  --n:#99E6FF;--n-bg:#184655;--n-line:#356575;
  --logo:#E6EDF6;
  --scrim:rgba(2,8,20,.62);
  --snack:#273E5C;--snack-ink:#EEF3F9;--snack-ok:#A4EBB8;--snack-err:#FF9C92;--snack-shadow:0 10px 28px rgba(0,4,12,.5);
  --notice-warn-act:var(--warn);--notice-bad-act:var(--bad);--float:#182A43;
  --panel-shadow:-12px 0 32px rgba(0,6,18,.5);
  --sheet-shadow:0 -10px 32px rgba(0,4,12,.5);
  --desk:#070D18;--desk-card:#0F1C2F;--desk-ink:#E6EDF6;--desk-ink-2:#A7B4C6;--desk-rule:#24364F;--desk-hover:#16263C;--desk-sel:#2A6BC0;--fab:#2A6BC0;
  /* contorno do aparelho: na mesa escura o corpo preto some (1,01:1), então o aro sobe para ~2:1 contra a mesa */
  --device-line:#33445C;
}
/* a folha já é a superfície elevada: dentro dela, cada degrau sobe um nível (passar o dedo, campos, fios) */
:root[data-theme="dark"] .sheet{--bg:#111F33;--bg-2:#182A43;--bg-3:#1F3551;--surface:#182A43;--surface-hover:#1F3551;--rule:#33475F;--rule-2:#42566F}

/* ---------------------------------------------------------------- base */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--desk-ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit;font-feature-settings:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
p,h1,h2,h3,ol,ul,dl,dd{margin:0}
::selection{background:var(--sel);color:var(--ink)}
input,textarea{caret-color:var(--accent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;flex:none;user-select:none;width:1em;height:1em;overflow:hidden}
.ic.fill{font-variation-settings:'FILL' 1,'wght' 300,'GRAD' 0,'opsz' 24}
/* figuras tabulares só onde há apenas números (no Inter, o tnum também alarga o hífen) */
.sb>span:first-child,.gp,.gt td,.next-time,.tt td b,.tt-n,.sel-aside,.r-aside,.stat b,.kv b,.num,.res-sum b,.path-top b,.sum dd,.day b,.cal-hr span,.cal-now b,.ch-y,.ch-x,.ch-v,.busy-t,.wk-t,.msg-h time{font-variant-numeric:tabular-nums}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ------------------------------------------------------ moldura / mesa */
.desk{display:block}
.screen{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:var(--brand);color:var(--ink);display:flex;flex-direction:column;font-size:14px;line-height:20px;isolation:isolate}
html.framed .desk{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;padding:16px 32px}
html.framed .device-wrap{flex:none;width:calc(436px * var(--s,1));height:calc(916px * var(--s,1))}
html.framed .device{width:436px;height:916px;padding:12px;border-radius:48px;background:#0A0C10;transform:scale(var(--s,1));transform-origin:0 0;box-shadow:0 40px 80px -30px rgba(0,10,30,.55),0 2px 6px rgba(0,0,0,.25),inset 0 0 0 1.5px var(--device-line)}
html.framed .screen{width:412px;height:892px;border-radius:36px}

/* painel de controle */
.ctl{display:none;width:340px;max-height:calc(100vh - 32px);overflow:auto;background:var(--desk-card);color:var(--desk-ink);border:1px solid var(--desk-rule);border-radius:16px 0 16px 16px;padding:20px;flex-direction:column;gap:16px;font-size:13px;line-height:18px}
html.framed .ctl{display:flex}
.ctl>*{flex-shrink:0}
.ctl-head{display:flex;gap:12px;align-items:center}
.ctl-mark{width:44px;height:44px;flex:none;border-radius:12px 0 12px 12px;background:var(--brand);color:#fff;display:grid;place-items:center}
.ctl-mark svg{width:30px;height:auto;display:block}
.ctl-head > div{flex:1}
.ctl h1{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.01em}
.ctl-head p{color:var(--desk-ink-2)}
.ctl-desc{color:var(--desk-ink-2)}
.seg2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--desk-rule);border-radius:10px 0 10px 10px;overflow:hidden}
.seg2 button{height:40px;border:0;background:none;color:var(--desk-ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg2 button .ic{font-size:18px}
.seg2 button+button{border-left:1px solid var(--desk-rule)}
.seg2 button[aria-pressed="true"]{background:var(--desk-sel);color:#fff}
.seg2 button:focus-visible{outline-offset:-4px}
.seg2 button:first-child:focus-visible{border-radius:9px 0 0 9px}
.seg2 button:last-child:focus-visible{border-radius:0 0 9px 0}
.seg2 button[aria-pressed="true"]:focus-visible{outline-color:#fff}
.ctl-nav{columns:2;column-gap:16px}
.ctl-g{break-inside:avoid;margin-bottom:12px}
.ctl-g h2{font-size:12px;line-height:16px;font-weight:600;color:var(--desk-ink-2);margin:0 0 4px}
.ctl-g ul{list-style:none;margin:0;padding:0}
.ctl-g a{display:block;padding:4px 8px;margin:0 -8px;border-radius:6px;color:var(--desk-ink);text-decoration:none}
.ctl-g a:hover{background:var(--desk-hover)}
.ctl-g a[aria-current="true"]{background:var(--desk-sel);color:#fff}
.ctl-foot{color:var(--desk-ink-2);font-size:12px;border-top:1px solid var(--desk-rule);padding-top:12px}
.ctl-close{display:none!important}
.ctl.open{display:flex;position:fixed;left:8px;right:8px;bottom:8px;width:auto;max-height:76vh;z-index:100;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ctl.open .ctl-close{display:inline-grid!important}
.ctl .ib{color:var(--desk-ink)}
.fab{position:fixed;right:12px;bottom:96px;z-index:90;width:40px;height:40px;border-radius:50%;border:0;background:var(--fab);color:#fff;display:none;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.fab .ic{font-size:20px}
html:not(.framed):not(.embed):not(.capture) .fab{display:grid}

/* -------------------------------------------- barra de status / cabeçalho */
.sb{flex:none;height:24px;padding:0 14px 0 20px;display:flex;align-items:center;justify-content:space-between;color:var(--on-brand);font-size:13px;font-weight:500;letter-spacing:.01em;position:relative;z-index:8}
.sb-ic{display:flex;gap:5px;align-items:center}
.sb svg{display:block}
.appbar{flex:none;height:52px;display:flex;align-items:center;padding:0 4px;color:var(--on-brand);position:relative;z-index:8}
.appbar h1{flex:1;text-align:center;font-size:17px;line-height:24px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;flex:none;display:inline-grid;place-items:center;border:0;border-radius:50%;background:transparent;color:inherit;padding:0;transition:background-color 150ms ease}
.ib:hover{background:color-mix(in srgb,currentColor 9%,transparent)}
.ib:active{background:color-mix(in srgb,currentColor 16%,transparent)}
.appbar :focus-visible,.drawer :focus-visible,.solo .login-top :focus-visible{outline-color:var(--on-brand)}
.logo-sm{width:36px;height:auto;display:block}

/* ------------------------------------------------ corpo / menu / painel */
.body{flex:1;position:relative;min-height:0}
.drawer{position:absolute;top:0;bottom:0;left:0;width:300px;color:var(--on-brand);display:flex;flex-direction:column;padding:4px 0 22px;opacity:0;visibility:hidden;transition:opacity 200ms ease,visibility 0s linear 240ms}
.drawer-open .drawer{opacity:1;visibility:visible;transition:opacity 200ms ease}
.panel{position:absolute;inset:0;z-index:2;background:var(--bg);color:var(--ink);border-top-left-radius:48px;overflow:hidden;display:flex;flex-direction:column;transition:transform 240ms cubic-bezier(.2,.8,.2,1),box-shadow 240ms ease}
.drawer-open .panel{transform:translateX(300px);box-shadow:var(--panel-shadow)}
.catch{position:absolute;inset:0;z-index:20;display:none}
.drawer-open .catch{display:block;cursor:pointer}
.panel-top{flex:none}
.panel-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:32px 20px 40px;overscroll-behavior:contain}
.panel-foot{flex:none;display:flex;gap:12px;padding:12px 20px 26px;border-top:1px solid var(--rule);background:var(--surface)}
.panel-foot .btn{flex:1}

.dr-user{display:flex;gap:12px;align-items:flex-start;padding:12px 20px 16px 24px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-hl);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600;letter-spacing:.02em;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.dr-name{font-size:15px;line-height:20px;font-weight:600}
.dr-meta{font-size:13px;line-height:18px;color:var(--on-brand-2)}
.dr-nav{position:relative;flex:1;min-height:0;overflow-y:auto;padding:0 12px 8px;border-top:1px solid var(--brand-rule);margin:0 12px;padding-left:0;padding-right:0}
.dr-group{font-size:13px;line-height:18px;font-weight:500;color:var(--on-brand-2);padding:16px 12px 6px}
.dr-sep{height:1px;background:var(--brand-rule);margin:12px 0}
.dr-item{position:relative;z-index:1;display:flex;align-items:center;gap:14px;width:100%;height:48px;padding:0 12px;border:0;background:none;color:var(--on-brand);font-size:15px;font-weight:400;text-align:left;border-radius:12px 0 12px 12px;transition:background-color 150ms ease}
.dr-item .ic{color:var(--on-brand-2)}
.dr-item:hover{background:rgba(255,255,255,.06)}
.dr-item[aria-current="page"]{font-weight:600}
.dr-item[aria-current="page"]:hover{background:transparent}
.dr-item[aria-current="page"] .ic{color:var(--on-brand);font-variation-settings:'FILL' 1,'wght' 300,'GRAD' 0,'opsz' 24}
.dr-hl{position:absolute;left:0;right:0;top:0;height:48px;border-radius:12px 0 12px 12px;background:var(--brand-hl);transition:transform 200ms cubic-bezier(.2,.8,.2,1);z-index:0;pointer-events:none}
.dr-hl.still{transition:none}
.dr-foot{display:flex;align-items:center;gap:4px;margin:8px 12px 0;padding-top:8px;border-top:1px solid var(--brand-rule)}
.dr-foot .dr-item{width:auto;padding:0 16px 0 12px}
.dr-ver{flex:1;text-align:right;font-size:12px;color:var(--on-brand-2)}
</style>
</head>
<style>
/* ------------------------------------------------------------ componentes */
.greet h2{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.02em}
.greet p{margin-top:2px;color:var(--ink-2);font-size:14px}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;margin-bottom:10px}
.sec-h h2{font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.sec-note{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.sec-note .ic{font-size:18px}
.sec-p{color:var(--ink-2);font-size:14px;margin:-4px 0 8px}
.card{border:1px solid var(--rule);border-radius:12px 0 12px 12px;background:var(--surface)}
button.card{width:100%;text-align:left;color:inherit;font:inherit;transition:background-color 150ms ease}
button.card:hover{background:var(--surface-hover)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:1px solid var(--fill);border-radius:10px;background:var(--fill);color:var(--on-fill);font-size:15px;font-weight:600;white-space:nowrap;text-decoration:none;transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease}
.btn:hover{background:var(--fill-hover);border-color:var(--fill-hover)}
.btn:disabled{background:var(--bg-3);border-color:var(--bg-3);color:var(--ink-2);cursor:not-allowed}
.btn .ic{font-size:20px}
.btn-outline{background:var(--surface);color:var(--accent);border-color:var(--rule-2)}
.btn-outline:hover{background:var(--accent-soft);border-color:var(--rule-2)}
.btn-text{background:none;border-color:transparent;color:var(--accent);padding:0 12px}
.btn-text:hover{background:var(--accent-soft);border-color:transparent}
.btn-block{width:100%}
.btn-sm{min-height:48px;font-size:14px;padding:0 16px}
.btn-tiny{min-height:48px;font-size:14px;padding:0 10px;margin:-8px -10px -8px 0}
.btn-tiny .ic{font-size:18px}
.btn-link{display:block;width:100%;min-height:48px;border:0;background:none;color:var(--accent);font-size:14px;font-weight:600;border-radius:10px}
.btn-link:hover{text-decoration:underline;text-underline-offset:3px}
.btn-inline{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:48px;margin:0 0 -10px -8px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--accent);font-size:13px;font-weight:600;text-align:left}
.btn-inline .ic{font-size:18px}
.btn-inline:hover{background:var(--accent-soft)}

.label{display:block;font-size:13px;line-height:18px;font-weight:500;color:var(--ink);margin:0 0 6px}
.field{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 0 0 12px;border:1px solid var(--field);border-radius:10px 0 10px 10px;background:var(--surface);transition:border-color 150ms ease,box-shadow 150ms ease}
.field>.ic{color:var(--ink-2);font-size:20px}
.field input,.field textarea{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px;line-height:22px;color:var(--ink);padding:12px 12px 12px 0}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-2);opacity:1}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.field.invalid{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.field .ib{width:48px;height:46px;border-radius:8px;color:var(--ink-2);margin-left:-8px}
.field .ib .ic{font-size:20px}
.field:has(input:placeholder-shown) .clear{display:none}
.btn-sq{width:48px;padding:0;flex:none}
.field.area{align-items:flex-start;padding:0 12px}
.field textarea{resize:none;min-height:132px;padding-right:0}
.grow{flex:1;min-width:0}
.search-row{display:flex;gap:8px;align-items:stretch}

.chips{display:flex;gap:8px}
.chips.wrap{flex-wrap:wrap}
.chips.scroll{overflow-x:auto;margin:0 -20px;padding:6px 20px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 20px),transparent)}
.chip{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid var(--rule-2);border-radius:8px 0 8px 8px;background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap;transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease}
.chip::after{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px}
.chip .ic{font-size:18px;margin-left:-4px}
.chip:hover{background:var(--surface-hover)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.segm{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--rule-2);border-radius:10px 0 10px 10px;overflow:hidden}
.segm button{min-height:48px;border:0;background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color 150ms ease}
.segm button .ic{font-size:18px}
.segm button+button{border-left:1px solid var(--rule-2)}
.segm button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* faixas com overflow recortam o anel de fora: nelas (e nas linhas na largura toda) o anel entra no item;
   no foco, os itens das pontas copiam o raio interno da faixa para o anel ficar concêntrico */
.segm button:focus-visible{outline-offset:-4px}
.segm button:first-child:focus-visible{border-radius:9px 0 0 9px}

<!--
  AO UERJ · Variante 3 · Agenda limpa

  Inspiração: Notion Calendar, Todoist e Apple Calendário. Clareza tipográfica,
  fios finos de 1px, densidade calma, menos cards e mais listas com divisores,
  tabelas compactas e o dia como régua de horas (fios por hora, blocos neutros com
  altura proporcional à duração, linha de "agora" e os intervalos livres do dia).

  Paleta: cabeçalho, barra de status e menu lateral em #003468 (o PRIMARY atual),
  destaque do menu em #004891; conteúdo #FFFFFF, fios #E4E7EC, texto #101828 /
  #5D6679; acento #004891 (o SECONDARY atual) só em seleção e ações. Pastéis de
  significado do app atual (aprovado verde, reprovado vermelho, cancelado/isento
  cinza; Manhã amarelo, Tarde pêssego, Noite azul-claro; saúde ≥70% / ≥50% /
  abaixo) só em fundos pequenos e sempre com ponto + rótulo. Escuro ("a mesma
  agenda, à noite"): cabeçalho e menu no mesmo #003468; painel azul-marinho
  #0B1626 e elevação por degraus (#111F33 cards, campos, folhas, barras e cabeçalhos
  de tabela; #182A43 acima disso); fios #304259; texto #E6EDF6 / #A7B4C6; acento
  #6DAEF0 para texto, ícones e indicadores; botões e seleções preenchidos em #2A6BC0
  com texto branco; pastéis viram superfícies tingidas com texto claro do mesmo matiz
  (crítico #FF9C92, o mais saturado, como no claro).

  Tipo: Inter (Google Fonts); figuras tabulares (tnum) só em colunas e valores
  numéricos, nunca em prosa ou códigos (no Inter o tnum alarga o hífen); hierarquia
  só por tamanho e peso (24/20/17/15/13/12). Ícones: Material Symbols Outlined, peso 300.

  Preservado do atual: azul UERJ atrás de tudo; painel claro com o canto superior
  esquerdo de 48px; cards, campos, chips e caixas com o canto superior direito reto;
  cabeçalho com menu à esquerda, título centralizado (no Início, o período) e o
  logo AO à direita abrindo "Sobre"; menu lateral azul atrás do conteúdo (o painel
  desliza para a direita, como drawerType 'back', e o cabeçalho fica parado) com
  destaque animado que desliza até a rota ativa e "Sair" no rodapé; login com o
  logo grande no azul e painel de canto arredondado; rotas, títulos e copy reais.
-->
<div class="desk" id="desk">
  <div class="device-wrap" id="deviceWrap">
    <div class="device">
      <div class="screen" id="screen" aria-label="AO UERJ"></div>
    </div>
  </div>
  <aside class="ctl" id="ctl" aria-label="Controles da demonstração"></aside>
</div>
<button class="fab" id="fab" type="button" aria-label="Telas, estados e tema da demonstração" aria-controls="ctl" aria-expanded="false"><span class="ic" aria-hidden="true">tune</span></button>
<script src="shared/logo.js"></script>
<script src="shared/data.js"></script>
<script>
(function () {
'use strict';
var D = window.AO_DATA;
var root = document.documentElement;
var screenEl = document.getElementById('screen');
var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var FLAGS = { embed: false, capture: false };

/* ============================================================ utilidades */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ic(n, c) { return '<span class="ic' + (c ? ' ' + c : '') + '" aria-hidden="true">' + n + '</span>'; }
function fmt(n, d) { if (n == null || isNaN(n)) return '–'; d = d == null ? 1 : d; return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function joinPt(a) { return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1]; }
function dur(min) { var h = Math.floor(min / 60), m = min % 60; if (!h) return m + ' min'; return h + 'h' + (m ? String(m).padStart(2, '0') : ''); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function range(a, b) { return a === b ? a : a + '–' + b; }
function room(loc) { if (!loc) return 'Sala não informada'; var p = loc.split(' · '); return p[p.length - 1]; }
function place(loc) { if (!loc) return ''; var p = loc.split(' · '); return p.slice(0, -1).join(' · '); }
function dayNum(n) { return 11 + n; } /* segunda = 12/10/2026 */
function dayLabel(n) { return D.WEEKDAYS[n - 1].name + ', ' + dayNum(n) + ' de outubro'; }
function find(arr, fn) { for (var i = 0; i < arr.length; i++) if (fn(arr[i])) return arr[i]; return null; }
function slotIdx(id) { return D.SLOTS.indexOf(D.slot(id)); }
function meetSummary(ms) {
  if (!ms || !ms.length) return '';
  var a = D.slot(ms[0].from), b = D.slot(ms[0].to);
  return joinPt(ms.map(function (m) { return D.WEEKDAYS[m.day - 1].short; })) + ' · ' + range(a.id, b.id) + ' · ' + a.from + '–' + b.to;
}
function acronym(name) {
  var stop = ['de', 'da', 'do', 'das', 'dos', 'e', 'em', 'para', 'a', 'o'];
  return name.split(' ').filter(function (w) { return stop.indexOf(w.toLowerCase()) < 0; }).map(function (w) { return w[0].toUpperCase(); }).join('');
}

var SHIFT = { MORNING: { k: 'm', l: 'Manhã' }, AFTERNOON: { k: 'a', l: 'Tarde' }, NIGHT: { k: 'n', l: 'Noite' } };
var HEALTH = { GOOD: { k: 'good', l: 'Bom' }, BAD: { k: 'warn', l: 'Atenção' }, CRITICAL: { k: 'bad', l: 'Crítico' }, NONE: { k: 'neu', l: 'Sem dado' } };
function hp(v, base, inv) { return HEALTH[D.health(v, base, inv)]; }
function st(k, l, icon) { return '<span class="st st-' + k + '">' + (icon ? ic(icon) : '<i aria-hidden="true"></i>') + esc(l) + '</span>'; }
var STATUS_K = { APPROVED: 'good', FAILED_BY_GRADE: 'bad', FAILED_BY_ATTENDANCE: 'bad', CANCELED: 'neu', EXEMPT: 'neu', IN_PROGRESS: 'accent' };
var TYPE_PL = { MANDATORY: 'Obrigatórias', RESTRICTED: 'Eletivas Restritas', DEFINED: 'Eletivas Definidas', UNIVERSAL: 'Universais' };
function chev() { return ic('chevron_right', 'r-chev'); }
/* nome primeiro; código e o resto do contexto na linha de baixo (nunca um rótulo acima do título) */
function nameCode(name, code, rest) {
  return '<span class="r-title">' + esc(name) + '</span><span class="r-meta"><span class="code">' + esc(code) + '</span>' + (rest ? ' · ' + rest : '') + '</span>';
}
function sk(w, h, r) { return '<span class="sk" style="width:' + w + ';height:' + h + 'px' + (r ? ';border-radius:' + r : '') + '"></span>'; }
function skList(n) {
  var o = '';
  for (var i = 0; i < n; i++) o += '<div class="sk-item">' + sk(i % 2 ? '62%' : '78%', 16) + sk('38%', 12) + sk('52%', 12) + '</div>';
  return '<div aria-busy="true"><span class="sr">Carregando…</span>' + o + '</div>';
}
function emptyState(icon, text, action, kind) {
  return '<div class="empty' + (kind ? ' empty-' + kind : '') + '"><span class="empty-ic">' + ic(icon) + '</span><p>' + esc(text) + '</p>' + (action || '') + '</div>';
}
function retryBtn() { return '<button class="btn btn-outline btn-sm" data-act="retry">' + ic('refresh') + 'Tentar novamente</button>'; }

/* ================================================================ estado */
var S = {
  route: 'home', p: {}, theme: 'light', drawer: false, backHash: null,
  ui: {
    day: D.now.weekday,
    period: (find(D.periodList, function (p) { return p.isCurrentCra; }) || D.periodList[0]).value,
    cur: { type: '', taken: false, q: '' },
    uni: { dept: '', q: '' },
    credits: Object.assign({}, D.electiveConfig), creditsSaved: false,
    msgPeriod: D.student.period,
    chat: {},
    report: { step: 1, page: null },
    selKey: null, focusId: null,
    loginErr: '',
    gen: {
      min: String(D.generator.minSubjects), max: String(D.generator.maxSubjects),
      busy: new Set(D.generator.defaultBusy.map(function (b) { return b.day + '-' + b.slot; })),
      prio: new Set(D.generator.priorityPresets[0].keys),
      type: '', q: '',
      sel: new Set(D.generator.fetchResults.map(function (r) { return r.id; })),
      fetched: 0, fetchDone: false, fetching: false,
      teacher: '',
      cls: new Set(D.generator.classes.map(function (c) { return c.subjectId + '#' + c.classNumber; })),
      result: 0
    }
  }
};

/* ================================================================ rotas */
var NAV = [
  { group: 'Acadêmico', items: [
    { r: 'home', label: 'Início', icon: 'home' },
    { r: 'progress', label: 'Meu Progresso', icon: 'monitoring' },
    { r: 'realizadas', label: 'Disciplinas Realizadas', icon: 'task_alt' },
    { r: 'curriculo', label: 'Disciplinas do Currículo', icon: 'account_tree' },
    { r: 'universais', label: 'Disciplinas Universais', icon: 'public' },
    { r: 'pesquisa', label: 'Pesquisa de Disciplinas', icon: 'search' }
  ] },
  { group: 'Ferramentas', items: [
    { r: 'generator', label: 'Gerador de Grade', icon: 'edit_calendar' },
    { r: 'board', label: 'Mural de Mensagens', icon: 'forum' }
  ] },
  { group: null, items: [{ r: 'about', label: 'Sobre', icon: 'info' }] }
];
var TITLES = { home: D.student.period, progress: 'Meu Progresso', generator: 'Gerador de Grade', board: 'Mural de Mensagens', 'board-chat': 'Mural de Mensagens', realizadas: 'Disciplinas Realizadas', curriculo: 'Disciplinas do Currículo', universais: 'Disciplinas Universais', pesquisa: 'Pesquisa de Disciplinas', subject: 'Pesquisa de Disciplinas', about: 'Sobre' };
var NAV_OF = { 'board-chat': 'board', subject: 'pesquisa' };
var BACK = { 'board-chat': 'board', subject: 'pesquisa' };
var VIEWS = {};
var SHEETS = {};
var ACT = {};
var FORMS = {};

function parseHash() {
  var h = location.hash.replace(/^#\/?/, '');
  var qi = h.indexOf('?');
  var route = (qi >= 0 ? h.slice(0, qi) : h) || 'home';
  var p = {};
  new URLSearchParams(qi >= 0 ? h.slice(qi + 1) : '').forEach(function (v, k) { p[k] = v; });
  if (!VIEWS[route] && route !== 'login' && route !== 'splash') route = 'home';
  return { route: route, p: p };
}
function buildHash(route, p) {
  var q = new URLSearchParams();
  Object.keys(p || {}).forEach(function (k) { if (p[k] != null && p[k] !== '') q.set(k, p[k]); });
  var s = q.toString();
  return '#/' + route + (s ? '?' + s : '');
}
function baseParams() {
  var b = { theme: S.theme };
  if (FLAGS.embed) b.embed = '1';
  if (FLAGS.capture) b.capture = '1';
  return b;
}
function go(route, extra) {
  var h = buildHash(route, Object.assign(baseParams(), extra || {}));
  if (h === location.hash) apply(); else location.hash = h;
}
function replaceTo(route, extra) {
  var h = buildHash(route, Object.assign(baseParams(), extra || {}));
  if (h === location.hash) apply(); else location.replace(h);
}
function setParam(k, v) {
  var p = Object.assign({}, S.p);
  if (v == null) delete p[k]; else p[k] = v;
  S.p = p;
  history.replaceState(null, '', buildHash(S.route, p));
  syncCtl();
}

/* ================================================================ tema */
function setTheme(t, write) {
  S.theme = t;
  root.dataset.theme = t;
  var tb = $('#themeBtn');
  if (tb) { tb.innerHTML = ic(t === 'dark' ? 'light_mode' : 'dark_mode'); tb.setAttribute('aria-label', t === 'dark' ? 'Usar tema claro' : 'Usar tema escuro'); }
  if (write) setParam('theme', t);
  else syncCtl();
}

/* ============================================================= estrutura */
var SB = '<div class="sb" aria-hidden="true"><span>' + D.now.time + '</span><span class="sb-ic">' +
  '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 13.6 1 6.5a10.2 10.2 0 0 1 14 0z"/></svg>' +
  '<svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M15 1.5v13H2z"/></svg>' +
  '<svg width="9" height="15" viewBox="0 0 9 16" fill="currentColor"><rect x="2.5" y=".5" width="4" height="2" rx=".6"/><rect x=".5" y="2" width="8" height="13.5" rx="1.6"/></svg>' +
  '</span></div>';
var OVERLAYS = '<div class="sheet-root" id="sheetRoot"><div class="scrim" data-act="close-sheet"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section></div>' +
  '<div class="snack" id="snack" role="status" aria-live="polite"></div><div class="gesture" aria-hidden="true"><i></i></div>';

function initials(name) { var w = name.split(' ').filter(Boolean); return (w[0][0] + w[w.length - 1][0]).toUpperCase(); }
function drawerHTML() {
  var s = D.student;
  var h = '<div class="dr-user"><span class="avatar" aria-hidden="true">' + initials(s.name) + '</span><div><div class="dr-name">' + esc(s.name) + '</div><div class="dr-meta">Matrícula ' + s.matricula + '</div><div class="dr-meta">' + esc(s.course) + '</div></div></div>';
  h += '<div class="dr-nav" id="drNav"><span class="dr-hl still" id="drHl" aria-hidden="true"></span>';
  NAV.forEach(function (g) {
    h += g.group ? '<div class="dr-group">' + g.group + '</div>' : '<div class="dr-sep" role="separator"></div>';
    g.items.forEach(function (it) { h += '<button class="dr-item" data-act="nav" data-r="' + it.r + '">' + ic(it.icon) + '<span>' + it.label + '</span></button>'; });
  });
  h += '</div><div class="dr-foot"><button class="dr-item" data-act="logout">' + ic('logout') + '<span>Sair</span></button><span class="dr-ver">Versão ' + D.version + '</span><button class="ib" id="themeBtn" data-act="theme"></button></div>';
  return h;
}

var mode = null;
function ensureShell(m) {
  if (mode === m) return;
  mode = m;
  screenEl.className = 'screen mode-' + m;
  sheetOpen = null; sheetKey = null;
  if (m === 'app') {
    screenEl.innerHTML = SB +
      '<header class="appbar" id="appbar"><button class="ib" id="lead" data-act="lead"></button><h1 id="title"></h1>' +
      '<button class="ib" data-act="go" data-r="about" aria-label="Sobre o AO UERJ">' + aoLogo('logo-sm', 'AO UERJ') + '</button></header>' +
      '<div class="body"><nav class="drawer" id="drawer" aria-label="Menu principal">' + drawerHTML() + '</nav><main class="panel" id="panel"></main></div>' + OVERLAYS;
    setTheme(S.theme, false);
  } else {
    screenEl.innerHTML = SB + '<div class="solo" id="solo"></div>' + OVERLAYS;
  }
}

function updateAppbar() {
  var back = BACK[S.route];
  var lead = $('#lead');
  lead.dataset.mode = back ? 'back' : 'menu';
  lead.innerHTML = ic(back ? 'arrow_back' : (S.drawer ? 'menu_open' : 'menu'));
  lead.setAttribute('aria-label', back ? 'Voltar' : (S.drawer ? 'Fechar menu' : 'Abrir menu'));
  if (back) lead.removeAttribute('aria-expanded'); else lead.setAttribute('aria-expanded', String(S.drawer));
  $('#title').textContent = TITLES[S.route] || '';
}

function markNav(animate) {
  var active = NAV_OF[S.route] || S.route;
  var hit = null;
  $$('#drNav .dr-item').forEach(function (b) {
    var on = b.dataset.r === active;
    if (on) { b.setAttribute('aria-current', 'page'); hit = b; } else b.removeAttribute('aria-current');
  });
  moveHl(hit, animate);
}
function moveHl(el, animate) {
  var hl = $('#drHl');
  if (!hl) return;
  if (!el) { hl.style.opacity = '0'; return; }
  hl.style.opacity = '1';
  if (!animate) hl.classList.add('still');
  hl.style.transform = 'translateY(' + el.offsetTop + 'px)';
  if (!animate) { void hl.offsetWidth; requestAnimationFrame(function () { hl.classList.remove('still'); }); }
}

function setDrawer(open, write) {
  if (mode !== 'app') open = false;
  S.drawer = open;
  screenEl.classList.toggle('drawer-open', open);
  var lead = $('#lead');
  if (lead && lead.dataset.mode === 'menu') {
    lead.innerHTML = ic(open ? 'menu_open' : 'menu');
    lead.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
    lead.setAttribute('aria-expanded', String(open));
  }
  var dr = $('#drawer');
  if (dr) dr.inert = !open;
  if (write) setParam('drawer', open ? '1' : null);
}

/* ================================================================ folhas */
var sheetOpen = null, sheetKey = null, sheetTimer = null;
function sheetHTML(def) {
  return '<div class="sheet-handle" aria-hidden="true"></div><div class="sheet-head"><h2 id="sheetTitle">' + def.title + '</h2>' +
    (def.meta ? '<span class="sheet-meta">' + def.meta + '</span>' : '') +
    '<button class="ib" data-act="close-sheet" aria-label="Fechar">' + ic('close') + '</button></div>' +
    '<div class="sheet-body" id="sheetBody">' + def.body + '</div>' + (def.foot ? '<div class="sheet-foot">' + def.foot + '</div>' : '');
}
function openSheet(name, write) {
  if (mode !== 'app' || !SHEETS[name]) return;
  if (name === 'report' && sheetOpen !== 'report') S.ui.report = S.p.step === '2' && S.route === 'about' ? { step: 2, page: 'Quadro de Notas' } : { step: 1, page: null };
  var def = SHEETS[name]();
  sheetOpen = name;
  clearTimeout(sheetTimer);
  var sh = $('#sheet');
  sh.innerHTML = sheetHTML(def);
  var rootEl = $('#sheetRoot');
  if (FLAGS.capture || reduced) rootEl.classList.add('open');
  else requestAnimationFrame(function () { requestAnimationFrame(function () { rootEl.classList.add('open'); }); });
  if (def.after) def.after();
  if (write && def.hash !== false) setParam('sheet', name);
  setTimeout(function () { var f = $('#sheet .ib'); if (f && !FLAGS.capture) f.focus({ preventScroll: true }); }, 60);
}
function refreshSheet() {
  if (!sheetOpen) return;
  var def = SHEETS[sheetOpen]();
  $('#sheet').innerHTML = sheetHTML(def);
  if (def.after) def.after();
}
function closeSheet(write) {
  var rootEl = $('#sheetRoot');
  if (!rootEl) return;
  rootEl.classList.remove('open');
  sheetOpen = null; sheetKey = null;
  sheetTimer = setTimeout(function () { if (!sheetOpen) { var s = $('#sheet'); if (s) s.innerHTML = ''; } }, 280);
  if (write && S.p.sheet) { var p = Object.assign({}, S.p); delete p.sheet; if (S.route === 'about') delete p.step; S.p = p; history.replaceState(null, '', buildHash(S.route, p)); syncCtl(); }
}
function syncSheet(p) {
  var name = p.sheet || null;
  var key = name ? name + '|' + (name === 'report' ? (p.step || '') : '') : null;
  if (!name) { if (sheetOpen && sheetOpen !== 'select') closeSheet(false); return; }
  if (key !== sheetKey) { sheetOpen = null; openSheet(name, false); sheetKey = key; }
}

/* =============================================================== snackbar */
var snackT = null;
function snack(title, detail, err) {
  var el = $('#snack');
  if (!el) return;
  el.className = 'snack' + (err ? ' err' : '');
  el.innerHTML = ic(err ? 'error' : 'check_circle') + '<div><b>' + esc(title) + '</b>' + (detail ? '<small>' + esc(detail) + '</small>' : '') + '</div>';
  var foot = mode === 'app' ? $('.panel-foot') : null;
  el.style.bottom = ((foot ? foot.offsetHeight : 0) + 24) + 'px';
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(snackT);
  snackT = setTimeout(function () { el.classList.remove('show'); }, 3400);
}

/* ================================================================ avisos */
var NOTICES = {
  updating: { k: 'info', icon: 'sync', spin: true, text: D.copy.updating },
  offline: { k: 'neu', icon: 'cloud_off', text: D.copy.offlineWithData, retry: true },
  'refresh-failed': { k: 'warn', icon: 'sync_problem', text: D.copy.refreshFailed, retry: true },
  blocked: { k: 'bad', icon: 'lock', text: D.copy.blocked, retry: true }
};
function noticeFor(state) {
  var n = NOTICES[state];
  if (!n) return '';
  return '<div class="notice notice-' + n.k + '" role="status">' + ic(n.icon, n.spin ? 'spin' : '') + '<p>' + esc(n.text) + '</p>' +
    (n.retry ? '<button class="notice-act" data-act="retry">Tentar novamente</button>' : '') + '</div>';
}

/* ================================================================= início */
function greet() {
  return '<div class="greet"><h2>Olá, ' + esc(D.student.firstName) + '</h2><p>' + esc(D.now.label) + '</p></div>';
}
function nextSection() {
  var c = D.nextClass(), sh = SHIFT[c.shift];
  /* quando: informação neutra (o acento fica só para ações) */
  var when = c.ongoing ? '<b>Agora</b>' : c.inMinutes != null ? 'Hoje · <b>em ' + dur(c.inMinutes) + '</b>' : '<b>' + c.dayName + '</b>';
  return '<section class="sec" aria-labelledby="hNext"><div class="sec-h"><h2 id="hNext">Próxima aula</h2><span class="sec-when">' + when + '</span></div>' +
    '<button class="card next" data-act="classes" data-id="' + c.subjectId + '" aria-label="' + esc(c.name + ', ' + c.fromTime + ' às ' + c.toTime + ', ' + room(c.location)) + '. Ver disciplinas em curso">' +
    '<span class="next-time"><b>' + c.fromTime + '</b><span>até ' + c.toTime + '</span></span>' +
    '<span class="next-main"><span class="next-name">' + esc(c.name) + '</span>' +
    '<span class="next-row">' + st(sh.k, sh.l) + '<span class="next-meta">' + range(c.fromSlot, c.toSlot) + ' · ' + esc(room(c.location)) + '</span></span>' +
    (place(c.location) ? '<span class="next-meta">' + esc(place(c.location)) + '</span>' : '') + '</span>' +
    chev() + '</button></section>';
}
function lastGrade(g) { return g.result != null ? g.result : g.pf != null ? g.pf : g.p2 != null ? g.p2 : g.p1; }
function lastGradeName(g) { return g.result != null ? 'média' : g.pf != null ? 'PF' : g.p2 != null ? 'P2' : 'P1'; }
function gradeCell(v) {
  if (v == null) return '<td><span class="gp gp-none" aria-label="sem nota">–</span></td>';
  var h = hp(v);
  return '<td><span class="gp gp-' + h.k + '">' + fmt(v) + '</span></td>';
}
function gradesSection() {
  var rows = D.grades.map(function (g) {
    var v = lastGrade(g), h = hp(v);
    /* a saúde diz de qual nota vem: "Bom na P1", "Bom na média" */
    var sub = v == null ? st('neu', 'Sem notas lançadas') : st(h.k, h.l + ' na ' + lastGradeName(g));
    return '<tr><th scope="row"><span class="gt-name">' + esc(g.name) + '</span><span class="gt-sub">' + sub + '</span></th>' +
      gradeCell(g.p1) + gradeCell(g.p2) + gradeCell(g.pf) + gradeCell(g.result) + '</tr>';
  }).join('');
  return '<section class="sec" aria-labelledby="hGrades"><div class="sec-h"><h2 id="hGrades">Notas</h2></div>' +
    '<table class="gt"><caption class="sr">Notas do período ' + D.student.period + '</caption><colgroup><col><col class="n"><col class="n"><col class="n"><col class="n"></colgroup>' +
    '<thead><tr><th scope="col">Disciplina</th><th scope="col">P1</th><th scope="col">P2</th><th scope="col">PF</th><th scope="col">Média</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<p class="legend">' + st('good', 'Bom: 7 ou mais') + st('warn', 'Atenção: 5 a 6,9') + st('bad', 'Crítico: abaixo de 5') + '</p></section>';
}
function weekSection() {
  var days = D.WEEKDAYS.map(function (w) {
    var has = D.schedule.some(function (c) { return c.day === w.n; });
    var today = w.n === D.now.weekday, sel = w.n === S.ui.day;
    return '<button class="day' + (today ? ' today' : '') + '" role="tab" aria-selected="' + sel + '" data-act="day" data-day="' + w.n + '" aria-label="' + w.name + ', ' + dayNum(w.n) + ' de outubro' + (today ? ', hoje' : '') + (has ? '' : ', sem aulas') + '">' +
      '<small>' + w.short + '</small><b>' + dayNum(w.n) + '</b><i class="' + (has ? 'has' : '') + '"></i></button>';
  }).join('');
  return '<section class="sec" aria-labelledby="hWeek"><div class="sec-h"><h2 id="hWeek">Semana</h2><button class="btn btn-text btn-tiny" data-act="share">' + ic('share') + 'Compartilhar grade</button></div>' +
    '<div class="days" role="tablist" aria-label="Dias da semana">' + days + '</div>' +

var CAL_K = 0.8, CAL_PAD = 10; /* 48px por hora; folga para o rótulo da primeira e da última hora */
function dayView(n) {
  var list = D.schedule.filter(function (c) { return c.day === n; });
  var today = n === D.now.weekday, now = D.now.minutes;
  var head = '<p class="dv-head"><span>' + esc(dayLabel(n)) + '</span>' + (today ? '<span class="tag tag-accent">Hoje</span>' : '') +
    (list.length ? '<span class="dv-count">' + plural(list.length, 'aula', 'aulas') + '</span>' : '') + '</p>';
  if (!list.length) return head + '<div class="dv-empty">' + ic('event_available') + '<span>Sem aulas ' + (n === 6 ? 'no sábado' : 'neste dia') + '.</span></div>';
  var first = list[0].start, last = list[list.length - 1].end;
  if (today) { first = Math.min(first, now); last = Math.max(last, now); }
  var lo = Math.floor(first / 60) * 60, hi = Math.ceil(last / 60) * 60;
  function y(m) { return CAL_PAD + (m - lo) * CAL_K; }
  var nowY = today ? y(now) : null, nowDone = false;
  function nowMark() { nowDone = true; return '<div class="cal-now" style="top:' + nowY + 'px"><b aria-hidden="true">' + D.now.time + '</b><i aria-hidden="true"></i><span class="sr">Agora, ' + D.now.time + '</span></div>'; }
  var o = '';

    var hide = nowY != null && Math.abs(y(h) - nowY) < 14;
    o += '<div class="cal-hr' + (hide ? ' muted' : '') + '" style="top:' + y(h) + 'px" aria-hidden="true"><span>' + (h / 60) + 'h</span></div>';
  }
  list.forEach(function (c, i) {
    var prev = list[i - 1];

      var ft = y(prev.end) + 4, fb = y(c.start) - 4, mid = (ft + fb) / 2, pos = '';

      o += '<div class="cal-free' + pos + '" style="top:' + ft + 'px;height:' + (fb - ft) + 'px">Livre · ' + dur(c.start - prev.end) + '</div>';
    }
    if (nowY != null && !nowDone && c.start > now) o += nowMark();
    var sh = SHIFT[c.shift], past = today && c.end <= now, live = today && c.start <= now && c.end > now;
    var tag = past ? st('neu', 'Encerrada', 'check') : live ? st('accent', 'Agora') : st(sh.k, sh.l);
    var label = c.name + ', ' + c.fromTime + ' às ' + c.toTime + ', ' + range(c.fromSlot, c.toSlot) + ', ' + room(c.location) + ', ' + (past ? 'encerrada' : live ? 'agora' : sh.l);
    o += '<button class="cal-ev' + (past ? ' past' : '') + (live ? ' live' : '') + '" style="top:' + (y(c.start) + 1) + 'px;height:' + ((c.end - c.start) * CAL_K - 2) + 'px" data-act="classes" data-id="' + c.subjectId + '" aria-label="' + esc(label) + '">' +
      '<span class="ev-name">' + esc(c.name) + '</span><span class="ev-meta">' + c.fromTime + '–' + c.toTime + ' · ' + range(c.fromSlot, c.toSlot) + ' · ' + esc(room(c.location)) + '</span>' +
      '<span class="ev-st">' + tag + '</span></button>';
  });
  if (nowY != null && !nowDone) o += nowMark();
  return head + '<div class="cal" style="height:' + (y(hi) + CAL_PAD) + 'px">' + o + '</div>';
}

function crChart() {
  var pts = D.craPoints, W = 340, H = 200, L = 30, R = 24, T = 24, B = 30, lo = 5, hi = 9;

  var cra = pts.map(function (p, i) { return x(i).toFixed(1) + ',' + y(p.cra).toFixed(1); }).join(' ');
  var avg = pts.map(function (p, i) { return x(i).toFixed(1) + ',' + y(p.periodAverage).toFixed(1); }).join(' ');
  var adots = pts.map(function (p, i) { return '<circle class="ch-adot" cx="' + x(i) + '" cy="' + y(p.periodAverage) + '" r="2.5"/>'; }).join('');
  var dots = pts.map(function (p, i) {

      '<text class="ch-v" x="' + (valley ? x(i) + 12 : x(i)) + '" y="' + (below ? y(p.cra) + 19 : y(p.cra) - 10) + '">' + fmt(p.cra, 2) + '</text>';

/* passo 5 */
function g5() {
  var g = S.ui.gen, R = D.generator.fetchResults, total = R.length;
  if (!g.fetchDone && !g.fetching) {
    if (FLAGS.capture || reduced) { g.fetched = total; g.fetchDone = true; }
    else {
      g.fetching = true; g.fetched = 0;
      var t = setInterval(function () {
        g.fetched++;
        if (g.fetched >= total) { clearInterval(t); g.fetchDone = true; g.fetching = false; }
        if (S.route === 'generator' && curStep() === 5) refreshPanel();
      }, 380);
    }
  }
  var n = g.fetched, done = n >= total;
  var ok = R.filter(function (r) { return r.eligible; }).length;
  var rows = R.map(function (r, i) {
    if (i >= n) return '<div class="r"><span class="ic fetch-ic wait spin">progress_activity</span><span class="r-main"><span class="r-title">' + esc(r.name) + '</span><span class="r-meta">Buscando…</span></span></div>';
    if (r.eligible) return '<div class="r"><span class="ic fetch-ic ok fill">check_circle</span><span class="r-main"><span class="r-title">' + esc(r.name) + '</span><span class="r-meta">' + r.id + ' · dados carregados</span></span></div>';
    return '<div class="r"><span class="ic fetch-ic no">block</span><span class="r-main"><span class="r-title">' + esc(r.name) + '</span><span class="r-meta r-bad">Recusada: ' + esc(r.reason) + '</span></span></div>';
  }).join('');
  return '<h2 class="step-t" aria-live="polite">' + (done ? 'Dados carregados com sucesso!' : 'Buscando dados das disciplinas') + '</h2>' +
    '<div class="g5-prog"><span class="bar" role="progressbar" aria-label="Disciplinas processadas" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + n + '"><i style="--p:' + (n / total).toFixed(3) + '"></i></span>' +
    '<span>' + n + ' de ' + total + ' disciplinas processadas' + (done ? ' · ' + ok + ' disponíveis, ' + (total - ok) + ' recusada' + (total - ok === 1 ? '' : 's') : '') + '</span></div>' +
    '<div class="rows">' + rows + '</div>';
}

/* passo 7 */
function resInfo(res) {
  return '<div class="rows">' + res.items.map(function (it) {
    var a = D.slot(it.meetings[0].from), sh = SHIFT[D.shiftOf(a.start)];
    return '<div class="r"><span class="r-main">' + nameCode(it.name, it.id, 'Turma ' + it.class) + '<span class="r-meta">' + esc(it.teacher) + '</span>' +
      '<span class="r-facts">' + st(sh.k, sh.l) + '<span>' + meetSummary(it.meetings) + '</span></span></span></div>';
  }).join('') + '</div>';
}
function resGrid(res) {
  var used = [];
  res.items.forEach(function (it) { it.meetings.forEach(function (m) { used.push(slotIdx(m.from), slotIdx(m.to)); }); });
  var lo = Math.min.apply(null, used), hi = Math.max.apply(null, used);
  var days = [1, 2, 3, 4, 5];
  if (res.items.some(function (it) { return it.meetings.some(function (m) { return m.day === 6; }); })) days.push(6);
  var h = '<div class="wk" role="img" aria-label="Grade semanal com ' + res.items.length + ' disciplinas" style="grid-template-columns:34px repeat(' + days.length + ',1fr);grid-template-rows:26px repeat(' + (hi - lo + 1) + ',30px)">';
  h += '<span class="wk-band" style="grid-row:1;grid-column:1/-1"></span>';
  h += days.map(function (d, i) { return '<span class="wk-h" style="grid-row:1;grid-column:' + (i + 2) + '">' + D.WEEKDAYS[d - 1].short + '</span>'; }).join('');
  for (var r = lo; r <= hi; r++) {
    h += '<span class="wk-t" style="grid-row:' + (r - lo + 2) + ';grid-column:1">' + D.SLOTS[r].id + '</span>';
    days.forEach(function (d, i) { h += '<span class="wk-c" style="grid-row:' + (r - lo + 2) + ';grid-column:' + (i + 2) + '"></span>'; });
  }
  res.items.forEach(function (it) {
    it.meetings.forEach(function (m) {
      var a = slotIdx(m.from), b = slotIdx(m.to), sh = SHIFT[D.shiftOf(D.SLOTS[a].start)];
      h += '<span class="wk-b wk-' + sh.k + '" style="grid-row:' + (a - lo + 2) + '/' + (b - lo + 3) + ';grid-column:' + (days.indexOf(m.day) + 2) + '"><b>' + acronym(it.name) + '</b><span>' + range(m.from, m.to) + '</span></span>';
    });
  });
  h += '</div><div class="wk-key">' + res.items.map(function (it) { return '<span><b>' + acronym(it.name) + '</b>' + esc(it.name) + ' · Turma ' + it.class + '</span>'; }).join('') + '</div>';
  return h;
}

function genFoot(step) {

VIEWS.generator = function () {
  var step = curStep();
  var body = [null, function () { return '<h2 class="step-t">Conte-nos um pouco sobre você</h2><p class="step-d">Quantas disciplinas você quer cursar no próximo período? Vale de 1 a 12.</p>' + numQ('min', 'Qual o mínimo de matérias que você quer cursar?') + numQ('max', 'Qual o máximo de matérias que você quer cursar?'); }, g2, g3, g4, g5, g6, g7][step]();
  return {
    cls: 'gen', top: stepsHTML(step), html: body, foot: genFoot(step),
    after: function () {
      /* rola o trilho até o passo atual com 20px de margem (scroll-padding), mostrando o passo anterior inteiro quando
         couber; nunca deixa um rótulo cortado sob a máscara da borda. Refaz quando o Inter termina de carregar. */
      var ol = $('#steps'), cur = ol && ol.querySelector('.cur');
      if (cur) {
        var center = function () {
          if (!cur.isConnected) return;
          var M = 20, base = ol.getBoundingClientRect().left - ol.scrollLeft;
          var b = cur.querySelector('button').getBoundingClientRect();
          var prev = cur.previousElementSibling, pb = prev && prev.querySelector('button').getBoundingClientRect();
          var start = b.left - base, end = b.right - base;
          if (pb && end - (pb.left - base) <= ol.clientWidth - 2 * M) start = pb.left - base;
          if (!prev) start = 0;
          ol.scrollLeft = Math.max(0, start - (prev ? M : 0));
        };
        center();
        if (window.ResizeObserver) new ResizeObserver(center).observe(cur);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(center);
      }
      if (step === 1) paint1();
    }
  };
};

function linkify(t) { return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function dateLabel(at) {
  var p = at.split('/'), d = new Date(+p[2], +p[1] - 1, +p[0]);

  var wd = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'][d.getDay()];
  return wd + ', ' + (+p[0]) + ' de outubro';
}
function msgsHTML(id) {

  /* um grupo por dia: a data fixa no topo fica presa ao seu dia e sai junto com ele */
  var lastDate = null;
  return list.map(function (m, i) {
    var sep = m.at !== lastDate ? (lastDate ? '</div>' : '') + '<div class="day-g"><div class="day-sep"><span>' + dateLabel(m.at) + '</span></div>' : '';

      '<span class="msg-h"><b>' + esc(m.mine ? 'Você' : m.author) + '</b><time>' + m.time + '</time></span><span class="msg-t">' + linkify(m.text) + '</span></div></div>';
  }).join('') + '</div>';
}

var chatRO = null;

function vacCell(label, taken, avail) {
  var h = hp(taken, avail, true), full = taken >= avail, pct = Math.min(100, Math.round(taken / avail * 100));

}
/* horários da turma agrupados por intervalo: "Segunda e Quarta · M3–M4 · 8:50–10:30" */
function turmaSched(list) {
  var groups = [];
  list.forEach(function (s) {
    var a = D.slot(s.slots[0]), b = D.slot(s.slots[s.slots.length - 1]), k = a.id + b.id;
    var g = find(groups, function (x) { return x.k === k; });
    if (g) g.days.push(s.day); else groups.push({ k: k, days: [s.day], t: range(a.id, b.id) + ' · ' + a.from + '–' + b.to });
  });
  return groups.map(function (g) { return '<span class="tt-sch">' + joinPt(g.days) + ' · ' + g.t + '</span>'; }).join('');
}

  setTheme(h.p.theme === 'dark' ? 'dark' : 'light', false);
  var key = h.route + '|' + ['state', 'step', 'tab', 'id', 'from'].map(function (k) { return h.p[k] || ''; }).join('|');
  if (key !== rendered) { rendered = key; renderRoute(); if (sheetOpen === 'select') closeSheet(false); }
  setDrawer(h.p.drawer === '1', false);
  syncSheet(h.p);
  syncCtl();
}

/* ================================================================== ações */
ACT.lead = function (t) {
  if (t.dataset.mode === 'back') {
    if (S.backHash) { var b = S.backHash; S.backHash = null; location.hash = b; }
    else go(S.p.from && S.p.from !== S.route ? S.p.from : BACK[S.route]);
  } else setDrawer(!S.drawer, true);
};
ACT['close-drawer'] = function () { setDrawer(false, true); };
ACT.nav = function (t) {
  var r = t.dataset.r;
  moveHl(t, true);
  setTimeout(function () { go(r); }, FLAGS.capture || reduced ? 0 : 140);
};
ACT.go = function (t) { go(t.dataset.r); };
ACT.logout = function () { go('login'); };
ACT.theme = function () { setTheme(S.theme === 'dark' ? 'light' : 'dark', true); };
ACT.sheet = function (t) { S.ui.focusId = t.dataset.id || null; openSheet(t.dataset.sheet, true); sheetKey = t.dataset.sheet + '|'; };
ACT.classes = function (t) { S.ui.focusId = t.dataset.id || null; openSheet('classes', true); sheetKey = 'classes|'; };
ACT['close-sheet'] = function () { closeSheet(true); };
ACT.day = function (t) { setDay(+t.dataset.day); };
ACT.share = function () { snack('Imagem da grade criada', 'Escolha onde compartilhar no menu do Android.'); };
ACT.retry = function () {
  var n = $('#scroll .notice'), html = noticeFor('updating');
  if (n) n.outerHTML = html; else { var sc = $('#scroll'); if (sc) { sc.insertAdjacentHTML('afterbegin', html); sc.scrollTop = 0; } }
  setTimeout(function () { var p = Object.assign({}, S.p); delete p.state; replaceTo(S.route, p); }, FLAGS.capture ? 0 : 1300);
};
ACT.subject = function (t) {
  if (S.route !== 'subject') S.backHash = location.hash;
  go('subject', { id: t.dataset.id, from: S.route === 'subject' ? S.p.from : S.route });
};
ACT.chat = function (t) { S.backHash = location.hash; go('board-chat', { id: t.dataset.id }); };
ACT.copy = function (t) {
  var m = chatMsgs(chatId())[+t.dataset.i];
  if (!m) return;
  try { if (navigator.clipboard) navigator.clipboard.writeText(m.text).catch(function () {}); } catch (e) { /* demonstração */ }
  snack(D.copy.copied, D.copy.copiedDetail);
};
ACT.curtype = function (t) { S.ui.cur.type = t.dataset.v; refreshPanel(); };
ACT.curtaken = function (t) { S.ui.cur.taken = t.dataset.v === '1'; refreshPanel(); };
ACT.uniclear = function () { S.ui.uni = { dept: '', q: '' }; if (S.p.state === 'empty') { var p = Object.assign({}, S.p); delete p.state; replaceTo('universais', p); } else refreshPanel(); };
ACT.select = function (t) { S.ui.selKey = t.dataset.sel; openSheet('select', false); };
ACT.opt = function (t) { var c = SELECTS[S.ui.selKey](); closeSheet(true); c.set(t.dataset.v); };
ACT.clear = function (t) { var i = document.getElementById(t.dataset.for); if (!i) return; i.value = ''; i.dispatchEvent(new Event('input', { bubbles: true })); i.focus(); };
ACT.pw = function (t) {
  var i = $('#pw'), show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  t.innerHTML = ic(show ? 'visibility_off' : 'visibility');
  t.setAttribute('aria-pressed', String(show));
  t.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
};
ACT.recover = function () { window.open(D.links.passwordRecovery, '_blank', 'noopener'); };
ACT.link = function (t) { window.open(t.dataset.href, '_blank', 'noopener'); };

/* gerador */
ACT['gstep-go'] = function (t) { go('generator', { step: t.dataset.n }); };
ACT.gprev = function () { var s = curStep(); go('generator', { step: Math.max(1, s - 1) }); };
ACT.gnext = function () {
  var s = curStep();
  if (s === 1 && !valid1().ok) return;
  if (s === 6) return go('generator', { step: 7, state: 'ready' });
  go('generator', { step: s + 1 });
};
ACT.gnum = function (t) {
  var g = S.ui.gen, k = t.dataset.k, v = Math.min(12, Math.max(1, (parseInt(g[k], 10) || 0) + (+t.dataset.d)));
  g[k] = String(v);
  var i = $('#g-' + k); if (i) i.value = g[k];
  paint1();
};
ACT.cell = function (t) {
  if (lp && lp.fired && lp.el === t) { lp = null; return; }
  var g = S.ui.gen, key = t.dataset.d + '-' + t.dataset.s;
  if (g.busy.has(key)) g.busy.delete(key); else g.busy.add(key);
  paintBusy();
};
ACT.gshift = function (t) { setShift(t.dataset.k); };
ACT.gclear = function () { S.ui.gen.busy.clear(); paintBusy(); };
ACT.gpreset = function (t) { S.ui.gen.prio = new Set(D.generator.priorityPresets[+t.dataset.i].keys); refreshPanel(); };
ACT.gprio = function (t) {
  var g = S.ui.gen, k = t.dataset.k;
  if (g.prio.has(k)) g.prio.delete(k);
  else {
    g.prio.add(k);
    D.generator.priorities.forEach(function (grp) { if (grp.length > 1 && grp.some(function (o) { return o.key === k; })) grp.forEach(function (o) { if (o.key !== k) g.prio.delete(o.key); }); });
  }
  refreshPanel();
};
ACT.gtype = function (t) { S.ui.gen.type = t.dataset.v; refreshPanel(); };
ACT.gsub = function (t) {
  var g = S.ui.gen, id = t.dataset.id;
  if (g.sel.has(id)) g.sel.delete(id); else g.sel.add(id);
  t.setAttribute('aria-checked', String(g.sel.has(id)));
  $('#g4count').innerHTML = g4count();
  $('#foot').innerHTML = genFoot(4);
};
ACT.gcls = function (t) {
  var g = S.ui.gen, k = t.dataset.k;
  if (g.cls.has(k)) g.cls.delete(k); else g.cls.add(k);
  refreshPanel();
};
ACT.ggen = function () {
  replaceTo('generator', { step: 7, state: 'generating' });
  if (!FLAGS.capture) setTimeout(function () { if (S.route === 'generator' && S.p.state === 'generating') replaceTo('generator', { step: 7 }); }, 1600);
};
ACT.gagain = function () { S.ui.gen.result = (S.ui.gen.result + 1) % D.generator.results.length; ACT.ggen(); };
ACT.gres = function (t) { S.ui.gen.result = +t.dataset.i; refreshPanel(); };
ACT.gtab = function (t) { var p = Object.assign({}, S.p); if (t.dataset.t === 'horarios') p.tab = 'horarios'; else delete p.tab; replaceTo('generator', p); };

/* créditos */
function readCfg() { var c = {}; ['RESTRICTED', 'DEFINED', 'UNIVERSAL'].forEach(function (t) { var i = $('#cfg-' + t); c[t] = Math.max(0, parseInt(i && i.value, 10) || 0); }); return c; }
ACT['cfg-step'] = function (t) { var i = $('#cfg-' + t.dataset.t); i.value = Math.max(0, Math.min(999, (parseInt(i.value, 10) || 0) + (+t.dataset.d))); };
ACT['cfg-reset'] = function () { $$('[data-cfg]').forEach(function (i) { i.value = 0; }); };
ACT['cfg-save'] = function () {
  S.ui.credits = readCfg(); S.ui.creditsSaved = true;
  closeSheet(true);
  if (S.p.state === 'unconfigured') { var p = Object.assign({}, S.p); delete p.state; delete p.sheet; replaceTo('progress', p); }
  else refreshPanel();
  snack('Créditos salvos', 'O progresso foi recalculado.');
};

/* reportar */
ACT['rep-page'] = function (t) { S.ui.report.page = t.dataset.v; var b = $('#sheetBody'), top = b.scrollTop; refreshSheet(); $('#sheetBody').scrollTop = top; var c = $('#repCode'); if (c) c.focus(); };
ACT['rep-next'] = function () { S.ui.report.step = 2; refreshSheet(); var a = $('#repText'); if (a && !FLAGS.capture) a.focus(); };
ACT['rep-back'] = function () { S.ui.report.step = 1; refreshSheet(); };
ACT['rep-send'] = function () {
  var a = $('#repText');
  if (a && !a.value.trim()) { a.closest('.field').classList.add('invalid'); a.focus(); return; }
  closeSheet(true);
  snack('Relato enviado', 'Obrigado por ajudar a melhorar o app.');
};

/* formulários */
FORMS.login = function (f) {
  var m = $('#mat'), p = $('#pw'), errEl = $('#loginErr'), grp = $('#loginGroup');
  grp.classList.remove('invalid');
  [m, p].forEach(function (x) { x.removeAttribute('aria-invalid'); });
  if (!m.value.trim() || !p.value) {
    errEl.innerHTML = ic('error') + esc(D.copy.loginEmpty);
    grp.classList.add('invalid');
    if (!m.value.trim()) m.setAttribute('aria-invalid', 'true');
    if (!p.value) p.setAttribute('aria-invalid', 'true');
    (!m.value.trim() ? m : p).focus();
    return;
  }
  errEl.innerHTML = '';
  var b = f.querySelector('[type="submit"]');
  b.disabled = true; b.setAttribute('aria-busy', 'true');
  b.innerHTML = ic('progress_activity', 'spin') + 'Entrando…';
  setTimeout(function () { go('home'); }, 1200);
};
FORMS.search = function () {
  var v = $('#sq').value.trim().toUpperCase();
  if (!/^([A-Z]{2,5}\d{2}-)?\d{5}$/.test(v)) { snack(D.copy.invalidCode, D.copy.invalidCodeDetail, true); return; }
  var all = D.curriculum.concat(D.universals, D.searchHistory);
  var hit = find(all, function (x) { return x.id === v || x.id.split('-').pop() === v; });
  S.backHash = location.hash;
  go('subject', { id: hit ? hit.id : v, from: 'pesquisa' });
};
FORMS.send = function () {
  var i = $('#msgIn'), v = i.value.trim();
  if (!v) return;
  if (S.ui.msgPeriod !== D.student.period) S.ui.msgPeriod = D.student.period;
  chatMsgs(chatId()).push({ author: 'Marina Albuquerque', at: '13/10/2026', time: D.now.time, text: v, mine: true });
  refreshPanel();
};

/* ======================================================= eventos da tela */
var lp = null;
screenEl.addEventListener('click', function (e) {
  var a = e.target.closest('a[href]');
  if (a && a.closest('.bubble')) return;
  var t = e.target.closest('[data-act]');
  if (!t || !screenEl.contains(t) || t.disabled) return;
  var fn = ACT[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
screenEl.addEventListener('submit', function (e) {
  var f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form](f);
});
screenEl.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset.gnum) { t.value = t.value.replace(/\D/g, '').slice(0, 2); S.ui.gen[t.dataset.gnum] = t.value; paint1(); }
  else if (t.id === 'g4q') { S.ui.gen.q = t.value; $('#g4list').innerHTML = g4list(); $('#g4count').innerHTML = g4count(); }
  else if (t.id === 'curq') { S.ui.cur.q = t.value; $('#curList').innerHTML = curList(); $('#curCount').textContent = curCount(); }
  else if (t.id === 'uniq') { S.ui.uni.q = t.value; $('#uniList').innerHTML = uniList(false); $('#uniCount').textContent = 'Exibindo ' + plural(uniItems().length, 'disciplina', 'disciplinas'); }
  else if (t.dataset.cfg) { t.value = t.value.replace(/\D/g, '').slice(0, 3); }
  else if (t.id === 'msgIn') { var s = $('.send'); if (s) s.disabled = !t.value.trim(); }
  else if (t.id === 'repText') { t.closest('.field').classList.remove('invalid'); }
  else if (t.id === 'mat' || t.id === 'pw') { var lg = $('#loginGroup'); if (lg) lg.classList.remove('invalid'); t.removeAttribute('aria-invalid'); }
});
screenEl.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (sheetOpen) closeSheet(true); else if (S.drawer) setDrawer(false, true); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'mat') { e.preventDefault(); $('#pw').focus(); }
});
screenEl.addEventListener('pointerdown', function (e) {
  var c = e.target.closest('.cell');
  if (!c) return;
  if (lp) clearTimeout(lp.t);
  lp = { el: c, fired: false, t: setTimeout(function () { lp.fired = true; setShift(c.dataset.s[0], +c.dataset.d); if (navigator.vibrate) navigator.vibrate(10); }, 450) };
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
  screenEl.addEventListener(ev, function (e) { if (lp && (ev !== 'pointerleave' || e.target === lp.el)) clearTimeout(lp.t); }, true);
});
screenEl.addEventListener('contextmenu', function (e) { if (e.target.closest('.cell')) e.preventDefault(); });

/* ===================================================== painel de controle */
var CTL = [
  ['Entrada', [['Carregamento', 'splash'], ['Login', 'login'], ['Login · erro', 'login?state=error'], ['Login · entrando', 'login?state=loading']]],
  ['Início', [['Início', 'home'], ['Disciplinas em curso', 'home?sheet=classes'], ['Novidades', 'home?sheet=whatsnew'], ['Menu lateral aberto', 'home?drawer=1'], ['Inscrição (RID parcial)', 'home?state=rid'], ['Carregando', 'home?state=loading'], ['Atualizando', 'home?state=updating'], ['Sem conexão', 'home?state=offline'], ['Falha ao atualizar', 'home?state=refresh-failed'], ['Portal bloqueado', 'home?state=blocked'], ['Bloqueado sem dados', 'home?state=blocked-full'], ['Erro', 'home?state=error'], ['Período não iniciado', 'home?state=not-started']]],
  ['Meu Progresso', [['Meu Progresso', 'progress'], ['Configurar créditos', 'progress?sheet=credits'], ['Créditos sem meta', 'progress?state=unconfigured'], ['Sem conexão', 'progress?state=offline'], ['Carregando', 'progress?state=loading']]],
  ['Gerador de Grade', [['1 · Quantidade', 'generator?step=1'], ['2 · Horários ocupados', 'generator?step=2'], ['3 · Prioridades', 'generator?step=3'], ['4 · Disciplinas', 'generator?step=4'], ['5 · Carregar dados', 'generator?step=5'], ['6 · Turmas', 'generator?step=6'], ['7 · Pronto para gerar', 'generator?state=ready&step=7'], ['7 · Gerando', 'generator?state=generating&step=7'], ['7 · Grades geradas', 'generator?step=7'], ['7 · Horários', 'generator?step=7&tab=horarios'], ['7 · Nenhuma grade', 'generator?state=empty&step=7']]],
  ['Mural de Mensagens', [['Disciplinas', 'board'], ['Conversa', 'board-chat'], ['Conversa vazia', 'board-chat?id=IME02-10871']]],
  ['Disciplinas', [['Realizadas', 'realizadas'], ['Realizadas · períodos', 'realizadas?sheet=period'], ['Realizadas · bloqueado', 'realizadas?state=blocked'], ['Currículo', 'curriculo'], ['Currículo · carregando', 'curriculo?state=loading'], ['Universais', 'universais'], ['Universais · vazio', 'universais?state=empty'], ['Universais · erro', 'universais?state=error'], ['Pesquisa', 'pesquisa'], ['Pesquisa · sem histórico', 'pesquisa?state=empty'], ['Detalhe da disciplina', 'subject']]],
  ['Sobre', [['Sobre', 'about'], ['Reportar problema', 'about?sheet=report'], ['Reportar · passo 2', 'about?sheet=report&step=2']]]
];
function ctlKey(route, p) {
  var skip = ['theme', 'embed', 'capture', 'from'];
  var keys = Object.keys(p).filter(function (k) { return skip.indexOf(k) < 0 && !(k === 'id' && route !== 'board-chat'); }).sort();
  return route + '?' + keys.map(function (k) { return k + '=' + p[k]; }).join('&');
}
function buildCtl() {
  $('#ctl').innerHTML = '<div class="ctl-head"><span class="ctl-mark">' + aoLogo('', 'AO UERJ') + '</span><div><h1>Agenda limpa</h1><p>AO UERJ · variante 3 de 3</p></div>' +
    '<button class="ib ctl-close" type="button" data-ctl-close aria-label="Fechar controles">' + ic('close') + '</button></div>' +
    '<p class="ctl-desc">Inspirada em Notion Calendar, Todoist e Apple Calendário: tipografia clara, fios finos, listas no lugar de cards e o dia como régua de horas. O azul UERJ, o painel de canto arredondado e o menu lateral continuam como hoje.</p>' +
    '<div class="seg2" role="group" aria-label="Tema"><button type="button" data-theme-set="light">' + ic('light_mode') + 'Claro</button><button type="button" data-theme-set="dark">' + ic('dark_mode') + 'Escuro</button></div>' +
    '<nav class="ctl-nav" id="ctlNav" aria-label="Telas e estados"></nav><p class="ctl-foot">' + esc(D.note) + '</p>';
}
function syncCtl() {
  var nav = $('#ctlNav');
  if (!nav) return;
  var cur = ctlKey(S.route, S.p);
  nav.innerHTML = CTL.map(function (g) {
    return '<div class="ctl-g"><h2>' + g[0] + '</h2><ul>' + g[1].map(function (it) {
      var parts = it[1].split('?'), p = {};
      new URLSearchParams(parts[1] || '').forEach(function (v, k) { p[k] = v; });
      var on = ctlKey(parts[0], p) === cur;
      return '<li><a href="' + buildHash(parts[0], Object.assign({}, p, { theme: S.theme })) + '"' + (on ? ' aria-current="true"' : '') + '>' + esc(it[0]) + '</a></li>';
    }).join('') + '</ul></div>';
  }).join('');
  $$('[data-theme-set]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.themeSet === S.theme)); });
}
document.addEventListener('click', function (e) {
  var tb = e.target.closest('[data-theme-set]');
  if (tb) { setTheme(tb.dataset.themeSet, true); return; }
  var ctl = $('#ctl'), fab = $('#fab');
  if (e.target.closest('#fab')) { var o = !ctl.classList.contains('open'); ctl.classList.toggle('open', o); fab.setAttribute('aria-expanded', String(o)); return; }
  if (e.target.closest('[data-ctl-close]') || (e.target.closest('.ctl a') && ctl.classList.contains('open'))) { ctl.classList.remove('open'); fab.setAttribute('aria-expanded', 'false'); }
});

/* ================================================================= início */
function layout() {
  var framed = !FLAGS.embed && window.innerWidth >= 900;
  root.classList.toggle('framed', framed);
  if (framed) {
    var s = Math.min(1, (window.innerHeight - 32) / 916, (window.innerWidth - 340 - 40 - 64) / 436);
    root.style.setProperty('--s', Math.max(0.5, s).toFixed(4));
  }
  var ctl = $('#ctl');
  if (framed && ctl) ctl.classList.remove('open');
}
var boot = parseHash();
FLAGS.embed = boot.p.embed === '1';
FLAGS.capture = boot.p.capture === '1';
root.classList.toggle('embed', FLAGS.embed);
root.classList.toggle('capture', FLAGS.capture);
buildCtl();
layout();
window.addEventListener('resize', layout);
window.addEventListener('hashchange', apply);
apply();
})();
</script>
</body>
