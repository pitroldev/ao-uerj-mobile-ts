<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AO UERJ · Variante 1 · Material</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-25..0&display=block">
<style>
/* ============================================================ tokens */
:root {
  color-scheme: light;
  /* chão azul UERJ (cabeçalho, barra de status, menu lateral) */
  --uerj: #003468;
  --on-uerj: #FFFFFF;
  --on-uerj-2: #C5D3E8;
  --drawer-pill: #1F5BA3;
  --drawer-pill-on: #FFFFFF;
  --drawer-rule: rgba(255,255,255,.14);

  /* esquema tonal Material 3, semente no azul UERJ */
  --primary: #1F5BA3;
  --on-primary: #FFFFFF;
  --primary-cont: #D6E3FF;
  --on-primary-cont: #001B3E;
  --on-primary-cont-2: #2A4A77;
  --sec-cont: #DAE2F2;
  --on-sec-cont: #131C2B;
  --surface: #F8F9FD;
  --surface-low: #F2F4FA;
  --surface-cont: #EEF1F7;
  --surface-high: #E7EAF1;
  --surface-highest: #E1E4EB;
  --card: #FFFFFF;
  --sheet: #F2F4FA;
  --on-surface: #191C20;
  --on-surface-2: #44474E;
  --outline: #74777F;
  --outline-var: #C3C7D0;
  --cell-line: #878A92;
  --error: #BA1A1A;
  --error-cont: #FFDAD6;
  --on-error-cont: #410002;
  --inverse-surface: #2E3036;
  --inverse-on: #EFF0F7;
  --inverse-primary: #A9C7FF;
  --elev-1: 0 1px 2px rgba(10, 30, 60, .08), 0 1px 3px 1px rgba(10, 30, 60, .05);
  --elev-3: 0 4px 8px 3px rgba(10, 30, 60, .10), 0 1px 3px rgba(10, 30, 60, .14);
  --shimmer: rgba(255,255,255,.55);

  /* pastéis de significado (herdados do app atual, afinados) */
  --good: #D7F2DE;  --on-good: #0B3A1C;  --good-ink: #1C6B37;
  --good-bar: #2E8B4A; --warn-bar: #C99400; --crit-bar: #C8352D;
  --warn: #FBEFC4;  --on-warn: #3F3000;  --warn-ink: #7A5C00;
  --crit: #FADCDC;  --on-crit: #5A1015;  --crit-ink: #B3261E;
  --neutral: #E4E6EB; --on-neutral: #33373E; --neutral-ink: #5D6169;
  --morning: #FBF3C8; --on-morning: #3D3300; --morning-ink: #6B5A00;
  --afternoon: #FFE5D0; --on-afternoon: #4A2800; --afternoon-ink: #8A4B00;
  --night: #D5EEFA; --on-night: #00334A; --night-ink: #00658E;

  /* moldura de apresentação */
  --page: #E4E8EF;
  --page-ink: #191C20;
  --page-ink-2: #4A4F58;
  --page-rule: #C9CED8;

  --ease: cubic-bezier(.2, 0, 0, 1);
  --font: "Roboto Flex", Roboto, system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --uerj: #0A2A55;
  --on-uerj: #E9EEF8;
  --on-uerj-2: #A9BAD6;
  --drawer-pill: #23508E;
  --drawer-pill-on: #D6E3FF;
  --drawer-rule: rgba(255,255,255,.10);

  --primary: #A9C7FF;
  --on-primary: #003063;
  --primary-cont: #0E4280;
  --on-primary-cont: #D6E3FF;
  --on-primary-cont-2: #B6CBEE;
  --sec-cont: #3B4658;
  --on-sec-cont: #D8E3F8;
  --surface: #111318;
  --surface-low: #191C20;
  --surface-cont: #1D2026;
  --surface-high: #272A30;
  --surface-highest: #32353B;
  --card: #1D2026;
  --sheet: #1D2026;
  --on-surface: #E2E2E9;
  --on-surface-2: #C4C6D0;
  --outline: #8E9099;
  --outline-var: #43474E;
  --cell-line: #6E727B;
  --error: #FFB4AB;
  --error-cont: #5C1A1F;
  --on-error-cont: #FFDAD6;
  --inverse-surface: #E2E2E9;
  --inverse-on: #2E3036;
  --inverse-primary: #1F5BA3;
  --elev-1: none;
  --elev-3: 0 4px 12px 2px rgba(0,0,0,.45);
  --shimmer: rgba(255,255,255,.06);

  --good: #1F3A28;  --on-good: #BDEBC9;  --good-ink: #8FD6A5;
  --good-bar: #6CC488; --warn-bar: #E3C46A; --crit-bar: #F08A85;
  --warn: #3B331A;  --on-warn: #F2DF9F;  --warn-ink: #E3C46A;
  --crit: #4A2328;  --on-crit: #FFCDCF;  --crit-ink: #FF9C9C;
  --neutral: #2C3037; --on-neutral: #D0D3DA; --neutral-ink: #A9ADB5;
  --morning: #383316; --on-morning: #F0E3A0; --morning-ink: #DCCB6E;
  --afternoon: #40291A; --on-afternoon: #FFD2B0; --afternoon-ink: #F2B07C;
  --night: #15323F; --on-night: #B5E3F7; --night-ink: #7FCBEB;

  --page: #090B0F;
  --page-ink: #E2E2E9;
  --page-ink-2: #A4A9B4;
  --page-rule: #262A31;
}

/* ============================================================ base */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-optical-sizing: auto;
  font-size: 14px;
  line-height: 20px;
  background: var(--page);
  color: var(--on-surface);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); text-underline-offset: 3px; }
::selection { background: var(--primary-cont); color: var(--on-primary-cont); }
input, textarea { caret-color: var(--primary); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.appbar :focus-visible, .drawer :focus-visible, .login-top :focus-visible { outline-color: #FFFFFF; }
* { scrollbar-width: thin; scrollbar-color: var(--outline-var) transparent; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--outline-var); border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }
.num, .tnum { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3, p { margin: 0; }
h2, h3 { text-wrap: balance; }

.ms {
  font-family: "Material Symbols Rounded";
  font-weight: normal; font-style: normal;
  font-size: 24px; line-height: 1;
  letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap; direction: ltr;
  font-feature-settings: "liga"; -webkit-font-feature-settings: "liga";
  font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
  -webkit-font-smoothing: antialiased;
  user-select: none; flex: none;
  width: 1em; height: 1em; overflow: hidden;
}
.ms.fill { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
.ms.s18 { font-size: 18px; } .ms.s20 { font-size: 20px; } .ms.s16 { font-size: 16px; }

/* escala de tipos Material 3 */
.t-hl-s { font-size: 24px; line-height: 32px; font-weight: 400; }
.t-hl-m { font-size: 28px; line-height: 36px; font-weight: 400; }
.t-ti-l { font-size: 22px; line-height: 28px; font-weight: 400; }
.t-ti-m { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .01em; }
.t-ti-s { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .007em; }
.t-bo-l { font-size: 16px; line-height: 24px; font-weight: 400; }
.t-bo-m { font-size: 14px; line-height: 20px; font-weight: 400; }
.t-bo-s { font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: .02em; }
.t-la-l { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .007em; }
.t-la-m { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .03em; }
.muted { color: var(--on-surface-2); }

/* ============================================================ moldura */
.stage {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  gap: 64px; padding: 16px 32px;
}
.device {
  position: relative; flex: none;
  width: 412px; height: 892px;
  border-radius: 36px; overflow: hidden;
  background: var(--uerj);
  box-shadow: 0 0 0 8px #0E1014, 0 0 0 9px #30343B, 0 28px 60px -18px rgba(0,0,0,.5);
  isolation: isolate;
}
.ctrl {
  width: 300px; flex: none;
  color: var(--page-ink);
  display: flex; flex-direction: column; gap: 20px;
  max-height: calc(100vh - 32px); overflow: auto; padding: 4px 4px 4px 0;
}
.ctrl h1 { font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.ctrl h1 svg { width: 40px; color: var(--page-ink); }
.ctrl .lede { color: var(--page-ink-2); font-size: 14px; line-height: 20px; margin-top: 6px; max-width: 38ch; }
.ctrl .seg { --seg-line: var(--page-rule); height: 40px; border-radius: 20px; }
.ctrl nav { display: flex; flex-direction: column; gap: 14px; }
.ctrl nav h2 { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--page-ink); margin-bottom: 4px; }
.ctrl nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.ctrl nav a {
  display: inline-flex; align-items: center; min-height: 28px; padding: 2px 10px;
  border-radius: 8px; border: 1px solid var(--page-rule);
  color: var(--page-ink); text-decoration: none; font-size: 12.5px; line-height: 16px;
}
.ctrl nav a:hover { background: color-mix(in srgb, var(--page-ink) 7%, transparent); }
.ctrl nav a[aria-current="true"] { background: var(--page-ink); color: var(--page); border-color: var(--page-ink); }
.ctrl .note { font-size: 12px; color: var(--page-ink-2); border-top: 1px solid var(--page-rule); padding-top: 12px; }
.ctrl > * { flex: none; }
.ctrl-fab, .ctrl .ctrl-close { display: none; }

@media (max-width: 899px) {
  .stage { display: block; padding: 0; min-height: 0; }
  .device { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; zoom: 1 !important; }
  .ctrl {
    position: fixed; inset: auto 8px 8px 8px; z-index: 200; width: auto; max-height: 78vh;
    background: var(--page); border-radius: 20px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.4);
    transform: translateY(110%); transition: transform 220ms var(--ease);
  }
  .ctrl.open { transform: none; }
  .ctrl .ctrl-close { display: inline-grid; position: absolute; top: 8px; right: 8px; }
  .ctrl-fab {
    display: grid; place-items: center; position: fixed; right: 12px; bottom: 96px; z-index: 150;
    width: 40px; height: 40px; border-radius: 12px; border: 0;
    background: rgba(20,24,32,.78); color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
}
html.embed .stage { display: block; padding: 0; min-height: 0; }
html.embed .device { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; zoom: 1 !important; }
html.embed .ctrl, html.embed .ctrl-fab, html.capture .ctrl-fab { display: none !important; }

html.capture *, html.capture *::before, html.capture *::after,
html.no-motion *, html.no-motion *::before, html.no-motion *::after {
  transition: none !important; animation: none !important;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
}

/* ============================================================ app shell */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--uerj); overflow: hidden; }
.statusbar {
  height: 28px; flex: none; position: relative; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px 0 22px; color: #FFFFFF; background: var(--uerj);
  font-size: 14px; font-weight: 500; letter-spacing: .02em;
}
.statusbar svg { display: block; }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.area { position: relative; flex: 1; min-height: 0; }

.drawer {
  /* abaixo do cabeçalho: no app o Header é global e fica parado */
  position: absolute; inset: 64px auto 0 0; width: 304px;
  background: var(--uerj); color: var(--on-uerj);
  display: flex; flex-direction: column;
  padding: 8px 12px 24px;
}
.drawer-user { display: flex; gap: 14px; align-items: center; padding: 12px 12px 18px; }
.avatar {
  width: 48px; height: 48px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--primary-cont); color: var(--on-primary-cont);
  font-size: 18px; font-weight: 500; letter-spacing: .02em;
}
.drawer .avatar { background: #D6E3FF; color: #001B3E; }
.drawer-user .nm { font-size: 16px; line-height: 22px; font-weight: 500; }
.drawer-user .mt { font-size: 12px; line-height: 16px; color: var(--on-uerj-2); margin-top: 2px; }
.drawer-nav { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 8px; scrollbar-width: none; }
.drawer-sec { font-size: 13px; line-height: 20px; font-weight: 500; color: var(--on-uerj-2); padding: 14px 16px 6px; letter-spacing: .01em; }
.drawer-rule { height: 1px; background: var(--drawer-rule); margin: 8px 16px; }
.drawer-item {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 12px;
  width: 100%; height: 48px; padding: 0 16px; border: 0; border-radius: 24px;
  background: transparent; color: var(--on-uerj); text-align: left;
  font-size: 15px; font-weight: 400; letter-spacing: .01em; text-decoration: none;
  transition: color 200ms var(--ease);
}
.drawer-item .ms { color: var(--on-uerj-2); transition: color 200ms var(--ease); }
.drawer-item:hover { background: rgba(255,255,255,.06); }
.drawer-item[aria-current="page"] { color: var(--drawer-pill-on); font-weight: 500; }
.drawer-item[aria-current="page"] .ms { color: var(--drawer-pill-on); font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
.drawer-pill {
  position: absolute; left: 0; right: 0; top: 0; height: 48px; z-index: 0;
  border-radius: 24px; background: var(--drawer-pill);
  transition: transform 220ms var(--ease), opacity 150ms;
}
.drawer-foot { border-top: 1px solid var(--drawer-rule); padding-top: 8px; margin: 0 4px; }
.drawer-foot .drawer-item { margin: 0 -4px; width: calc(100% + 8px); }
.drawer-ver { font-size: 12px; color: var(--on-uerj-2); padding: 4px 16px 0; }

.screen {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column;
  background: var(--uerj);
  transition: transform 240ms var(--ease), box-shadow 240ms var(--ease);
}
.drawer-open .screen { transform: translateX(304px); }
/* o cabeçalho compensa o deslocamento da tela (mesma curva e duração): só o painel desliza, como no app */
.screen > .appbar { transition: transform 240ms var(--ease); }
.drawer-open .screen > .appbar { transform: translateX(-304px); }
/* fora do #screen: o painel fica inert com o menu aberto, mas a faixa visível ainda fecha o menu */
.screen-shield { display: none; position: absolute; inset: 64px 0 0 304px; z-index: 3; background: transparent; border: 0; }
.drawer-open .screen-shield { display: block; }

.appbar {
  height: 64px; flex: none;
  display: grid; grid-template-columns: 56px 1fr 56px; align-items: center;
  padding: 0 4px; color: #FFFFFF;
}
.appbar h1 { font-size: 20px; line-height: 28px; font-weight: 400; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .005em; }
.appbar .icon-btn { color: #FFFFFF; }
.logo-btn svg { width: 40px; height: 24px; display: block; color: #FFFFFF; }

.panel {
  position: relative; flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  background: var(--surface);
  border-top-left-radius: 48px;
  padding: 28px 16px 48px;
  /* sombra só para a esquerda quando o menu abre (não invade o cabeçalho) */
  clip-path: inset(0 0 0 -64px);
  transition: box-shadow 240ms var(--ease);
}
.drawer-open .panel { box-shadow: -10px 0 30px rgba(0,0,0,.30); }
.panel.has-bar { padding-bottom: 112px; }
.panel.flush { padding-left: 0; padding-right: 0; }
.bottom-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface-cont);
  padding: 12px 16px 28px;
  display: flex; gap: 12px; align-items: center;
  border-top: 1px solid var(--outline-var);
}
.gesture { position: absolute; left: 0; right: 0; bottom: 0; height: 20px; z-index: 90; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.gesture i { width: 108px; height: 4px; border-radius: 2px; background: var(--on-surface); opacity: .4; }
.gesture.on-blue i { background: #FFFFFF; opacity: .55; }

/* ============================================================ componentes */
/* state layer: recortado pelo próprio raio, sem overflow:hidden (que cortaria a extensão de alvo dos chips) */
.sl { position: relative; }
.sl::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity 150ms; pointer-events: none; }
.sl:hover::after { opacity: .08; }
.sl:active::after { opacity: .12; }

.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0;
  display: inline-grid; place-items: center; background: transparent; color: var(--on-surface-2);
}
.icon-btn.filled { background: var(--primary); color: var(--on-primary); }
.icon-btn.tonal { background: var(--sec-cont); color: var(--on-sec-cont); }
.icon-btn[disabled] { opacity: .38; cursor: default; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 24px; border-radius: 24px; border: 0;
  font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .01em;
  text-decoration: none; white-space: nowrap;
}
.btn .ms { font-size: 18px; margin-left: -4px; }
.btn .ms.after { margin: 0 -4px 0 0; }
a.card, a.item, a.li { color: inherit; text-decoration: none; }
a.card { display: block; }
.btn.sm { height: 48px; padding: 0 16px; border-radius: 24px; }
.btn.block { width: 100%; }
.btn.filled { background: var(--primary); color: var(--on-primary); }
.btn.tonal { background: var(--sec-cont); color: var(--on-sec-cont); }
.btn.outlined { background: transparent; color: var(--primary); box-shadow: inset 0 0 0 1px var(--outline); }
.btn.text { background: transparent; color: var(--primary); padding: 0 12px; }
.btn.text.sm { padding: 0 12px; }
.btn[disabled], .btn.is-disabled { background: color-mix(in srgb, var(--on-surface) 12%, transparent); color: color-mix(in srgb, var(--on-surface) 50%, transparent); box-shadow: none; cursor: default; }
.btn.text[disabled] { background: transparent; }
.btn.outlined[disabled] { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-surface) 14%, transparent); }
.btn.danger { color: var(--error); }

.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.card { background: var(--card); border-radius: 16px 4px 16px 16px; box-shadow: var(--elev-1); }
.card.pad { padding: 16px; }
.card.filled { background: var(--surface-cont); box-shadow: none; }
.card.outline { background: transparent; box-shadow: inset 0 0 0 1px var(--outline-var); }

.sec { margin-top: 28px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; margin: 0 0 10px 4px; }
.sec-h h2 { font-size: 18px; line-height: 24px; font-weight: 500; letter-spacing: 0; }
.sec-h .sub { font-size: 12px; line-height: 16px; color: var(--on-surface-2); margin-top: 2px; font-weight: 400; }

.chip {
  position: relative; display: inline-flex; align-items: center; gap: 8px; flex: none;
  height: 32px; padding: 0 16px; border-radius: 8px;
  border: 1px solid var(--outline-var); background: transparent; color: var(--on-surface-2);
  font-size: 14px; line-height: 20px; font-weight: 500; white-space: nowrap; letter-spacing: .01em;
}
.chip::before { content: ""; position: absolute; inset: -8px -2px; }
.chip .ms { font-size: 18px; }
.chip.sel { background: var(--sec-cont); border-color: transparent; color: var(--on-sec-cont); padding-left: 8px; }
.chip.lead { padding-left: 8px; gap: 6px; }
.chip.assist { color: var(--on-surface); }
.chips { position: relative; display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 24px; padding: 0 8px 0 6px; border-radius: 8px 2px 8px 8px;
  font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .02em; white-space: nowrap;
}
.tag .ms { font-size: 16px; }
.tag.plain { padding: 0 8px; }
.tag.good { background: var(--good); color: var(--on-good); }
.tag.warn { background: var(--warn); color: var(--on-warn); }
.tag.crit { background: var(--crit); color: var(--on-crit); }
.tag.neutral { background: var(--neutral); color: var(--on-neutral); }
.tag.info { background: var(--primary-cont); color: var(--on-primary-cont); }
.tag.morning { background: var(--morning); color: var(--on-morning); }
.tag.afternoon { background: var(--afternoon); color: var(--on-afternoon); }
.tag.night { background: var(--night); color: var(--on-night); }
.tag.line { background: transparent; box-shadow: inset 0 0 0 1px var(--outline-var); color: var(--on-surface-2); }

/* campos contornados (canto superior direito reto, como no app) */
.field {
  position: relative; display: flex; align-items: center;
  min-height: 56px; border-radius: 12px 4px 12px 12px;
  box-shadow: inset 0 0 0 1px var(--outline);
  background: transparent; transition: box-shadow 150ms;
  --fbg: var(--surface);
}
.field:hover { box-shadow: inset 0 0 0 1px var(--on-surface); }
.field:focus-within { box-shadow: inset 0 0 0 2px var(--primary); }
.field.err { box-shadow: inset 0 0 0 2px var(--error); }
.field > .lead { margin-left: 14px; color: var(--on-surface-2); }
.field input, .field select, .field textarea {
  flex: 1; min-width: 0; height: 56px; border: 0; outline: none; background: transparent;
  padding: 0 14px; font-size: 16px; line-height: 24px; color: var(--on-surface);
}
.field textarea { height: auto; min-height: 128px; padding: 18px 14px 12px; resize: none; }
.field select { appearance: none; -webkit-appearance: none; padding-right: 44px; cursor: pointer; }
.field select option { background: var(--surface); color: var(--on-surface); }
.field .trail { position: absolute; right: 12px; pointer-events: none; color: var(--on-surface-2); }
.field .clear { margin-right: 4px; }
.field .clear[hidden] { display: none; }
.field input::placeholder, .field textarea::placeholder { color: var(--on-surface-2); opacity: 1; }
.field.lbl input::placeholder, .field.lbl textarea::placeholder { color: transparent; }
.field.lbl:focus-within input::placeholder, .field.lbl:focus-within textarea::placeholder { color: var(--on-surface-2); }
.field > label {
  position: absolute; left: 14px; top: 28px; transform: translateY(-50%); transform-origin: left center;
  font-size: 16px; line-height: 24px; color: var(--on-surface-2);
  pointer-events: none; padding: 0 4px; margin-left: -4px;
  background: var(--fbg); border-radius: 4px;
  transition: transform 150ms var(--ease), color 150ms;
}
.field > .lead ~ label { left: 50px; }
/* rótulo flutuante só com transform (sem animar top/left/font-size) */
.field.up > label, .field:focus-within > label, .field.has-ta > label { transform: translateY(calc(-50% - 28px)) scale(.75); }
.field.up > .lead ~ label, .field:focus-within > .lead ~ label { transform: translate(-36px, calc(-50% - 28px)) scale(.75); }
.field:focus-within > label { color: var(--primary); }
.field.err > label { color: var(--error); }
.help { font-size: 12px; line-height: 16px; color: var(--on-surface-2); padding: 4px 16px 0; display: flex; gap: 6px; align-items: flex-start; }
.help.err { color: var(--error); }
.help .ms { font-size: 16px; margin-top: 0; }
.sheet .field { --fbg: var(--sheet); }

.switch {
  position: relative; display: block; flex: none; width: 52px; height: 32px; border-radius: 16px; padding: 0;
  border: 2px solid var(--outline); background: var(--surface-highest);
  transition: background 200ms, border-color 200ms;
}
.switch::before {
  content: ""; position: absolute; top: 50%; left: 2px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--outline); transform: translateY(-50%) scale(.667);
  transition: transform 200ms var(--ease), background 200ms;
}
.switch[aria-checked="true"], [aria-checked="true"] > .switch { background: var(--primary); border-color: var(--primary); }
.switch[aria-checked="true"]::before, [aria-checked="true"] > .switch::before { transform: translate(20px, -50%) scale(1); background: var(--on-primary); }

.cb {
  width: 18px; height: 18px; border-radius: 2px; flex: none;
  box-shadow: inset 0 0 0 2px var(--on-surface-2);
  display: grid; place-items: center; color: var(--on-primary);
}
.cb .ms { font-size: 16px; opacity: 0; font-variation-settings: "FILL" 0, "wght" 600, "GRAD" 0, "opsz" 20; }
[aria-checked="true"] > .cb, [aria-pressed="true"] > .cb, .cb.on { background: var(--primary); box-shadow: none; }
[aria-checked="true"] > .cb .ms, [aria-pressed="true"] > .cb .ms, .cb.on .ms { opacity: 1; }
.cb-wrap { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; margin: -4px -8px -4px -10px; }

.seg { display: flex; height: 48px; border-radius: 24px; box-shadow: inset 0 0 0 1px var(--outline); overflow: hidden; }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--on-surface);
  display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px;
  font-size: 14px; font-weight: 500; letter-spacing: .01em; white-space: nowrap;
}
.seg button + button { box-shadow: inset 1px 0 0 var(--outline); }
.seg button[aria-pressed="true"] { background: var(--sec-cont); color: var(--on-sec-cont); }
.seg .ms { font-size: 18px; }

.tabs { display: flex; box-shadow: inset 0 -1px 0 var(--outline-var); }
.tab { position: relative; flex: 1; height: 48px; border: 0; background: transparent; color: var(--on-surface-2); font-size: 14px; font-weight: 500; letter-spacing: .01em; display: flex; align-items: center; justify-content: center; gap: 8px; }
.tab[aria-selected="true"] { color: var(--primary); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; bottom: 0; left: 50%; width: 64px; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); transform: translateX(-50%); }

.lp { position: relative; height: 4px; border-radius: 2px; background: var(--sec-cont); overflow: hidden; }
.lp > i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 2px; background: var(--primary); transform-origin: left center; transition: transform 250ms var(--ease); }
.lp.ind > i { width: 40%; animation: lp-ind 1.4s var(--ease) infinite; }
@keyframes lp-ind { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
html.capture .lp.ind > i { transform: translateX(50%); }
/* "Atualizando": indicador linear de 4px colado no topo do painel, sem cartão */
.panel-progress { position: sticky; top: -28px; z-index: 5; height: 4px; margin: -28px -16px 24px; border-radius: 0; background: var(--sec-cont); }
.panel-progress > i { background: var(--primary); }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-highest); overflow: hidden; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--primary); }
.bar.good > i { background: var(--good-bar); } .bar.warn > i { background: var(--warn-bar); } .bar.crit > i { background: var(--crit-bar); }

.li {
  display: flex; align-items: center; gap: 16px; width: 100%;
  min-height: 56px; padding: 8px 16px; border: 0; background: transparent;
  text-align: left; color: var(--on-surface); text-decoration: none;
}
.li > .ms { color: var(--on-surface-2); }
.li .txt { flex: 1; min-width: 0; }
.li .hd { display: block; font-size: 16px; line-height: 24px; }
.li .sp { display: block; font-size: 14px; line-height: 20px; color: var(--on-surface-2); }
.li .tr { color: var(--on-surface-2); font-size: 12px; }
.list-card { padding: 4px 0; overflow: hidden; }
.list-card .li + .li { box-shadow: inset 0 1px 0 var(--outline-var); }
.divider { height: 1px; background: var(--outline-var); margin: 0; border: 0; }

.notice {
  display: grid; grid-template-columns: 24px 1fr; gap: 2px 12px; align-items: start;
  padding: 12px 8px 6px 14px; margin: 0 0 16px;
  border-radius: 12px 4px 12px 12px;
  background: var(--surface-high); color: var(--on-surface);
}
.notice > .ms { margin-top: -2px; color: var(--on-surface-2); font-size: 22px; }
.notice p { font-size: 14px; line-height: 20px; padding-right: 6px; }
.notice .acts { grid-column: 2; display: flex; justify-content: flex-end; margin-right: -4px; }
.notice.solo { padding-bottom: 12px; }
.notice.info { background: var(--primary-cont); color: var(--on-primary-cont); } .notice.info > .ms { color: var(--on-primary-cont); }
.notice.info .btn.text { color: var(--on-primary-cont); }

/* aviso fino de estado dos dados: uma linha de 48px; tocar expande o texto completo */
.banner { margin: 0 0 16px; border-radius: 12px 4px 12px 12px; background: var(--surface-high); color: var(--on-surface); }
.banner-row { display: flex; align-items: center; min-height: 48px; }
.banner-main {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; align-self: stretch;
  min-height: 48px; padding: 4px 2px 4px 12px; border: 0; background: transparent; color: inherit; text-align: left;
  border-radius: 12px 0 0 12px;
}
.banner.open .banner-main { border-radius: 12px 0 0 0; }
.banner-main > .ms { font-size: 20px; color: var(--on-surface-2); }
.banner-main .sum { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }
.banner-main .sum b { font-weight: 500; }
.banner-main .chev { margin-left: -6px; transition: transform 200ms var(--ease); }
.banner.open .banner-main .chev { transform: rotate(180deg); }
.banner .icon-btn { color: inherit; }
.banner-more { padding: 0 16px 12px 42px; font-size: 13px; line-height: 19px; }
.banner.warn { background: var(--warn); color: var(--on-warn); } .banner.warn .banner-main > .ms { color: var(--warn-ink); }
.banner.crit { background: var(--crit); color: var(--on-crit); } .banner.crit .banner-main > .ms { color: var(--crit-ink); }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 36px 20px 28px; }
.empty .ic { width: 72px; height: 72px; border-radius: 50%; background: var(--surface-high); display: grid; place-items: center; }
.empty .ic .ms { font-size: 34px; color: var(--on-surface-2); }
.empty .ic.crit { background: var(--crit); } .empty .ic.crit .ms { color: var(--crit-ink); }
.empty p { max-width: 34ch; color: var(--on-surface-2); font-size: 15px; line-height: 22px; }
.inline-empty { display: flex; gap: 12px; align-items: center; padding: 16px; color: var(--on-surface-2); font-size: 14px; line-height: 20px; }

.sk { position: relative; overflow: hidden; background: var(--surface-high); border-radius: 8px; }
.sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, var(--shimmer), transparent); animation: shimmer 1.3s ease-in-out infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }

.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv > div { display: flex; flex-direction: column; gap: 2px; }
.kv dt, .kv .k { font-size: 12px; line-height: 16px; color: var(--on-surface-2); letter-spacing: .02em; }
.kv dd, .kv .v { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ============================================================ folhas e snackbar */
.sheet-layer { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .36); opacity: 0; transition: opacity 220ms var(--ease); border: 0; padding: 0; width: 100%; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 90%;
  display: flex; flex-direction: column;
  background: var(--sheet); color: var(--on-surface);
  border-radius: 28px 28px 0 0; box-shadow: var(--elev-3);
  transform: translateY(104%); transition: transform 250ms var(--ease);
  padding-bottom: 24px;
}
.sheet-layer.open { pointer-events: auto; }
.sheet-layer.open .sheet-scrim { opacity: 1; }
.sheet-layer.open .sheet { transform: none; }
.sheet-handle { width: 32px; height: 4px; border-radius: 2px; background: var(--outline); opacity: .6; margin: 14px auto 6px; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 4px 8px 8px 24px; flex: none; }
.sheet-head h2 { flex: 1; font-size: 22px; line-height: 28px; font-weight: 400; }
.sheet-body { overflow-y: auto; padding: 4px 24px 8px; }
.sheet-body.flush { padding: 4px 8px 8px; }
.sheet-acts { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 24px 0; flex: none; }

.snackbar {
  position: absolute; left: 12px; right: 12px; bottom: 32px; z-index: 80;
  display: flex; align-items: center; gap: 8px;
  min-height: 48px; padding: 6px 8px 6px 16px; border-radius: 4px;
  background: var(--inverse-surface); color: var(--inverse-on);
  box-shadow: var(--elev-3);
  font-size: 14px; line-height: 20px;
  opacity: 0; transform: translateY(12px); pointer-events: none;
  transition: opacity 180ms var(--ease), transform 220ms var(--ease);
}
.snackbar.show { opacity: 1; transform: none; pointer-events: auto; }
.snackbar .txt { flex: 1; padding: 8px 0; }
.snackbar .txt small { display: block; font-size: 12px; line-height: 16px; opacity: .8; }
.snackbar .btn { color: var(--inverse-primary); }
#sheetTitle:focus { outline: none; }

/* ============================================================ carregamento e login */
.splash { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; color: #FFFFFF; padding: 0 40px 80px; text-align: center; }
.splash svg { width: 168px; height: auto; color: #FFFFFF; }
.splash p { font-size: 16px; line-height: 24px; color: var(--on-uerj-2); max-width: 26ch; }
.splash .lp { width: 160px; background: rgba(255,255,255,.18); }
.splash .lp > i { background: #FFFFFF; }

.login-top { flex: none; height: 268px; display: grid; place-items: center; padding-bottom: 8px; }
.login-top svg { width: 184px; height: auto; color: #FFFFFF; }
.login-panel { flex: 1; min-height: 0; overflow-y: auto; background: var(--surface); border-top-left-radius: 48px; padding: 36px 24px 40px; }
.login-panel h2 { font-size: 24px; line-height: 32px; font-weight: 400; }
.login-panel .lede { color: var(--on-surface-2); margin: 6px 0 28px; font-size: 14px; line-height: 20px; }
.login-panel .field + .field, .login-panel .help + .field { margin-top: 20px; }
.login-err { display: flex; gap: 10px; align-items: center; margin-top: 20px; padding: 10px 14px; border-radius: 12px 4px 12px 12px; background: var(--crit); color: var(--on-crit); font-size: 14px; line-height: 20px; }
.login-err .ms { font-size: 20px; color: var(--crit-ink); }
.login-panel .btn.filled { margin-top: 28px; height: 52px; border-radius: 26px; font-size: 15px; }
.login-panel .recover { display: flex; width: fit-content; margin: 12px auto 0; height: 48px; }
.login-panel .unofficial { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 28px; color: var(--on-surface-2); font-size: 12px; line-height: 16px; text-align: center; }
.login-panel .unofficial .ms { font-size: 16px; }

/* ============================================================ início */
.greet { padding: 0 4px; }
.greet h2 { font-size: 24px; line-height: 32px; font-weight: 400; }
.greet h2 b { font-weight: 500; }
.greet p { color: var(--on-surface-2); margin-top: 2px; font-size: 14px; line-height: 20px; }
.greet + * { margin-top: 20px; }

.next {
  display: grid; grid-template-columns: auto 1fr; gap: 0 16px; width: 100%;
  padding: 18px 16px 16px 18px; border: 0; text-align: left;
  border-radius: 20px 4px 20px 20px;
  background: var(--primary-cont); color: var(--on-primary-cont);
}
.next-time { display: flex; flex-direction: column; justify-content: flex-start; padding: 2px 16px 0 0; box-shadow: inset -1px 0 0 color-mix(in srgb, var(--on-primary-cont) 22%, transparent); }
.next-time b { font-size: 28px; line-height: 34px; font-weight: 500; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.next-time span { font-size: 14px; line-height: 20px; color: var(--on-primary-cont-2); font-variant-numeric: tabular-nums; }
.next-time .slots { padding-top: 8px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .03em; }
.next-body { min-width: 0; }
.next-body h3 { font-size: 18px; line-height: 24px; font-weight: 500; }
.next-body .room { display: flex; gap: 6px; align-items: flex-start; margin-top: 6px; font-size: 14px; line-height: 20px; color: var(--on-primary-cont-2); }
.next-body .room .ms { font-size: 18px; margin-top: 1px; }
.next-body .room b { color: var(--on-primary-cont); font-weight: 500; }
.next-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.next-tags .soon { background: var(--primary); color: var(--on-primary); }
.next-tags .tag.plain { background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--on-primary-cont); }

.grades-card { padding: 4px 12px 12px 16px; }
.gt { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 44px); column-gap: 0; }
.gt .h { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--on-surface-2); text-align: center; padding: 12px 0 8px; letter-spacing: .03em; }
.gt .h:first-child { text-align: left; }
.gt .c { display: flex; align-items: center; justify-content: center; padding: 10px 0; box-shadow: inset 0 1px 0 var(--outline-var); min-height: 56px; }
.gt .n { display: block; padding: 10px 6px 10px 0; box-shadow: inset 0 1px 0 var(--outline-var); }
.gt .n b { display: block; font-size: 14px; line-height: 20px; font-weight: 500; }
.gt .n span { display: block; font-size: 12px; line-height: 16px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; }
.gp {
  display: inline-flex; align-items: center; gap: 1px;
  height: 26px; padding: 0 4px 0 3px; border-radius: 8px 2px 8px 8px;
  font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0;
}
.gp .ms { font-size: 13px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 20; }
.gp.good { background: var(--good); color: var(--on-good); } .gp.good .ms { color: var(--good-ink); }
.gp.warn { background: var(--warn); color: var(--on-warn); } .gp.warn .ms { color: var(--warn-ink); }
.gp.crit { background: var(--crit); color: var(--on-crit); } .gp.crit .ms { color: var(--crit-ink); }
.gnone { color: var(--on-surface-2); font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 0 0; box-shadow: inset 0 1px 0 var(--outline-var); font-size: 12px; line-height: 16px; color: var(--on-surface-2); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend .ms { font-size: 15px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 20; }
.ink-good { color: var(--good-ink); } .ink-warn { color: var(--warn-ink); } .ink-crit { color: var(--crit-ink); } .ink-neutral { color: var(--neutral-ink); }

.days { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-bottom: 14px; }
.days-ind { position: absolute; top: 0; bottom: 0; left: 0; width: calc((100% - 20px) / 6); border-radius: 18px 4px 18px 18px; background: var(--sec-cont); transition: transform 220ms var(--ease); z-index: 0; }
.day {
  position: relative; z-index: 1; border: 0; background: transparent; border-radius: 18px 4px 18px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 8px;
  color: var(--on-surface-2);
}
.day .dn { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .03em; }
.day .dd { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 500; color: var(--on-surface); font-variant-numeric: tabular-nums; }
.day.today .dd { background: var(--primary); color: var(--on-primary); }
.day.sel { color: var(--on-sec-cont); }
.day .dots { display: flex; gap: 3px; height: 5px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--outline); }
.day .dots i.morning { background: var(--morning-ink); } .day .dots i.afternoon { background: var(--afternoon-ink); } .day .dots i.night { background: var(--night-ink); }

.tl { transition: opacity 160ms var(--ease); }
.tl.fade { opacity: 0; }
.tl-day { font-size: 14px; line-height: 20px; color: var(--on-surface-2); margin: 0 4px 10px; }
.tl-row { display: grid; grid-template-columns: 50px 1fr; gap: 12px; margin-bottom: 8px; }
.tl-time { text-align: right; padding-top: 12px; font-variant-numeric: tabular-nums; }
.tl-time b { display: block; font-size: 14px; line-height: 20px; font-weight: 500; }
.tl-time span { display: block; font-size: 12px; line-height: 16px; color: var(--on-surface-2); }
.tl-block {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: start;
  width: 100%; min-height: 76px; padding: 12px 12px 12px 14px; border: 0; text-align: left;
  border-radius: 14px 4px 14px 14px;
}
.tl-block .nm { display: block; font-size: 15px; line-height: 20px; font-weight: 500; }
.tl-block .meta { grid-column: 1 / -1; font-size: 13px; line-height: 18px; font-variant-numeric: tabular-nums; }
.tl-block .sh { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; line-height: 16px; font-weight: 500; }
.tl-block .sh .ms { font-size: 16px; }
.tl-block.morning { background: var(--morning); color: var(--on-morning); } .tl-block.morning .sh .ms { color: var(--morning-ink); }
.tl-block.afternoon { background: var(--afternoon); color: var(--on-afternoon); } .tl-block.afternoon .sh .ms { color: var(--afternoon-ink); }
.tl-block.night { background: var(--night); color: var(--on-night); } .tl-block.night .sh .ms { color: var(--night-ink); }
.tl-block.past { filter: saturate(.55); }
.tl-block.past .nm::after { content: " · encerrada"; font-weight: 400; font-size: 13px; }
.tl-now { display: grid; grid-template-columns: 50px 1fr; gap: 12px; align-items: center; margin: 2px 0 10px; }
.tl-now b { text-align: right; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--primary); font-variant-numeric: tabular-nums; }
.tl-now i { position: relative; height: 2px; border-radius: 1px; background: var(--primary); }
.tl-now i::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.tl-empty { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 14px 4px 14px 14px; background: var(--surface-cont); color: var(--on-surface-2); }

.rid-sum { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 14px 4px; }
.rid { padding: 14px 16px 16px; }
.rid + .rid { margin-top: 12px; }
.rid.alert { box-shadow: var(--elev-1), inset 0 0 0 1px var(--crit-ink); }
:root[data-theme="dark"] .rid.alert { box-shadow: inset 0 0 0 1px var(--crit-ink); }
.rid-top { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; }
.rid-top .tag { margin-top: -1px; }
.rid h3 { flex: 1; min-width: 0; font-size: 16px; line-height: 22px; font-weight: 500; }
.rid .code { margin: 2px 0 12px; font-size: 13px; line-height: 18px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; }
.rid-m { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.metric { padding: 10px 12px; border-radius: 12px 3px 12px 12px; }
.metric .k { font-size: 12px; line-height: 16px; letter-spacing: .02em; }
.metric .v { font-size: 22px; line-height: 28px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 2px; }
.metric .h { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 500; }
.metric .h .ms { font-size: 15px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 20; }
.metric.good { background: var(--good); color: var(--on-good); } .metric.good .h .ms { color: var(--good-ink); }
.metric.warn { background: var(--warn); color: var(--on-warn); } .metric.warn .h .ms { color: var(--warn-ink); }
.metric.crit { background: var(--crit); color: var(--on-crit); } .metric.crit .h .ms { color: var(--crit-ink); }
.metric.neutral { background: var(--neutral); color: var(--on-neutral); } .metric.neutral .h .ms { color: var(--neutral-ink); }
.rid-status { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding: 10px 12px; border-radius: 12px 3px 12px 12px; background: var(--crit); color: var(--on-crit); font-weight: 500; }
.rid-status .ms { font-size: 20px; color: var(--crit-ink); }

.persist { margin-top: 16px; padding: 16px; border-radius: 16px 4px 16px 16px; background: var(--crit); color: var(--on-crit); }
.persist h3 { display: flex; gap: 8px; align-items: center; font-size: 16px; line-height: 24px; font-weight: 500; }
.persist h3 .ms { color: var(--crit-ink); }
.persist ol { margin: 8px 0 0; padding-left: 22px; font-size: 14px; line-height: 22px; }
.persist p { margin-top: 10px; font-size: 13px; line-height: 19px; }

/* ============================================================ progresso */
.summary { display: grid; grid-template-columns: 1fr 1fr; padding: 16px 0 0; }
.summary > div { padding: 0 16px 14px 20px; }
.summary > div + div { box-shadow: inset 1px 0 0 var(--outline-var); }
.summary .k { font-size: 14px; line-height: 20px; color: var(--on-surface-2); }
.summary .v { font-size: 36px; line-height: 44px; font-weight: 400; letter-spacing: -.01em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.summary .foot { grid-column: 1 / -1; display: flex; gap: 8px; align-items: flex-start; padding: 10px 16px 12px 20px; box-shadow: inset 0 1px 0 var(--outline-var); font-size: 12px; line-height: 16px; color: var(--on-surface-2); }
.summary .foot .ms { font-size: 16px; }
.chart-card { padding: 16px 12px 8px 16px; }
.chart-card .ch { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-right: 0; }
.chart-card h3 { font-size: 16px; line-height: 24px; font-weight: 500; }
.chart-card .ch p { font-size: 12px; line-height: 16px; color: var(--on-surface-2); }
.chart { position: relative; margin-top: 8px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--outline-var); stroke-width: 1; }
.chart .axis text { fill: var(--on-surface-2); font-size: 12px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .area { fill: var(--primary); opacity: .10; }
.chart .line { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { fill: var(--primary); stroke: var(--card); stroke-width: 2; }
.chart .pt.last { r: 5.5; }
.chart .lbl { fill: var(--on-surface); font-size: 12px; font-weight: 600; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .cross { stroke: var(--on-surface-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
.chart .hit { fill: transparent; cursor: crosshair; }
.tip {
  position: absolute; top: 0; z-index: 2; pointer-events: none;
  padding: 8px 10px; border-radius: 8px 2px 8px 8px; background: var(--inverse-surface); color: var(--inverse-on);
  font-size: 12px; line-height: 16px; white-space: nowrap; opacity: 0; transform: translate(-50%, -4px); transition: opacity 120ms;
  font-variant-numeric: tabular-nums;
}
.tip b { display: block; font-size: 13px; font-weight: 600; }
.tip.show { opacity: 1; }
.chart-table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 13px; font-variant-numeric: tabular-nums; }
.chart-table th { text-align: left; font-weight: 500; color: var(--on-surface-2); font-size: 12px; padding: 6px 4px; }
.chart-table td { padding: 6px 4px; box-shadow: inset 0 1px 0 var(--outline-var); }
.chart-table th:not(:first-child), .chart-table td:not(:first-child) { text-align: right; }
.path { padding: 4px 0; }
.path-row { padding: 14px 16px 16px; }
.path-row + .path-row { box-shadow: inset 0 1px 0 var(--outline-var); }
.path-row .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.path-row h3 { font-size: 15px; line-height: 20px; font-weight: 500; }
.path-row .pct { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.path-row .sp { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; }
.path-row .cfg { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; line-height: 18px; color: var(--on-surface-2); }

/* ============================================================ gerador */
.stepper { display: flex; align-items: center; gap: 0; overflow-x: auto; scrollbar-width: none; margin: -10px -16px 6px; padding: 0 16px 4px; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 40px), transparent); }
.stepper::-webkit-scrollbar { display: none; }
.step { display: flex; align-items: center; gap: 8px; flex: none; min-height: 48px; border: 0; background: transparent; padding: 6px 6px; border-radius: 20px; color: var(--on-surface-2); font-size: 13px; font-weight: 500; letter-spacing: .01em; }
.step .no { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--outline); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.step .no .ms { font-size: 16px; font-variation-settings: "FILL" 0, "wght" 600, "GRAD" 0, "opsz" 20; }
.step.done { color: var(--on-surface); } .step.done .no { background: var(--primary-cont); color: var(--on-primary-cont); box-shadow: none; }
.step.cur { color: var(--primary); } .step.cur .no { background: var(--primary); color: var(--on-primary); box-shadow: none; }
.step-line { width: 16px; height: 2px; background: var(--outline-var); flex: none; border-radius: 1px; }
.step-line.done { background: var(--primary); }
.step-meta { font-size: 12px; line-height: 16px; color: var(--on-surface-2); margin: 0 4px 6px; font-variant-numeric: tabular-nums; }
.gen-q { font-size: 22px; line-height: 28px; font-weight: 400; margin: 0 4px 6px; }
.gen-lede { color: var(--on-surface-2); margin: 0 4px 18px; font-size: 14px; line-height: 20px; }
.stepper-num { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.stepper-num .val { height: 48px; text-align: center; font-size: 36px; line-height: 44px; font-variant-numeric: tabular-nums; }
.stepper-num .lbl { grid-column: 1 / -1; font-size: 14px; color: var(--on-surface-2); }
.amount + .amount { margin-top: 12px; }

.busy-tools { display: flex; flex-wrap: wrap; gap: 16px 8px; margin: 4px 0 12px; }
.busy-legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--on-surface-2); margin: 0 4px 10px; }
.busy-legend span { display: inline-flex; gap: 6px; align-items: center; }
.busy-legend i { width: 18px; height: 18px; border-radius: 5px 2px 5px 5px; display: grid; place-items: center; }
.busy-legend i.free { box-shadow: inset 0 0 0 1px var(--cell-line); }
.busy-legend i.busy { background: var(--crit); color: var(--crit-ink); }
.busy-legend i .ms { font-size: 14px; }
.bg { display: grid; grid-template-columns: 54px repeat(6, minmax(0, 1fr)); gap: 2px 3px; user-select: none; }
.bg .dh { text-align: center; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--on-surface-2); padding: 4px 0 6px; letter-spacing: .03em; }
.bg .sh { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 500; color: var(--on-surface-2); padding: 10px 0 2px 2px; }
.bg .sh .ms { font-size: 16px; }
.bg .sl-lbl { display: flex; flex-direction: column; justify-content: center; padding-left: 2px; font-variant-numeric: tabular-nums; }
.bg .sl-lbl b { font-size: 12px; line-height: 14px; font-weight: 600; }
.bg .sl-lbl span { font-size: 11px; line-height: 13px; color: var(--on-surface-2); }
.cell { height: 46px; border: 0; border-radius: 8px 2px 8px 8px; background: transparent; box-shadow: inset 0 0 0 1px var(--cell-line); display: grid; place-items: center; color: var(--crit-ink); padding: 0; transition: background 120ms; }
.cell .ms { font-size: 18px; opacity: 0; transform: scale(.6); transition: opacity 120ms, transform 160ms var(--ease); }
.cell[aria-pressed="true"] { background: var(--crit); box-shadow: none; }
.cell[aria-pressed="true"] .ms { opacity: 1; transform: none; }
.cell:hover { box-shadow: inset 0 0 0 2px var(--outline); }
.tip-line { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; margin: 0 0 10px; border-radius: 12px 4px 12px 12px; background: var(--surface-cont); font-size: 13px; line-height: 18px; color: var(--on-surface-2); }
.tip-line .ms { font-size: 18px; color: var(--primary); }

.prio { padding: 4px 0; overflow: hidden; }
.prio-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 16px; min-height: 64px; border: 0; background: transparent; color: var(--on-surface); text-align: left; }
.prio-row + .prio-row { box-shadow: inset 0 1px 0 var(--outline-var); }
.prio-row .txt { flex: 1; font-size: 15px; line-height: 21px; }
.prio-pair { box-shadow: inset 0 1px 0 var(--outline-var); }
.prio-pair .pair-note { padding: 10px 16px 0; font-size: 12px; line-height: 16px; color: var(--on-surface-2); display: flex; gap: 6px; align-items: center; }
.prio-pair .pair-note .ms { font-size: 16px; }
.prio-pair .prio-row + .prio-row { box-shadow: none; }

.pick { display: flex; gap: 14px; align-items: flex-start; width: 100%; padding: 14px 16px; border: 0; background: transparent; text-align: left; color: var(--on-surface); }
.pick + .pick { box-shadow: inset 0 1px 0 var(--outline-var); }
.pick .cb { margin-top: 2px; }
.pick .txt { flex: 1; min-width: 0; }
.pick .nm { display: block; font-size: 15px; line-height: 21px; font-weight: 500; margin: 0 0 2px; }
.pick .meta, .pick .tags { display: block; }
.pick .tags { display: flex; }
.pick .meta { font-size: 13px; line-height: 18px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; }
.pick .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.counter { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 4px 10px; font-size: 13px; line-height: 18px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; }
.counter b { color: var(--on-surface); font-weight: 500; }
.filters { display: flex; flex-direction: column; gap: 12px; }

.fetch-row { display: flex; gap: 14px; align-items: flex-start; padding: 12px 16px; }
.fetch-row + .fetch-row { box-shadow: inset 0 1px 0 var(--outline-var); }
.fetch-row .ms { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; margin-top: -1px; }
.fetch-row .txt { flex: 1; }
.fetch-row h3 { font-size: 15px; line-height: 21px; font-weight: 500; }
.fetch-row p { font-size: 13px; line-height: 18px; color: var(--on-surface-2); }
.fetch-row p.crit { color: var(--crit-ink); }
.fetch-row .wait { color: var(--outline); }

.gen-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 28px 16px 24px; }
.gen-hero .ic { width: 72px; height: 72px; border-radius: 24px 6px 24px 24px; background: var(--primary-cont); color: var(--on-primary-cont); display: grid; place-items: center; }
.gen-hero .ic .ms { font-size: 36px; }
.gen-hero h3 { font-size: 20px; line-height: 28px; font-weight: 400; }
.gen-hero p { color: var(--on-surface-2); max-width: 32ch; }
.gen-res-head { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
.res-item { padding: 12px 16px; }
.res-item + .res-item { box-shadow: inset 0 1px 0 var(--outline-var); }
.res-item h3 { font-size: 15px; line-height: 21px; font-weight: 500; }
.res-item p { font-size: 13px; line-height: 18px; color: var(--on-surface-2); }
.res-item .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.wk { display: grid; grid-template-columns: 34px repeat(5, minmax(0, 1fr)); grid-auto-rows: 24px; gap: 2px 3px; padding: 12px 12px 12px 8px; }
.wk .dh { grid-row: 1; text-align: center; font-size: 12px; font-weight: 500; color: var(--on-surface-2); align-self: center; }
.wk .sl-lbl { grid-column: 1; font-size: 12px; color: var(--on-surface-2); align-self: center; font-variant-numeric: tabular-nums; font-weight: 500; }
.wk .bk { border-radius: 8px 2px 8px 8px; padding: 4px 5px; font-size: 11px; line-height: 13px; font-weight: 600; overflow: hidden; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.wk .bk.morning { background: var(--morning); color: var(--on-morning); }
.wk .bk.afternoon { background: var(--afternoon); color: var(--on-afternoon); }
.wk .bk.night { background: var(--night); color: var(--on-night); }
.wk .rule { grid-column: 2 / -1; box-shadow: inset 0 1px 0 var(--outline-var); }
.wk-legend { display: flex; flex-direction: column; gap: 6px; padding: 0 16px 14px; font-size: 13px; line-height: 18px; }
.wk-legend span { display: flex; gap: 8px; align-items: center; }
.wk-legend i { font-style: normal; font-size: 11px; font-weight: 700; min-width: 34px; text-align: center; padding: 2px 4px; border-radius: 6px 2px 6px 6px; background: var(--surface-high); }

/* ============================================================ mural */
.board-list .li { min-height: 76px; }
.board-list .avatar { width: 44px; height: 44px; font-size: 15px; }
.board-list .sp { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board-list .tr { align-self: flex-start; margin-top: 4px; font-variant-numeric: tabular-nums; }
.chat-head { position: sticky; top: -28px; z-index: 4; margin: -28px -16px 0; padding: 20px 16px 12px; background: var(--surface); box-shadow: 0 1px 0 var(--outline-var); }
.chat-top { display: flex; align-items: center; gap: 4px; margin: 0 4px 12px; }
.chat-top .txt { flex: 1; min-width: 0; }
.chat-top h2 { font-size: 18px; line-height: 24px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-top p { font-size: 12px; line-height: 16px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; }
.msgs { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
.msg-date { align-self: center; margin: 12px 0 6px; padding: 4px 12px; border-radius: 8px; background: var(--surface-high); font-size: 12px; line-height: 16px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; }
.msg {
  max-width: 84%; align-self: flex-start; border: 0; text-align: left; color: var(--on-surface);
  padding: 8px 12px 6px; border-radius: 4px 16px 16px 16px; background: var(--card); box-shadow: var(--elev-1);
}
.msg .au { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--primary); }
.msg .tx { font-size: 15px; line-height: 21px; margin-top: 2px; overflow-wrap: anywhere; }
.msg .tm { display: block; text-align: right; font-size: 11px; line-height: 14px; color: var(--on-surface-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.msg.mine { align-self: flex-end; border-radius: 16px 4px 16px 16px; background: var(--primary-cont); color: var(--on-primary-cont); box-shadow: none; }
.msg.mine .au { color: var(--on-primary-cont-2); }
.msg.mine .tm { color: var(--on-primary-cont-2); }
.msg.mine a { color: var(--on-primary-cont); }
.msg + .msg.same { margin-top: -1px; }
.composer { background: var(--surface); border-top: 0; box-shadow: 0 -1px 0 var(--outline-var); }
.composer .field { flex: 1; min-height: 48px; border-radius: 24px 4px 24px 24px; background: var(--surface-cont); box-shadow: none; }
.composer .field input { height: 48px; padding: 0 18px; font-size: 15px; }
.composer .field:focus-within { box-shadow: inset 0 0 0 2px var(--primary); }

/* ============================================================ listas */
.hist { padding: 14px 16px 14px; }
.hist + .hist, .item + .item { margin-top: 10px; }
.hist .top, .item .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hist .top h3, .item .top h3 { flex: 1; min-width: 0; margin: 0; }
.hist .top .tag, .item .top .tag { margin-top: -1px; }
.hist h3, .item h3 { font-size: 16px; line-height: 22px; font-weight: 500; margin-top: 10px; }
.hist .code, .item .code { font-size: 12px; line-height: 16px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.hist .code { margin-top: 2px; }
.hist .kv { margin-top: 12px; padding-top: 10px; box-shadow: inset 0 1px 0 var(--outline-var); }
.item { display: block; width: 100%; padding: 14px 16px; border: 0; text-align: left; color: var(--on-surface); }
.item .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; }
.item .meta span { display: inline-flex; align-items: center; gap: 4px; }
.item .meta .ms { font-size: 16px; }
.item .meta { margin-top: 6px; }
.list-sum { font-size: 13px; line-height: 18px; color: var(--on-surface-2); margin: 4px 4px 12px; font-variant-numeric: tabular-nums; }
.search-row { display: flex; gap: 8px; align-items: center; }
.search-row .field { flex: 1; }

/* ============================================================ disciplina */
.subj-head h2 { font-size: 26px; line-height: 34px; font-weight: 400; margin: 0 4px; }
.subj-head .meta { margin: 4px 4px 16px; font-size: 14px; line-height: 20px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; }
.req-group { padding: 12px 16px 14px; }
.req-group + .req-group { box-shadow: inset 0 1px 0 var(--outline-var); }
.req-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.req-item b { font-weight: 500; font-size: 15px; line-height: 21px; display: block; }
.req-item span.c { display: block; font-size: 13px; line-height: 18px; color: var(--on-surface-2); font-variant-numeric: tabular-nums; }
.cls { padding: 14px 16px 16px; }
.cls + .cls { margin-top: 12px; }
.cls-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cls-top h3 { font-size: 17px; line-height: 24px; font-weight: 500; }
.cls .teach { margin-top: 6px; font-size: 14px; line-height: 20px; color: var(--on-surface-2); display: flex; gap: 8px; align-items: flex-start; }
.cls .teach .ms { font-size: 18px; margin-top: 1px; }
.vac { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
.vac .k { display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: var(--on-surface-2); letter-spacing: .02em; }
.vac .v { font-size: 18px; line-height: 24px; font-weight: 500; font-variant-numeric: tabular-nums; margin: 2px 0 6px; }
.vac .h { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; line-height: 16px; font-weight: 500; margin-top: 6px; color: var(--on-surface-2); }
.vac .h .ms { font-size: 15px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 20; }
.when { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.when .tag { height: auto; padding: 6px 10px 6px 8px; align-items: flex-start; }
.when .tag b { font-weight: 600; display: block; }

/* ============================================================ sobre */

.about-hero svg { width: 132px; height: auto; color: var(--uerj); }

<body>
<!--
  AO UERJ · Variante 1 · Material

  Inspiração: apps do Google no Android (Agenda, Classroom, Drive, Gmail). É a variante mais
  próxima do app atual e a mais "nativa": mesma estrutura, mesmos lugares, componentes
  Material 3 de verdade (botões preenchidos/tonais/contornados, chips de filtro, campos
  contornados com rótulo flutuante, interruptores, botões segmentados, abas, folhas inferiores,
  snackbar, indicador em pílula no menu lateral). A semana vira uma linha do tempo do dia no
  estilo Google Agenda, com blocos coloridos pelo turno e a linha do "agora".

  Paleta: chão azul UERJ #003468 (barra de status, cabeçalho, menu lateral). Esquema tonal M3
  com semente no azul UERJ: primária #1F5BA3, contêiner primário #D6E3FF / #001B3E, superfície
  #F8F9FD, contêiner #EEF1F7, contorno #C3C7D0 (divisores) e #74777F (campos), texto #191C20 /
  #44474E. Escuro: cabeçalho #0A2A55, superfície #111318, contêiner #1D2026, primária #A9C7FF,
  contêiner primário #0E4280. Pastéis de significado do app atual, afinados: aprovado/bom verde
  #D7F2DE, atenção amarelo #FBEFC4, crítico/reprovado vermelho #FADCDC, cancelado/isento cinza
  #E4E6EB; turnos Manhã #FBF3C8, Tarde #FFE5D0, Noite #D5EEFA (no escuro viram tons escuros
  legíveis). Status nunca só por cor: sempre ícone e rótulo junto.

  Tipo: Roboto Flex (Google Fonts) na escala de tipos do Material 3; números tabulares em
  notas, horários, vagas e créditos. Ícones: Material Symbols Rounded.

  Preservado do atual: azul UERJ atrás de tudo; painel claro com canto superior esquerdo de
  48px em todas as telas (Início, Login, Progresso, Sobre...); cards, campos e caixas com o
  canto superior direito reto (4px); cabeçalho azul com menu à esquerda, título centralizado
  (no Início, o período "2026.2") e logo AO à direita abrindo "Sobre"; menu lateral azul com
  destaque animado que desliza até a rota ativa, o painel deslizando para revelar o menu
  atrás (drawerType 'back') com o cabeçalho parado, como o Header global do app, e "Sair"
  no rodapé; Login com topo azul e logo grande; pastéis de significado; rotas, títulos e
  textos reais do app.

  Rotas por hash: #/tela?theme=dark&state=offline&step=3&sheet=classes&drawer=1
  capture=1 desliga animações e o botão flutuante; embed=1 esconde moldura e controles.
-->
<div class="stage" id="stage">
  <div class="device" id="device">
    <div class="app" id="app">
      <div class="statusbar" aria-hidden="true">
        <span class="tnum">11:58</span>
        <span class="sys">
          <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M1.5 14h2.2v-3H1.5zm3.6 0h2.2V8.2H5.1zm3.6 0h2.2V5.4H8.7zm3.6 0h2.2V2.6h-2.2z"/></svg>
          <svg width="17" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20.6 1.2 8.4C4.1 5.9 7.9 4.4 12 4.4s7.9 1.5 10.8 4z"/></svg>
          <svg width="25" height="13" viewBox="0 0 26 14"><rect x=".75" y=".75" width="21.5" height="12.5" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/><rect x="2.8" y="2.8" width="14.4" height="8.4" rx="1.6" fill="currentColor"/><rect x="23.4" y="4.6" width="2.1" height="4.8" rx="1" fill="currentColor" opacity=".55"/></svg>
        </span>
      </div>
      <div class="area" id="area">
        <nav class="drawer" id="drawer" aria-label="Menu principal"></nav>
        <div class="screen" id="screen"></div>
        <button class="screen-shield" id="screenShield" data-action="close-drawer" aria-label="Fechar menu"></button>
      </div>
      <div class="sheet-layer" id="sheetLayer" aria-hidden="true">
        <button class="sheet-scrim" data-action="close-sheet" aria-label="Fechar folha" tabindex="-1"></button>
        <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
      </div>
      <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>
      <div class="gesture" id="gesture" aria-hidden="true"><i></i></div>
    </div>
  </div>
  <aside class="ctrl" id="ctrl" aria-label="Controles da apresentação"></aside>
</div>
<button class="ctrl-fab" id="ctrlFab" data-action="ctrl-open" aria-label="Abrir controles da apresentação"><span class="ms" aria-hidden="true">tune</span></button>
