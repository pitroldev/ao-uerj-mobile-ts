<script>
'use strict';
/* ================================================================ núcleo */
var D = window.AO_DATA;
var $ = (s, r) => (r || document).querySelector(s);
var $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
var esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
var ic = (name, cls) => '<span class="ms' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' + name + '</span>';
var fmt = (n, d) => (n == null ? '—' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d == null ? 1 : d, maximumFractionDigits: d == null ? 1 : d }));
var plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
var joinE = arr => (arr.length < 2 ? arr.join('') : arr.slice(0, -1).join(', ') + ' e ' + arr[arr.length - 1]);
var isCapture = () => document.documentElement.classList.contains('capture');
var later = (fn, ms) => (isCapture() ? fn() : setTimeout(fn, ms));

var HEALTH = {
  GOOD: { cls: 'good', label: 'Bom', icon: 'check_circle' },
  BAD: { cls: 'warn', label: 'Atenção', icon: 'warning' },
  CRITICAL: { cls: 'crit', label: 'Crítico', icon: 'error' },
  NONE: { cls: 'neutral', label: 'Sem dado', icon: 'remove' },
};
var hp = h => HEALTH[h] || HEALTH.NONE;

var SHIFT = {
  MORNING: { cls: 'morning', label: 'Manhã', icon: 'wb_twilight', slots: 'M1–M6' },
  AFTERNOON: { cls: 'afternoon', label: 'Tarde', icon: 'light_mode', slots: 'T1–T6' },
  NIGHT: { cls: 'night', label: 'Noite', icon: 'dark_mode', slots: 'N1–N5' },
};
var shiftOfSlot = id => (id[0] === 'M' ? 'MORNING' : id[0] === 'T' ? 'AFTERNOON' : 'NIGHT');

var STATUS = {
  APPROVED: { cls: 'good', icon: 'check_circle' },
  FAILED_BY_GRADE: { cls: 'crit', icon: 'cancel' },
  FAILED_BY_ATTENDANCE: { cls: 'crit', icon: 'event_busy' },
  CANCELED: { cls: 'neutral', icon: 'block' },
  EXEMPT: { cls: 'neutral', icon: 'verified' },
  IN_PROGRESS: { cls: 'info', icon: 'pending' },
};
var TYPE_PLURAL = { MANDATORY: 'Obrigatórias', RESTRICTED: 'Eletivas Restritas', DEFINED: 'Eletivas Definidas', UNIVERSAL: 'Universais' };

function loc(s) {
  if (!s) return { room: '', place: '' };
  var p = s.split(' · ');
  return { room: p[p.length - 1], place: p.slice(0, -1).join(', ') };
}
function initials(name, max) {
  var stop = { de: 1, da: 1, do: 1, e: 1, para: 1, em: 1, a: 1, o: 1 };
  var w = name.split(/\s+/).filter(x => !stop[x.toLowerCase()]);
  if (w.length === 1) return w[0].slice(0, 2).toUpperCase();
  return w.slice(0, max || 2).map(x => x[0]).join('').toUpperCase();
}
function meetSummary(meetings) {
  if (!meetings.length) return '';
  var groups = {};
  meetings.forEach(m => { var k = m.from + '–' + m.to; (groups[k] = groups[k] || []).push(m.day); });
  return Object.keys(groups).map(k => {
    var a = k.split('–');
    return joinE(groups[k].map(d => D.WEEKDAYS[d - 1].short)) + ' · ' + k + ' · ' + D.slot(a[0]).from + '–' + D.slot(a[1]).to;
  }).join('; ');
}
function findBase(id) {
  var all = [].concat(D.curriculum, D.universals, D.searchHistory);
  for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
  var e = D.enrolled.filter(x => x.id === id)[0];
  return e ? { id: e.id, name: e.name } : null;
}
var historyStatus = id => {
  var h = D.history.filter(x => x.id === id);
  if (h.some(x => x.status === 'APPROVED' || x.status === 'EXEMPT')) return 'APPROVED';
  if (h.some(x => x.status === 'IN_PROGRESS')) return 'IN_PROGRESS';
  return null;
};

/* ---------------------------------------------------------------- estado da interface */
var S = {
  day: D.now.weekday,
  credits: Object.assign({}, D.electiveConfig),
  creditsConfirm: false,
  showTable: false,
  gen: { min: D.generator.minSubjects, max: D.generator.maxSubjects, busy: {}, prio: {}, subjects: {}, classes: {}, type: '', q: '', teacher: '', fetched: null },
  board: { msgs: {}, draft: '', period: '2026.2' },
  hist: { period: (D.periodList.filter(p => p.isCurrentCra)[0] || D.periodList[0]).value },
  cur: { type: '', taken: false, q: '' },
  uni: { dept: '', q: '' },
  search: { q: '' },
  report: { step: 1, page: '', code: '', desc: '' },
  login: { mat: '', pass: '', show: false, loading: false, err: '' },
  updating: false,
};
D.generator.defaultBusy.forEach(b => { S.gen.busy[b.day + '-' + b.slot] = true; });
D.generator.priorityPresets[0].keys.forEach(k => { S.gen.prio[k] = true; });
D.generator.fetchResults.forEach(f => { S.gen.subjects[f.id] = true; });
D.generator.classes.forEach(c => { S.gen.classes[c.subjectId + '#' + c.classNumber] = true; });
Object.keys(D.messages).forEach(k => { S.board.msgs[k] = D.messages[k].slice(); });

/* ---------------------------------------------------------------- componentes */
function field(o) {
  var filled = o.value != null && String(o.value) !== '';
  var cls = 'field' + (o.label ? ' lbl' : '') + (filled || o.select ? ' up' : '') + (o.textarea ? ' has-ta' : '') + (o.err ? ' err' : '');
  var id = 'f-' + o.id;
  var h = '<div class="' + cls + '"' + (o.style ? ' style="' + o.style + '"' : '') + '>';
  if (o.icon) h += ic(o.icon, 'lead');
  var data = o.input ? ' data-input="' + o.input + '"' : '';
  if (o.select) {
    h += '<select id="' + id + '"' + data + '>' + o.options.map(op => '<option value="' + esc(op.v) + '"' + (String(op.v) === String(o.value) ? ' selected' : '') + '>' + esc(op.l) + '</option>').join('') + '</select>' + ic('arrow_drop_down', 'trail');
  } else if (o.textarea) {
    h += '<textarea id="' + id + '"' + data + ' rows="5" placeholder="' + esc(o.placeholder || '') + '">' + esc(o.value || '') + '</textarea>';
  } else {
    h += '<input id="' + id + '" type="' + (o.type || 'text') + '" value="' + esc(o.value || '') + '" placeholder="' + esc(o.placeholder || '') + '"' +
      (o.inputmode ? ' inputmode="' + o.inputmode + '"' : '') + (o.autocomplete ? ' autocomplete="' + o.autocomplete + '"' : ' autocomplete="off"') +
      (o.label ? '' : ' aria-label="' + esc(o.aria || o.placeholder || '') + '"') + (o.err ? ' aria-invalid="true"' : '') + (o.enter ? ' data-enter="' + o.enter + '"' : '') + data + '>';
    if (o.clear) h += '<button type="button" class="icon-btn sl clear" data-action="clear-field" data-for="' + id + '" aria-label="Limpar"' + (filled ? '' : ' hidden') + '>' + ic('cancel') + '</button>';
    if (o.toggle) h += '<button type="button" class="icon-btn sl clear" data-action="toggle-pass" aria-label="' + (o.type === 'password' ? 'Mostrar senha' : 'Ocultar senha') + '">' + ic(o.type === 'password' ? 'visibility' : 'visibility_off') + '</button>';
  }
  if (o.label) h += '<label for="' + id + '">' + esc(o.label) + '</label>';
  return h + '</div>';
}
function chip(label, sel, attrs, icon) {
  /* ícone à esquerda opcional; selecionado, o ícone vira o check (filtro M3) */
  return '<button class="chip sl' + (sel ? ' sel' : '') + (icon ? ' lead' : '') + '" aria-pressed="' + !!sel + '" ' + (attrs || '') + '>' + (sel ? ic('check') : icon ? ic(icon) : '') + esc(label) + '</button>';
}
function empty(icon, text, act, tone) {
  return '<div class="empty"><div class="ic' + (tone ? ' ' + tone : '') + '">' + ic(icon) + '</div><p>' + esc(text) + '</p>' +
    (act ? '<button class="btn ' + (act.kind || 'tonal') + ' sl" ' + act.attrs + '>' + (act.icon ? ic(act.icon) : '') + esc(act.label) + '</button>' : '') + '</div>';
}
function secH(title, trailing, sub) {
  return '<div class="sec-h"><div><h2>' + title + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>' + (trailing || '') + '</div>';
}
function tagHealth(h, text) { var x = hp(h); return '<span class="tag ' + x.cls + '">' + ic(x.icon, 'fill') + esc(text || x.label) + '</span>'; }

/* ---------------------------------------------------------------- rotas */
var ROUTES = {};
var SHEETS = {};
var ACTIONS = {};
var INPUTS = {};
var current = { route: null, params: {}, key: null };

function parseHash() {
  var h = location.hash.replace(/^#\/?/, '');
  var q = h.indexOf('?');
  var route = (q >= 0 ? h.slice(0, q) : h) || 'home';
  var params = {};
  if (q >= 0) new URLSearchParams(h.slice(q + 1)).forEach((v, k) => { params[k] = v; });
  return { route: route, params: params };
}
function buildHash(route, params) {
  var qs = Object.keys(params).filter(k => params[k] != null && params[k] !== '').map(k => k + '=' + encodeURIComponent(params[k])).join('&');
  return '#/' + route + (qs ? '?' + qs : '');
}
var KEEP = ['theme', 'embed', 'capture'];
function go(target, extra) {
  var r = typeof target === 'string' ? splitTarget(target) : target;
  var params = Object.assign({}, r.params, extra || {});
  var cur = parseHash().params;
  KEEP.forEach(k => { if (cur[k] != null && params[k] === undefined) params[k] = cur[k]; });
  var hash = buildHash(r.route, params);
  if (hash === location.hash) onRoute(); else location.hash = hash;
}
function splitTarget(t) {
  var q = t.indexOf('?');
  var params = {};
  if (q >= 0) new URLSearchParams(t.slice(q + 1)).forEach((v, k) => { params[k] = v; });
  return { route: q >= 0 ? t.slice(0, q) : t, params: params };
}
function setParams(obj) {
  var r = parseHash();
  Object.keys(obj).forEach(k => { if (obj[k] == null) delete r.params[k]; else r.params[k] = obj[k]; });
  history.replaceState(null, '', buildHash(r.route, r.params));
  onRoute();
}
function screenKey(r) {
  var p = Object.assign({}, r.params);
  ['theme', 'sheet', 'drawer', 'capture', 'embed', 'snack'].forEach(k => { delete p[k]; });
  return r.route + '?' + JSON.stringify(p);
}

function onRoute() {
  var r = parseHash();
  if (!ROUTES[r.route]) r.route = 'home';
  var p = r.params;
  var root = document.documentElement;
  root.dataset.theme = p.theme === 'dark' ? 'dark' : 'light';
  root.classList.toggle('capture', p.capture === '1');
  root.classList.toggle('embed', p.embed === '1');
  var key = screenKey(r);
  var prev = current;
  current = { route: r.route, params: p, key: key };
  if (key !== prev.key) renderScreen(prev);
  renderDrawer();
  renderSheet();
  renderControls();
  if (p.snack && SNACKS[p.snack]) { var s = SNACKS[p.snack]; snack(s[0], s[1], true); }
  fit();
}

function renderScreen(prev) {
  var R = ROUTES[current.route];
  var p = current.params;
  var scr = $('#screen');
  var oldPanel = $('#panel');
  var keepScroll = oldPanel && prev && prev.route === current.route && (prev.params.step || '') === (p.step || '');
  var top = keepScroll ? oldPanel.scrollTop : 0;
  clearTimers();
  var ds = R.data ? dataState(p.state, R) : null;
  var out = ds && ds.html != null ? { html: ds.html } : R.render(p);
  if (typeof out === 'string') out = { html: out };
  if (ds && ds.pre) out.html = ds.pre + out.html;
  if (S.updating && !(ds && ds.pre)) out.html = progressTop() + out.html;
  var h = '';
  if (R.chrome === false) {
    h = out.html;
  } else {
    var title = typeof R.title === 'function' ? R.title(p) : R.title;
    h += '<header class="appbar">' +
      (R.back
        ? '<button class="icon-btn sl" data-action="back" aria-label="Voltar">' + ic('arrow_back') + '</button>'
        : '<button class="icon-btn sl" data-action="toggle-drawer" aria-label="Abrir menu" aria-expanded="' + (p.drawer === '1') + '">' + ic('menu') + '</button>') +
      '<h1>' + esc(title) + '</h1>' +
      '<button class="icon-btn sl logo-btn" data-go="about" aria-label="Sobre o AO UERJ">' + window.aoLogo('', 'Logo AO') + '</button></header>' +
      '<main class="panel' + (out.bar ? ' has-bar' : '') + '" id="panel">' + out.html + '</main>' + (out.bar || '');
  }
  scr.innerHTML = h;
  var panel = $('#panel');
  if (panel && top) panel.scrollTop = top;
  revealChips(scr);
  if (out.after) out.after();
}

/* fileiras de chips: o chip selecionado nunca fica fora da tela */
function revealChips(root, smooth) {
  $$('.chips', root).forEach(row => {
    var sel = row.querySelector('.chip.sel');
    if (!sel) return;
    var l = sel.offsetLeft, r = l + sel.offsetWidth;
    if (l >= row.scrollLeft + 8 && r <= row.scrollLeft + row.clientWidth - 8) return;
    var x = Math.max(0, l - (row.clientWidth - sel.offsetWidth) / 2);
    if (smooth && !isCapture()) row.scrollTo({ left: x, behavior: 'smooth' }); else row.scrollLeft = x;
  });
}
function setChipSel(c, on) {
  c.classList.toggle('sel', on);
  c.setAttribute('aria-pressed', String(on));
  var m = c.querySelector('.ms');
  if (m) m.remove();
  if (on) c.insertAdjacentHTML('afterbegin', ic('check'));
}

/* ---------------------------------------------------------------- menu lateral */
var NAV = [
  { group: 'Acadêmico' },
  { id: 'home', label: 'Início', icon: 'home' },
  { id: 'progress', label: 'Meu Progresso', icon: 'trending_up' },
  { id: 'realizadas', label: 'Disciplinas Realizadas', icon: 'task_alt' },
  { id: 'curriculo', label: 'Disciplinas do Currículo', icon: 'account_tree' },
  { id: 'universais', label: 'Disciplinas Universais', icon: 'public' },
  { id: 'pesquisa', label: 'Pesquisa de Disciplinas', icon: 'search' },
  { group: 'Ferramentas' },
  { id: 'generator', label: 'Gerador de Grade', icon: 'calendar_view_week' },
  { id: 'board', label: 'Mural de Mensagens', icon: 'forum' },
  { rule: true },
  { id: 'about', label: 'Sobre', icon: 'info' },
];
function buildDrawer() {
  var s = D.student;
  var nameParts = s.name.split(/\s+/);
  var h = '<div class="drawer-user"><div class="avatar" aria-hidden="true">' + (nameParts[0][0] + nameParts[nameParts.length - 1][0]).toUpperCase() + '</div><div><div class="nm">' + esc(s.name) + '</div>' +
    '<div class="mt tnum">Matrícula ' + s.matricula + '</div><div class="mt">' + esc(s.course) + '</div></div></div>' +
    '<div class="drawer-nav" id="drawerNav"><div class="drawer-pill" id="drawerPill" aria-hidden="true"></div>';
  NAV.forEach(n => {
    if (n.group) h += '<div class="drawer-sec">' + n.group + '</div>';
    else if (n.rule) h += '<div class="drawer-rule" role="separator"></div>';
    else h += '<a class="drawer-item" href="#/' + n.id + '" data-nav="' + n.id + '">' + ic(n.icon) + '<span>' + n.label + '</span></a>';
  });
  h += '</div><div class="drawer-foot"><button class="drawer-item" data-action="logout">' + ic('logout') + '<span>Sair</span></button>' +
    '<div class="drawer-ver tnum">AO UERJ · Versão ' + D.version + '</div></div>';
  $('#drawer').innerHTML = h;
}
function movePill(id) {
  var pill = $('#drawerPill');
  var item = id && $('.drawer-item[data-nav="' + id + '"]');
  if (!item) { pill.style.opacity = '0'; return; }
  pill.style.opacity = '1';
  pill.style.transform = 'translateY(' + item.offsetTop + 'px)';
}
function renderDrawer() {
  var R = ROUTES[current.route];
  var navId = R.nav || current.route;
  $$('.drawer-item[data-nav]').forEach(a => {
    if (a.dataset.nav === navId) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  movePill(navId);
  var open = current.params.drawer === '1' && R.chrome !== false;
  var app = $('#app'), drawer = $('#drawer');
  var wasOpen = app.classList.contains('drawer-open');
  app.classList.toggle('drawer-open', open);
  drawer.inert = !open;
  /* com o menu aberto o painel sai da ordem de foco; o cabeçalho continua ativo (o botão de menu fecha) */
  $$('#screen > :not(.appbar)').forEach(el => { el.inert = open; });
  var menuBtn0 = $('#screen .appbar [data-action="toggle-drawer"]');
  if (menuBtn0) {
    menuBtn0.setAttribute('aria-expanded', String(open));
    menuBtn0.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
    menuBtn0.querySelector('.ms').textContent = open ? 'menu_open' : 'menu';
  }
  if (open && !wasOpen && !isCapture()) {
    var first = $('.drawer-item', drawer);
    if (first) first.focus({ preventScroll: true });
  }
  if (!open && wasOpen) {
    var a = document.activeElement;
    if (!a || a === document.body || drawer.contains(a) || a === $('#screenShield')) {
      var menuBtn = $('#screen [data-action="toggle-drawer"]');
      if (menuBtn) menuBtn.focus({ preventScroll: true });
    }
  }
  $('#gesture').classList.toggle('on-blue', open || current.route === 'splash');
}

/* ---------------------------------------------------------------- folhas inferiores */
var sheetReturn = null;
function renderSheet() {
  var name = current.params.sheet;
  var layer = $('#sheetLayer');
  if (!name || !SHEETS[name]) {
    var wasOpen = layer.classList.contains('open');
    layer.classList.remove('open');
    layer.setAttribute('aria-hidden', 'true');
    layer.inert = true;
    layer.dataset.sheet = '';
    $('#screen').inert = false;
    /* devolve o foco ao gatilho que abriu a folha */
    if (wasOpen && sheetReturn && document.contains(sheetReturn)) sheetReturn.focus({ preventScroll: true });
    sheetReturn = null;
    return;
  }
  if (layer.dataset.sheet === name && layer.classList.contains('open')) return;
  if (!layer.classList.contains('open')) {
    var a = document.activeElement;
    sheetReturn = a && a !== document.body && !layer.contains(a) ? a : null;
  }
  layer.dataset.sheet = name;
  fillSheet();
  layer.removeAttribute('aria-hidden');
  layer.inert = false;
  $('#screen').inert = true;
  void layer.offsetWidth;
  layer.classList.add('open');

}

var SNACKS = {

};
var snackTimer;
function snack(text, sub, sticky) {

    '<button class="icon-btn sl" data-action="snack-close" aria-label="Dispensar" style="color:inherit;margin:-6px -4px -6px 0">' + ic('close', 's20') + '</button>';
  var bar = $('#screen .bottom-bar');

  el.classList.add('show');

  if (!sticky && !isCapture()) snackTimer = setTimeout(() => el.classList.remove('show'), 3400);
}

/* ---------------------------------------------------------------- timers de tela */
var timers = [];
function timer(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

/* ---------------------------------------------------------------- moldura */
function fit() {
  var dev = $('#device');
  var framed = window.innerWidth >= 900 && current.params.embed !== '1';
  dev.style.zoom = framed ? Math.min(1, (window.innerHeight - 28) / 910).toFixed(3) : '';

/* ================================================================ início */

/* ================================================================ meu progresso */
function crChart() {
  var pts = D.craPoints, n = pts.length;
  var W = 340, H = 200, L = 38, R = 22, T = 22, B = 30;
  var vals = pts.map(p => p.cra);
  var lo = Math.floor((Math.min.apply(null, vals) - 0.25) * 2) / 2;
  var hi = Math.ceil((Math.max.apply(null, vals) + 0.1) * 2) / 2;
  var x = i => L + i * (W - L - R) / (n - 1);
  var y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  var g = '', a = '';
  for (var v = lo; v <= hi + 1e-9; v += 0.5) {
    g += '<line x1="' + L + '" x2="' + (W - 4) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/>';
    a += '<text x="' + (L - 8) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + fmt(v) + '</text>';
  }
  pts.forEach((p, i) => { a += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + p.label + '</text>'; });
  var line = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.cra).toFixed(1)).join(' ');
  var area = line + ' L' + x(n - 1).toFixed(1) + ' ' + (H - B) + ' L' + x(0).toFixed(1) + ' ' + (H - B) + ' Z';
  var dots = pts.map((p, i) => '<circle class="pt' + (i === n - 1 ? ' last' : '') + '" cx="' + x(i).toFixed(1) + '" cy="' + y(p.cra).toFixed(1) + '" r="4"/>').join('');
  var last = pts[n - 1];
  var lbl = '<text class="lbl" x="' + x(n - 1).toFixed(1) + '" y="' + (y(last.cra) - 12).toFixed(1) + '" text-anchor="middle">' + fmt(last.cra, 2) + '</text>';
  var step = (W - L - R) / (n - 1);
  var hits = pts.map((p, i) => '<rect class="hit" data-i="' + i + '" x="' + (x(i) - step / 2).toFixed(1) + '" y="0" width="' + step.toFixed(1) + '" height="' + H + '"/>').join('');
  return '<div class="chart" id="crChart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="CR acumulado por período, de ' + fmt(pts[0].cra, 2) + ' em ' + pts[0].label + ' a ' + fmt(last.cra, 2) + ' em ' + last.label + '">' +
    '<g class="grid">' + g + '</g><g class="axis">' + a + '</g><path class="area" d="' + area + '"/><path class="line" d="' + line + '"/>' +
    '<line class="cross" id="crCross" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '"/>' + dots + lbl + hits + '</svg><div class="tip" id="crTip"></div></div>' +
    '<table class="chart-table" id="crTable"' + (S.showTable ? '' : ' hidden') + '><thead><tr><th>Período</th><th>CR acumulado</th><th>Média do período</th></tr></thead><tbody>' +
    pts.map(p => '<tr><td>' + p.label + '</td><td>' + fmt(p.cra, 2) + '</td><td>' + fmt(p.periodAverage, 2) + '</td></tr>').join('') + '</tbody></table>';
}
function bindChart() {
  var box = $('#crChart');
  if (!box) return;
  var svg = box.querySelector('svg'), tip = $('#crTip'), cross = $('#crCross');
  var show = el => {
    var i = +el.dataset.i, p = D.craPoints[i];
    var cx = el.x.baseVal.value + el.width.baseVal.value / 2;
    var scale = svg.getBoundingClientRect().width / 340 / (parseFloat(getComputedStyle($('#device')).zoom) || 1);
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.style.opacity = 1;
    tip.innerHTML = '<b>' + p.label + '</b>CR acumulado ' + fmt(p.cra, 2) + '<br>Média do período ' + fmt(p.periodAverage, 2);
    tip.style.left = Math.min(Math.max(cx * scale, 70), 340 * scale - 70) + 'px';
    tip.classList.add('show');
  };
  var hide = () => { tip.classList.remove('show'); cross.style.opacity = 0; };
  $$('.hit', svg).forEach(r => { r.addEventListener('pointerenter', () => show(r)); r.addEventListener('click', () => show(r)); });
  svg.addEventListener('pointerleave', hide);
}

          '<div class="sp"><span>' + ap.completed[t] + ' de ' + ap.totals[t] + ' disciplinas</span><span>' + (ap.remaining[t] ? 'Faltam ' + plural(ap.remaining[t], 'disciplina', 'disciplinas') : 'Concluído') + '</span></div>';
      } else if (!ap.requiredCredits[t]) {
        h += '<div class="top" style="margin-bottom:2px"><h3>' + TYPE_PLURAL[t] + '</h3><span class="pct muted">—</span></div>' +
          '<div class="sp" style="margin-top:0"><span>' + plural(ap.completedCredits[t], 'crédito concluído', 'créditos concluídos') + '</span><span>Exigência não configurada</span></div>';
      } else {
        var req = ap.requiredCredits[t], done = ap.completedCredits[t];
        h += '<div class="top"><h3>' + TYPE_PLURAL[t] + '</h3><span class="pct">' + pct + '%</span></div>' +
          '<div class="bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="' + TYPE_PLURAL[t] + '"><i style="width:' + pct + '%"></i></div>' +
          '<div class="sp"><span>' + done + ' de ' + req + ' créditos</span><span>' + (req > done ? 'Faltam ' + plural(req - done, 'crédito', 'créditos') : 'Concluído') + '</span></div>';
      }
      h += '</div>';
    });
    h += '</div></section>';
    return { html: h, after: bindChart };
  },
};

var GEN_LABELS = ['Qtd. Disciplinas', 'Horários Ocupados', 'Prioridades', 'Selecionar Disciplinas', 'Carregar Dados', 'Turmas', 'Gerar Grade'];
function genErr() {
  var g = S.gen;
  if (g.min == null) return 'O mínimo de matérias é obrigatório';
  if (g.max == null) return 'O máximo de matérias é obrigatório';
  if (g.min < 1 || g.min > 12 || g.max < 1 || g.max > 12) return 'Escolha valores entre 1 e 12.';
  if (g.min > g.max) return 'O mínimo não pode ser maior que o máximo.';
  return '';
}
function genAvailable() {
  var inProgress = {};
  D.history.forEach(h => { if (h.status === 'IN_PROGRESS') inProgress[h.id] = true; });
  return D.curriculum.filter(c => !c.alreadyTaken && !inProgress[c.id]);
}
function genStepper(step) {
  var h = '<nav class="stepper" id="stepper" aria-label="Passos do gerador">';
  GEN_LABELS.forEach((l, i) => {
    var n = i + 1, st = n < step ? 'done' : n === step ? 'cur' : '';
    if (i) h += '<span class="step-line' + (n <= step ? ' done' : '') + '" aria-hidden="true"></span>';
    h += '<button class="step sl ' + st + '"' + (n < step ? ' data-go="generator?step=' + n + '"' : n > step ? ' disabled' : '') + (n === step ? ' aria-current="step"' : '') + '>' +
      '<span class="no">' + (n < step ? ic('check') : n) + '</span>' + l + '</button>';
  });
  return h + '</nav>';
}
function shiftOfMeetings(s) { var m = /([MTN])\d/.exec(s); return m ? shiftOfSlot(m[1]) : 'MORNING'; }

<script>
/* ================================================================ ações */
ACTIONS['toggle-drawer'] = () => setParams({ drawer: current.params.drawer === '1' ? null : '1' });
ACTIONS['close-drawer'] = () => setParams({ drawer: null });
ACTIONS['open-sheet'] = t => {
  if (t.dataset.sheet === 'report') S.report = { step: 1, page: '', code: '', desc: '' };
  if (t.dataset.sheet === 'credits') S.creditsConfirm = false;
  setParams({ sheet: t.dataset.sheet });
};
ACTIONS['close-sheet'] = () => setParams({ sheet: null });
ACTIONS['snack-close'] = () => { $('#snackbar').classList.remove('show'); if (current.params.snack) setParams({ snack: null }); };
ACTIONS.back = () => {
  var R = ROUTES[current.route];
  go(current.params.from || (typeof R.back === 'string' ? R.back : 'pesquisa'));
};
ACTIONS.logout = () => { S.login = { mat: '', pass: '', show: false, loading: false, err: '' }; go('login'); };
ACTIONS.retry = () => {
  var r = current.route;
  if (current.params.state === 'rid') {
    S.updating = true;
    current.key = null; onRoute();
    later(() => { S.updating = false; if (current.route === r) { current.key = null; onRoute(); } }, 1600);
    return;
  }
  setParams({ state: 'updating', more: null });
  later(() => { if (current.route === r) setParams({ state: null }); }, 1600);
};
ACTIONS['banner-toggle'] = t => {
  var b = t.closest('.banner'), open = !b.classList.contains('open');
  b.classList.toggle('open', open);
  t.setAttribute('aria-expanded', String(open));
  b.querySelector('.banner-more').hidden = !open;
};
ACTIONS.share = () => snack('Abrindo opções para compartilhar a grade da semana…');
ACTIONS.day = t => {
  var d = +t.dataset.day;
  if (d === S.day) return;
  S.day = d;
  $$('.day').forEach(b => { var on = +b.dataset.day === d; b.classList.toggle('sel', on); b.setAttribute('aria-selected', String(on)); });
  $('#daysInd').style.transform = 'translateX(calc(' + (d - 1) + ' * (100% + 4px)))';
  var tl = $('#tl');
  tl.classList.add('fade');
  later(() => { tl.innerHTML = timeline(d); tl.classList.remove('fade'); }, 150);
};
ACTIONS['toggle-table'] = t => {
  S.showTable = !S.showTable;
  $('#crTable').hidden = !S.showTable;
  t.setAttribute('aria-pressed', String(S.showTable));
  t.innerHTML = ic(S.showTable ? 'show_chart' : 'table_rows') + (S.showTable ? 'Ocultar tabela' : 'Ver tabela');
};
ACTIONS['credits-ask'] = () => { S.creditsConfirm = true; fillSheet(); };
ACTIONS['credits-cancel'] = () => { S.creditsConfirm = false; fillSheet(); };
ACTIONS['credits-reset'] = () => {
  S.creditsConfirm = false;
  ['RESTRICTED', 'DEFINED', 'UNIVERSAL'].forEach(k => { S.credits[k] = 0; });
  current.key = null;
  setParams({ sheet: null, state: 'unconfigured' });
  snack('Configurações de créditos resetadas.');
};
ACTIONS['credits-save'] = () => {
  var vals = {};
  ['RESTRICTED', 'DEFINED', 'UNIVERSAL'].forEach(k => { vals[k] = Math.max(0, parseInt($('#f-cr-' + k).value, 10) || 0); });
  S.credits = vals;
  current.key = null;
  setParams({ sheet: null, state: null });
  snack('Créditos exigidos salvos.');
};

/* gerador */
ACTIONS['gen-prev'] = () => { var s = +current.params.step || 1; if (s > 1) go('generator', { step: s - 1 }); };
ACTIONS['gen-next'] = () => {
  var s = +current.params.step || 1;
  if (s >= 7) return;
  if (s + 1 === 5) S.gen.fetched = isCapture() ? null : 0;
  go('generator', s + 1 === 7 ? { step: 7, state: 'ready' } : { step: s + 1 });
};
ACTIONS.amt = t => {
  var k = t.dataset.k, g = S.gen;
  var v = (g[k] == null ? (k === 'min' ? 1 : 12) : g[k]) + (+t.dataset.d);
  g[k] = Math.min(12, Math.max(1, v));
  current.key = null; onRoute();
};
ACTIONS['busy-preset'] = t => {
  var sh = t.dataset.sh, full = shiftFull(sh);
  shiftSlots(sh).forEach(s => D.WEEKDAYS.forEach(w => { S.gen.busy[w.n + '-' + s.id] = !full; }));
  refreshBusy();
};
ACTIONS['busy-clear'] = () => { S.gen.busy = {}; refreshBusy(); };
ACTIONS.prio = t => {
  var key = t.dataset.key, on = !S.gen.prio[key];
  D.generator.priorities.forEach(gr => { if (gr.some(o => o.key === key) && on) gr.forEach(o => { S.gen.prio[o.key] = false; }); });
  S.gen.prio[key] = on;
  $$('#prioList [role="switch"]').forEach(sw => sw.setAttribute('aria-checked', String(!!S.gen.prio[sw.dataset.key])));
  $('#prioPresets').innerHTML = prioPresets();
};
ACTIONS['prio-preset'] = t => {
  var p = D.generator.priorityPresets[+t.dataset.i];
  S.gen.prio = {};
  p.keys.forEach(k => { S.gen.prio[k] = true; });
  $$('#prioList [role="switch"]').forEach(sw => sw.setAttribute('aria-checked', String(!!S.gen.prio[sw.dataset.key])));
  $('#prioPresets').innerHTML = prioPresets();
};
ACTIONS['gen-type'] = t => {
  S.gen.type = t.dataset.t;
  $$('.chip', t.parentNode).forEach(c => setChipSel(c, c.dataset.t === S.gen.type));
  revealChips(t.parentNode.parentNode, true);
  $('#genPicks').innerHTML = genPicks(); $('#genCounter').innerHTML = genCounter();
};
ACTIONS['pick-subj'] = t => {
  var id = t.dataset.id;
  S.gen.subjects[id] = !S.gen.subjects[id];
  t.setAttribute('aria-checked', String(S.gen.subjects[id]));
  $('#genCounter').innerHTML = genCounter();
  $('#genNext').disabled = !genAvailable().some(c => S.gen.subjects[c.id]);
};
ACTIONS['pick-class'] = t => {
  var k = t.dataset.k;
  S.gen.classes[k] = !S.gen.classes[k];
  t.setAttribute('aria-checked', String(S.gen.classes[k]));
  $('#classCounter').innerHTML = classCounter();
  $('#genNext').disabled = !D.generator.classes.some(c => S.gen.classes[c.subjectId + '#' + c.classNumber]);
};
ACTIONS['gen-run'] = () => {
  var next = (+current.params.grade || 0) % 3 + 1;
  if (current.params.state === 'ready' || current.params.state === 'empty') next = 1;
  setParams({ state: 'generating', grade: null, tab: null });
  later(() => { if (current.route === 'generator') setParams({ state: null, grade: next }); }, 1300);
};
ACTIONS['gen-grade'] = t => setParams({ grade: t.dataset.g });
ACTIONS['gen-tab'] = t => setParams({ tab: t.dataset.t === 'schedule' ? 'schedule' : null });

/* mural */
ACTIONS['copy-msg'] = (t, e) => {
  if (e.target.closest('a')) return;
  var text = t.querySelector('.tx').textContent;
  try { navigator.clipboard && navigator.clipboard.writeText(text).catch(() => {}); } catch (err) { /* sem permissão em file:// */ }
  snack(D.copy.copied, D.copy.copiedDetail);
};

/* listas */
ACTIONS['hist-period'] = t => {
  S.hist.period = t.dataset.p;
  $$('#histChips .chip').forEach(c => setChipSel(c, c.dataset.p === S.hist.period));
  revealChips($('#panel'), true);
  $('#histList').innerHTML = histList(S.hist.period);
};
ACTIONS['cur-taken'] = t => { S.cur.taken = t.dataset.v === '1'; current.key = null; onRoute(); };
ACTIONS['cur-type'] = t => {
  S.cur.type = t.dataset.t;
  $$('.chip', t.parentNode).forEach(c => setChipSel(c, c.dataset.t === S.cur.type));
  revealChips($('#panel'), true);
  $('#curList').innerHTML = curList();
};
ACTIONS['cur-clear'] = () => { S.cur = { type: '', taken: S.cur.taken, q: '' }; current.key = null; onRoute(); };
ACTIONS['uni-clear'] = () => { S.uni = { dept: '', q: '' }; current.key = null; setParams({ state: null }); };
ACTIONS['search-code'] = () => {
  var q = S.search.q.trim().toUpperCase();
  var m = /^(?:([A-Z]{2,5}\d{2})-)?(\d{5})$/.exec(q);
  if (!m) { snack(D.copy.invalidCode, D.copy.invalidCodeDetail); return; }
  var id = q;
  if (!m[1]) {
    var all = [].concat(D.curriculum, D.universals);
    var hit = all.filter(c => c.id.split('-').pop() === m[2])[0];
    id = hit ? hit.id : 'IME02-' + m[2];
  }
  go('subject', { id: id, from: 'pesquisa' });
};

/* login */
ACTIONS['toggle-pass'] = () => {
  S.login.show = !S.login.show;
  var inp = $('#f-pass');
  S.login.pass = inp.value;
  inp.type = S.login.show ? 'text' : 'password';
  var b = inp.parentNode.querySelector('[data-action="toggle-pass"]');
  b.innerHTML = ic(S.login.show ? 'visibility_off' : 'visibility');
  b.setAttribute('aria-label', S.login.show ? 'Ocultar senha' : 'Mostrar senha');
};
function submitLogin() {
  var mat = $('#f-mat').value.trim(), pass = $('#f-pass').value;
  S.login.mat = mat; S.login.pass = pass;
  if (!mat || !pass) { S.login.err = D.copy.loginEmpty; current.key = null; setParams({ state: null }); return; }
  S.login.err = ''; S.login.loading = true;
  var r = parseHash();
  delete r.params.state;
  history.replaceState(null, '', buildHash(r.route, r.params));
  current.key = null; onRoute();
  later(() => { S.login.loading = false; go('splash'); later(() => { if (current.route === 'splash') go('home'); }, 1500); }, 1100);
}

/* folha de relato */
ACTIONS['report-next'] = () => { S.report.step = 2; fillSheet(); var ta = $('#f-rd'); if (ta) ta.focus(); };
ACTIONS['report-back'] = () => { S.report.step = 1; fillSheet(); };
ACTIONS['report-send'] = () => { setParams({ sheet: null }); snack('Relato enviado. Obrigado por ajudar a melhorar o app!'); S.report = { step: 1, page: '', code: '', desc: '' }; };

/* campos */
ACTIONS['clear-field'] = t => {
  var inp = $('#' + t.dataset.for);
  inp.value = '';
  inp.dispatchEvent(new Event('input', { bubbles: true }));
  inp.focus();
};

/* controles da apresentação */
ACTIONS.theme = t => setParams({ theme: t.dataset.theme === 'dark' ? 'dark' : null });
ACTIONS['ctrl-open'] = () => $('#ctrl').classList.add('open');
ACTIONS['ctrl-close'] = () => $('#ctrl').classList.remove('open');

/* ================================================================ entradas de texto */
INPUTS['login-mat'] = t => { t.value = t.value.replace(/\D/g, ''); S.login.mat = t.value; };
INPUTS['login-pass'] = t => { S.login.pass = t.value; };
INPUTS.amt = t => {
  var v = t.value.replace(/\D/g, '');
  t.value = v;
  S.gen[t.dataset.k] = v === '' ? null : parseInt(v, 10);

  $('#genNext').disabled = !!err;
};
INPUTS['gen-q'] = t => { S.gen.q = t.value; $('#genPicks').innerHTML = genPicks(); $('#genCounter').innerHTML = genCounter(); };

INPUTS['msg-period'] = t => { S.board.period = t.value; current.key = null; onRoute(); };
INPUTS['cur-q'] = t => { S.cur.q = t.value; $('#curList').innerHTML = curList(); };
INPUTS['uni-q'] = t => { S.uni.q = t.value; $('#uniList').innerHTML = uniList(); if (current.params.state) history.replaceState(null, '', buildHash('universais', Object.assign({}, current.params, { state: undefined }))); };
INPUTS['uni-dept'] = t => { S.uni.dept = t.value; $('#uniList').innerHTML = uniList(); };
INPUTS['search-q'] = t => { S.search.q = t.value; };

INPUTS['report-code'] = t => { S.report.code = t.value; };
INPUTS['report-desc'] = t => { S.report.desc = t.value; var b = $('[data-action="report-send"]'); if (b) b.disabled = !t.value.trim(); };

/* ================================================================ eventos */
var longPress = { t: null, fired: false };
document.addEventListener('click', e => {
  var t = e.target.closest('[data-cell],[data-nav],[data-link],[data-go],[data-action]');
  if (!t || t.disabled) return;
  if (t.dataset.cell) {
    if (longPress.fired) { longPress.fired = false; return; }
    var k = t.dataset.cell;
    S.gen.busy[k] = !S.gen.busy[k];
    refreshBusy();
    return;
  }
  if (t.dataset.nav) {
    e.preventDefault();
    var id = t.dataset.nav;
    $$('.drawer-item[data-nav]').forEach(a => { if (a === t) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    movePill(id);
    later(() => go(id), 200);
    return;
  }
  if (t.dataset.link) {
    e.preventDefault();
    S.gen.fetched = null;
    $('#ctrl').classList.remove('open');
    go(t.dataset.link);
    return;
  }
  if (t.dataset.go) {
    if (t.tagName === 'A' && (e.metaKey || e.ctrlKey)) return;
    e.preventDefault();
    go(t.dataset.go);
    return;
  }
  var fn = ACTIONS[t.dataset.action];
  if (fn) fn(t, e);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'loginForm') submitLogin();
  if (e.target.id === 'composer') {
    var inp = $('#msgInput'), text = inp.value.trim();
    if (!text) return;
    var id = current.params.id || 'IME02-10892';
    (S.board.msgs[id] = S.board.msgs[id] || []).push({ author: D.student.name.split(' ').slice(0, 2).join(' '), at: '13/10/2026', time: D.now.time, text: text, mine: true });
    S.board.draft = '';
    S.board.period = '2026.2';
    current.key = null; onRoute();
    var again = $('#msgInput'); if (again) again.focus();
  }
});
document.addEventListener('input', e => {
  var t = e.target;
  var f = t.closest('.field');
  if (f && !f.querySelector('select')) {
    f.classList.toggle('up', t.value !== '');
    var c = f.querySelector('.clear[data-action="clear-field"]');
    if (c) c.hidden = t.value === '';
    f.classList.remove('err');
  }
  if (t.dataset.input && INPUTS[t.dataset.input]) INPUTS[t.dataset.input](t, e);
});
document.addEventListener('change', e => {
  var t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.input && INPUTS[t.dataset.input]) INPUTS[t.dataset.input](t, e);
});
document.addEventListener('keydown', e => {
  var t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON') { e.preventDefault(); t.click(); return; }
  if (e.key === 'Enter' && t.dataset && t.dataset.enter) {
    e.preventDefault();
    if (t.dataset.enter === 'focus-pass') $('#f-pass').focus();
    else if (ACTIONS[t.dataset.enter]) ACTIONS[t.dataset.enter](t, e);
    return;
  }
  if (e.key === 'Tab' && current.params.sheet) {
    var f = sheetFocusables(), a = document.activeElement;
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (!$('#sheet').contains(a)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (e.shiftKey && (a === first || a === $('#sheetTitle'))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.key === 'Escape') {
    if (current.params.sheet) setParams({ sheet: null });
    else if (current.params.drawer) setParams({ drawer: null });
    $('#ctrl').classList.remove('open');
  }
});
document.addEventListener('pointerdown', e => {
  var c = e.target.closest && e.target.closest('[data-cell]');
  if (!c) return;
  longPress.fired = false;
  clearTimeout(longPress.t);
  longPress.t = setTimeout(() => {
    longPress.fired = true;
    var parts = c.dataset.cell.split('-'), day = parts[0], sh = shiftOfSlot(parts[1]);
    var slots = shiftSlots(sh), full = slots.every(s => S.gen.busy[day + '-' + s.id]);
    slots.forEach(s => { S.gen.busy[day + '-' + s.id] = !full; });
    refreshBusy();
    if (navigator.vibrate) navigator.vibrate(12);
  }, 480);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => clearTimeout(longPress.t), true));
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('[data-cell]')) e.preventDefault(); });

];
function buildControls() {
  var h = '<button class="icon-btn ctrl-close" data-action="ctrl-close" aria-label="Fechar controles" style="color:var(--page-ink)">' + ic('close') + '</button>' +
    '<div><h1>' + window.aoLogo('', 'AO UERJ') + 'Variante 1 · Material</h1><p class="lede">Inspirada nos apps do Google no Android. A mais próxima do app atual: mesma estrutura, componentes Material 3 e tons derivados do azul UERJ.</p></div>' +
    '<div class="seg" role="group" aria-label="Tema" style="--outline:var(--page-rule);color:var(--page-ink)"><button class="sl" data-action="theme" data-theme="light" id="thLight">Claro</button><button class="sl" data-action="theme" data-theme="dark" id="thDark">Escuro</button></div><nav>';
  CTRL.forEach(g => {
    h += '<div><h2>' + g[0] + '</h2><ul>' + g[1].map(l => '<li><a href="#/' + l[0] + '" data-link="' + l[0] + '">' + l[1] + '</a></li>').join('') + '</ul></div>';
  });
  h += '</nav><p class="note">' + esc(D.note) + ' Nomes, notas, salas e mensagens são inventados.</p>';
  $('#ctrl').innerHTML = h;
}
function renderControls() {
  var dark = current.params.theme === 'dark';
  var a = $('#thLight'), b = $('#thDark');
  a.setAttribute('aria-pressed', String(!dark)); b.setAttribute('aria-pressed', String(dark));
  a.innerHTML = (!dark ? ic('check') : '') + 'Claro'; b.innerHTML = (dark ? ic('check') : '') + 'Escuro';
  var p = Object.assign({}, current.params);
  ['theme', 'capture', 'embed'].forEach(k => { delete p[k]; });
  var me = current.route + (Object.keys(p).length ? '?' + Object.keys(p).map(k => k + '=' + p[k]).join('&') : '');
  $$('#ctrl a[data-link]').forEach(l => l.setAttribute('aria-current', String(l.dataset.link === me)));
}

/* ================================================================ partida */
buildDrawer();
buildControls();
if (!location.hash || location.hash === '#' || location.hash === '#/') history.replaceState(null, '', '#/home');
window.addEventListener('hashchange', onRoute);
window.addEventListener('resize', fit);
onRoute();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { movePill((ROUTES[current.route].nav || current.route)); revealChips($('#screen')); });
</script>
</body>
</html>
