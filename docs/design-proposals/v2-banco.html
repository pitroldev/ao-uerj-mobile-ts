<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AO UERJ · Variante 2 · Banco digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<style>
/* ------------------------------------------------------------ tokens */
:root {
  --uerj: #003468; --uerj-2: #004891; --uerj-3: #016BA5;
  --head: #003468; --head-2: #0A3F78; --head-3: #134C88; --head-ink: #FFFFFF; --head-ink-2: #C3D5EA;
  --drawer: #003468; --drawer-hi: #004891; --drawer-ink: #FFFFFF; --drawer-ink-2: #B4C8E1; --drawer-line: rgba(255,255,255,.14);
  --bg: #FFFFFF; --surface: #F3F5F9; --surface-3: #E7EBF1;
  --ink: #0F1B2D; --ink-2: #5A6475; --line: #E5E9EF; --line-strong: #CBD2DC;
  --outline: #7A8496; --chart-bar: #6993BB; --field-line: #B4BCC8;
  --brand-ink: #003468;
  --accent: #016BA5; --accent-soft: #E1EEF8; --accent-soft-ink: #0A4A72;
  --btn: #003468; --btn-ink: #FFFFFF; --btn-hover: #0A3F78;
  --good: #D6F2DD; --good-ink: #14532B; --good-line: #2E9A56;
  --bad: #FAEFC0; --bad-ink: #5F4900; --bad-line: #C49400;
  --crit: #FBDADD; --crit-ink: #8A1B25; --crit-line: #D23B47;
  --none: #E9ECF1; --none-ink: #475061;
  --morning: #FBF4C9; --morning-ink: #574A00;
  --afternoon: #FFE6D0; --afternoon-ink: #763A0B;
  --night: #D6EFFA; --night-ink: #0B4A61;
  --busy: #FFD5D5; --busy-ink: #8A1B25;
  --snack: #18212F; --snack-ink: #F3F6FA; --snack-2: #AEB9C9;
  --scrim: rgba(4, 16, 34, .46);
  --skel: #E8ECF2; --skel-hi: #F4F6F9;
  --page: #E6E9EE; --page-ink: #17202D; --page-ink-2: #566070; --page-line: #CDD3DC; --page-hover: rgba(15,27,45,.06);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
[data-theme="dark"] {
  --head: #0A2245; --head-2: #12305A; --head-3: #1A3A68; --head-ink: #F2F6FB; --head-ink-2: #A8BBD3;
  --drawer: #0A2245; --drawer-hi: #1B4579; --drawer-ink: #F2F6FB; --drawer-ink-2: #A3B6CF; --drawer-line: rgba(255,255,255,.10);
  --bg: #0D1117; --surface: #161C26; --surface-3: #202835;
  --ink: #E7ECF3; --ink-2: #9AA6B8; --line: #222B38; --line-strong: #344052;
  --outline: #6B7890; --chart-bar: #3F6F9A; --field-line: #3A4659;
  --brand-ink: #A9CCF0;
  --accent: #5BB2E8; --accent-soft: #12314A; --accent-soft-ink: #B7DDF6;
  --btn: #5BB2E8; --btn-ink: #03223A; --btn-hover: #7CC3EE;
  --good: #16382A; --good-ink: #A3E6B7; --good-line: #5CCB86;
  --bad: #383014; --bad-ink: #F0D77E; --bad-line: #E0BC4A;
  --crit: #451A20; --crit-ink: #F6AFB6; --crit-line: #F07A85;
  --none: #222A36; --none-ink: #B8C1CE;
  --morning: #34311A; --morning-ink: #ECDF92;
  --afternoon: #3B2A1B; --afternoon-ink: #F5C9A1;
  --night: #12313D; --night-ink: #97D9EF;
  --busy: #451A20; --busy-ink: #F6AFB6;
  --snack: #E7ECF3; --snack-ink: #0F1B2D; --snack-2: #475263;
  --scrim: rgba(0, 0, 0, .58);
  --skel: #1A212C; --skel-hi: #232C39;
  --page: #080B10; --page-ink: #E4E9F0; --page-ink-2: #97A2B3; --page-line: #222A35; --page-hover: rgba(255,255,255,.06);
  color-scheme: dark;
}

/* ------------------------------------------------------------ base */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: 'Figtree', system-ui, sans-serif;
  font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
::selection { background: var(--accent); color: var(--bg); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero :focus-visible, .hdr :focus-visible, .drawer :focus-visible, .login-top :focus-visible { outline-color: #FFFFFF; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.ms {
  font-family: 'Material Symbols Outlined';
  font-weight: normal; font-style: normal; font-size: 24px; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap; word-wrap: normal; direction: ltr;
  display: inline-block; flex: none;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
  user-select: none;
}
.ms.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.ms.s16 { font-size: 16px; } .ms.s18 { font-size: 18px; } .ms.s20 { font-size: 20px; } .ms.s28 { font-size: 28px; } .ms.s32 { font-size: 32px; }
[hidden] { display: none !important; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ apresentação */
.stage {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  gap: 56px; padding: 24px; position: relative;
}
.device-wrap { width: calc(432px * var(--s, 1)); height: calc(912px * var(--s, 1)); flex: none; }
.device {
  width: 432px; height: 912px; border: 10px solid #0A0D12; border-radius: 46px;
  transform: scale(var(--s, 1)); transform-origin: 0 0;
  overflow: hidden; position: relative; display: flex; flex-direction: column;
  background: var(--head);
  box-shadow: 0 30px 60px -20px rgba(8, 14, 24, .45), 0 2px 6px rgba(8, 14, 24, .18), inset 0 0 0 1px #000;
}
[data-theme="dark"] .device { border-color: #2A313C; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .06), inset 0 0 0 1px #000; }
html.bare .stage { padding: 0; display: block; min-height: 0; height: 100vh; }
html.bare .device-wrap { width: 100vw; height: 100vh; }
html.bare .device { width: 100vw; height: 100vh; border: 0; border-radius: 0; transform: none; box-shadow: none; }
html.bare body { background: var(--head); }

.sbar {
  height: 28px; flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px 0 24px; background: var(--head); color: var(--head-ink);
  font-weight: 600; font-size: 14px; letter-spacing: .01em; position: relative; z-index: 5;
}
.sbar-icons { display: flex; gap: 6px; align-items: center; }
.sbar svg { display: block; fill: currentColor; }
.app { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--drawer); }
.gbar { height: 20px; flex: none; display: grid; place-items: center; background: var(--bg); transition: background-color 250ms var(--ease); }
.gbar i { width: 108px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .38; }
.device.on-blue .gbar, .device.drawer-open .gbar { background: var(--drawer); }
.device.on-blue .gbar i, .device.drawer-open .gbar i { background: #FFFFFF; opacity: .5; }

/* ------------------------------------------------------------ tela e cabeçalho */
.screen {
  position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
  background: var(--head);
  transition: transform 250ms var(--ease), box-shadow 250ms var(--ease);
}
.device.drawer-open .screen { transform: translateX(300px); box-shadow: -16px 0 40px rgba(0, 0, 0, .30); }
.catch { position: absolute; inset: 0 0 0 300px; z-index: 4; display: none; cursor: pointer; background: transparent; border: 0; }
.device.drawer-open .catch { display: block; }

.hdr {
  flex: none; display: grid; grid-template-columns: 56px 1fr 56px; align-items: center;
  height: 56px; padding: 0 4px; color: var(--head-ink); background: var(--head); position: relative; z-index: 2;
}
.hdr-title {
  justify-self: center; max-width: 100%; height: 48px; padding: 0 12px; border: 0; background: none; cursor: pointer;
  font-weight: 600; font-size: 18px; letter-spacing: -.01em; color: inherit;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 24px;
}
.iconbtn {
  width: 48px; height: 48px; border-radius: 24px; display: inline-grid; place-items: center;
  border: 0; background: transparent; color: inherit; cursor: pointer; flex: none; padding: 0;
  transition: background-color 150ms;
}
.iconbtn:hover { background: color-mix(in srgb, currentColor 9%, transparent); }
.iconbtn:active { background: color-mix(in srgb, currentColor 16%, transparent); }
.iconbtn.filled { background: var(--btn); color: var(--btn-ink); }
.iconbtn.filled:hover { background: var(--btn-hover); }
.iconbtn.soft { background: var(--surface); color: var(--ink); }
.logo-btn svg { width: 40px; height: 25px; display: block; }

/* ------------------------------------------------------------ painel claro (assinatura) */
.panel {
  flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column;
  background: var(--bg); border-top-left-radius: 48px; overflow: hidden;
}
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 28px 20px 32px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent;
}
.scroll::-webkit-scrollbar { width: 6px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
.homescroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--head); scrollbar-width: none; }
.homescroll::-webkit-scrollbar { display: none; }
.panel.flow { overflow: visible; min-height: 100%; padding: 24px 20px 40px; display: block; }
.panel-top { flex: none; padding: 24px 20px 0; }

/* ------------------------------------------------------------ resumo do Início (área do saldo) */
.hero { padding: 0 20px 28px; color: var(--head-ink); }
.hero-top { display: flex; align-items: center; justify-content: space-between; min-height: 52px; gap: 8px; }
.hello { margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -.015em; }
.hello span { font-weight: 400; }
.hero .iconbtn { margin-right: -12px; color: var(--head-ink); }
.nc {
  display: grid; grid-template-columns: auto 1fr auto; gap: 0 16px; align-items: center;
  width: 100%; margin-top: 10px; padding: 16px 8px 16px 18px; text-align: left; cursor: pointer;
  border: 0; border-radius: 20px; border-top-right-radius: 6px; background: var(--head-2); color: inherit;
  transition: background-color 150ms;
}
.nc:hover { background: var(--head-3); }
.nc-l { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding-right: 16px; border-right: 1px solid rgba(255,255,255,.14); }
.nc-time { font-size: 30px; line-height: 32px; font-weight: 800; letter-spacing: -.02em; }
.pill-when {
  display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px;
  background: #FFFFFF; color: #003468; font-size: 12px; font-weight: 700; white-space: nowrap;
}
[data-theme="dark"] .pill-when { background: #5BB2E8; color: #03223A; }
.nc-r { min-width: 0; }
.nc-r b { display: block; font-size: 17px; line-height: 22px; font-weight: 700; }
.nc-r span { display: block; margin-top: 4px; font-size: 13px; line-height: 18px; color: var(--head-ink-2); font-weight: 500; }
.nc .ms { color: var(--head-ink-2); }
.hero-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; }
.stat + .stat { border-left: 1px solid rgba(255,255,255,.14); padding-left: 18px; }
.stat-val { display: block; font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -.02em; }
.stat-lab { display: block; font-size: 13px; line-height: 18px; color: var(--head-ink-2); font-weight: 500; }
.mask { display: inline-block; vertical-align: middle; border-radius: 6px; background: rgba(255,255,255,.22); }
.stat .mask { width: 76px; height: 26px; margin: 4px 0; }
.hero-note { margin: 12px 0 0; font-size: 13px; line-height: 18px; color: var(--head-ink-2); }
.hero-empty {
  margin-top: 10px; padding: 16px 18px; border-radius: 20px; border-top-right-radius: 6px; background: var(--head-2);
  display: flex; gap: 14px; align-items: center; font-size: 15px; line-height: 21px; font-weight: 500;
}
.hero-empty .ms { color: var(--head-ink-2); }
.hero-rid b { color: var(--head-ink); display: block; font-size: 30px; line-height: 34px; font-weight: 800; letter-spacing: -.02em; }
.hero-rid > span:not(.ms) > span { display: block; font-size: 14px; color: var(--head-ink-2); font-weight: 500; }

/* ------------------------------------------------------------ menu lateral (drawerType back) */
.drawer {
  position: absolute; top: 0; left: 0; bottom: 0; width: 300px; z-index: 1;
  display: flex; flex-direction: column; padding: 8px 0 8px; background: var(--drawer); color: var(--drawer-ink);
  transform: translateX(-36px); opacity: .35; transition: transform 250ms var(--ease), opacity 250ms var(--ease);
  overflow-y: auto; scrollbar-width: none;
}
.device.drawer-open .drawer { transform: none; opacity: 1; }
.who { display: flex; gap: 14px; align-items: center; padding: 16px 20px 18px 24px; }
.avatar {
  width: 48px; height: 48px; border-radius: 24px; border-top-right-radius: 8px; flex: none;
  display: grid; place-items: center; background: var(--drawer-hi); font-weight: 700; font-size: 16px; letter-spacing: .02em;
}
.who b { display: block; font-size: 16px; line-height: 21px; font-weight: 700; }
.who div span { display: block; font-size: 13px; line-height: 18px; color: var(--drawer-ink-2); }
.dnav { position: relative; padding-right: 16px; border-top: 1px solid var(--drawer-line); padding-top: 6px; }
.dgroup { margin: 0; padding: 14px 24px 6px; font-size: 13px; line-height: 16px; font-weight: 600; color: var(--drawer-ink-2); }
.dhl {
  position: absolute; left: 0; right: 16px; top: 0; height: 48px; z-index: 0;
  background: var(--drawer-hi); border-radius: 0 6px 24px 0;
  transition: transform 220ms var(--ease);
}
.ditem {
  position: relative; z-index: 1; display: flex; align-items: center; gap: 16px; width: 100%; height: 48px;
  padding: 0 16px 0 24px; border: 0; background: none; color: inherit; cursor: pointer; text-align: left;
  font-size: 15px; font-weight: 500; border-radius: 0 6px 24px 0;
}
.ditem .ms { color: var(--drawer-ink-2); }
.ditem:hover { background: rgba(255,255,255,.06); }
.ditem[aria-current="page"] { font-weight: 700; }
.ditem[aria-current="page"] .ms { color: var(--drawer-ink); font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.dfoot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--drawer-line); }
.dver { padding: 4px 24px 8px; font-size: 12px; color: var(--drawer-ink-2); }

/* ------------------------------------------------------------ atalhos circulares */
.shortcuts { display: flex; gap: 2px; overflow-x: auto; margin: 0 -20px 4px; padding: 0 13px 4px; scrollbar-width: none; scroll-padding-inline: 13px; }
.shortcuts::-webkit-scrollbar { display: none; }
.sc {
  flex: none; width: 70px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 0 0 4px; border: 0; background: none; color: var(--ink); cursor: pointer; text-align: center;
  font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap;
}
.sc-c {
  width: 56px; height: 56px; border-radius: 28px; display: grid; place-items: center;
  background: var(--surface); color: var(--brand-ink); transition: background-color 150ms, transform 150ms var(--ease);
}
.sc:hover .sc-c { background: var(--surface-3); }
.sc:active .sc-c { transform: scale(.94); }

/* ------------------------------------------------------------ seções */
.sec { padding: 24px 0; border-top: 1px solid var(--line); }
.sec.first, .sec:first-child { border-top: 0; padding-top: 0; }
.sec:last-child { padding-bottom: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; margin-bottom: 12px; }
.sec-h h2, .h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: -.01em; }
.sec-h p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; line-height: 18px; }
.h1 { margin: 0; font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
.sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; line-height: 20px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; line-height: 18px; }
.txtbtn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 12px; margin-right: -12px;
  border: 0; border-radius: 24px; background: transparent; color: var(--accent); cursor: pointer;
  font-size: 14px; font-weight: 700; white-space: nowrap;
}
.txtbtn:hover { background: var(--accent-soft); }
.txtbtn.left { margin-right: 0; margin-left: -12px; }

/* ------------------------------------------------------------ notas */
.gt-head, .gr { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 52px); gap: 4px; align-items: center; }
.gt-head { padding-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.gt-head span { text-align: center; }
.gt-head span:first-child { text-align: left; }
.gr { padding: 12px 0; border-top: 1px solid var(--line); }
.gr b { display: block; font-size: 15px; line-height: 20px; font-weight: 600; }
.gr small { display: block; font-size: 12px; line-height: 16px; color: var(--ink-2); margin-top: 2px; }
.gc {
  height: 34px; border-radius: 10px; border-top-right-radius: 3px; display: flex; align-items: center; justify-content: center; gap: 2px;
  font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
.gc .ms { font-size: 15px; }
.gc.nil { color: var(--ink-2); font-weight: 500; }
.gc.masked { background: var(--surface); }
.gc.masked i { width: 26px; height: 8px; border-radius: 4px; background: var(--line-strong); display: block; }
.h-GOOD { background: var(--good); color: var(--good-ink); }
.h-BAD { background: var(--bad); color: var(--bad-ink); }
.h-CRITICAL { background: var(--crit); color: var(--crit-ink); }
.h-NONE { background: var(--none); color: var(--none-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 12px; line-height: 16px; color: var(--ink-2); font-weight: 500; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; font-style: normal; }
.legend .ms { font-size: 13px; }

/* ------------------------------------------------------------ semana */
.days { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.day {
  height: 66px; border-radius: 18px; border-top-right-radius: 6px; border: 0; background: var(--surface); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 0;
  transition: background-color 150ms, color 150ms;
}
.day:hover { background: var(--surface-3); }
.day .dn { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-2); }
.day .dd { font-size: 18px; line-height: 22px; font-weight: 800; }
.day .dots { display: flex; gap: 3px; height: 5px; margin-top: 2px; }
.day .dots i { width: 5px; height: 5px; border-radius: 3px; background: currentColor; opacity: .55; }
.day.today .dn { color: var(--accent); font-weight: 700; }
.day[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.day[aria-pressed="true"] .dn { color: inherit; opacity: .85; }
.daylist { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.daylist.enter { animation: dayIn 200ms var(--ease); }
@keyframes dayIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
.cls {
  display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%;
  padding: 14px 6px 14px 16px; border: 0; cursor: pointer; text-align: left; color: var(--ink);
  border-radius: 20px; border-top-right-radius: 6px; background: var(--shift-bg);
}
.cls-time b { display: block; font-size: 17px; line-height: 22px; font-weight: 800; letter-spacing: -.01em; }
.cls-time > span { display: block; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--shift-ink); }
.cls-main b { display: block; font-size: 15px; line-height: 20px; font-weight: 700; }
.cls-main > span { display: block; font-size: 13px; line-height: 18px; color: var(--shift-ink); font-weight: 500; margin-top: 2px; }
.cls .ms.chev { color: var(--shift-ink); }
.cls-main > .cls-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; }
.shift-tag { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.shift-tag .ms { font-size: 16px; }
.next-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--btn); color: var(--btn-ink); font-size: 12px; font-weight: 700; }
.s-MORNING { --shift-bg: var(--morning); --shift-ink: var(--morning-ink); }
.s-AFTERNOON { --shift-bg: var(--afternoon); --shift-ink: var(--afternoon-ink); }
.s-NIGHT { --shift-bg: var(--night); --shift-ink: var(--night-ink); }

/* ------------------------------------------------------------ listas com divisores */
.list { list-style: none; margin: 0; padding: 0; }
.row {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 0;
  border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; text-align: left; cursor: pointer;
  text-decoration: none;
}
.list > li:last-child > .row, .list > .row:last-child { border-bottom: 0; }
.row:hover .rt b { color: var(--accent); }
.row.static { cursor: default; }
.row.static:hover .rt b { color: inherit; }
.ri { width: 44px; height: 44px; border-radius: 22px; flex: none; display: grid; place-items: center; background: var(--surface); color: var(--brand-ink); }
.rt { flex: 1; min-width: 0; }
.rt b { display: block; font-size: 15px; line-height: 20px; font-weight: 600; transition: color 150ms; }
.rt > span { display: block; font-size: 13px; line-height: 18px; color: var(--ink-2); margin-top: 2px; }
.rt .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.rr { flex: none; text-align: right; display: flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 13px; }
.rr .big { display: block; font-size: 18px; line-height: 22px; font-weight: 800; color: var(--ink); }
.chev { color: var(--ink-2); }
.tag {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 12px; border-top-right-radius: 4px;
  font-size: 12px; font-weight: 700; line-height: 1; white-space: nowrap; background: var(--surface); color: var(--ink-2);
}
.tag .ms { font-size: 15px; }
.tag.accent { background: var(--accent-soft); color: var(--accent-soft-ink); }
.card { background: var(--surface); border-radius: 20px; border-top-right-radius: 6px; padding: 16px; }
.card + .card { margin-top: 12px; }

/* ------------------------------------------------------------ botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px;
  border-radius: 26px; border: 0; cursor: pointer; font-size: 16px; font-weight: 700; letter-spacing: .005em;
  background: var(--btn); color: var(--btn-ink); transition: background-color 150ms, transform 150ms var(--ease); white-space: nowrap;
  text-decoration: none;
}
.btn:hover { background: var(--btn-hover); }
.btn:active { transform: scale(.98); }
.btn.tonal { background: var(--accent-soft); color: var(--accent-soft-ink); }
.btn.tonal:hover { background: color-mix(in srgb, var(--accent-soft) 80%, var(--accent)); }
.btn.outline { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.btn.outline:hover { background: var(--surface); }
.btn.block { width: 100%; }
.btn.sm { min-height: 48px; padding: 0 20px; font-size: 14px; border-radius: 24px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .42; cursor: not-allowed; transform: none; }
/* ocupado não é desabilitado: mantém a cor plena e o contraste do texto enquanto o pedido roda */
.btn.loading, .btn.loading[aria-disabled="true"], .btn.loading:hover { opacity: 1; background: var(--btn); color: var(--btn-ink); cursor: progress; transform: none; }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: spin 800ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ------------------------------------------------------------ chips e seletores */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 4px 20px; scrollbar-width: none; scroll-padding-inline: 20px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 20px;
  border: 1.5px solid var(--line-strong); background: var(--bg); color: var(--ink); font-size: 14px; font-weight: 600;
  cursor: pointer; white-space: nowrap; transition: background-color 150ms, border-color 150ms, color 150ms;
}
.chip:hover { background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
.chip .ms { font-size: 18px; }
/* área de toque de 48px em controles visualmente mais baixos */
.chip, .seg button, .st, .notice button { position: relative; }
.chip::before, .seg button::before, .st::before, .notice button::before { content: ""; position: absolute; inset: -4px 0; }
.chip::before { inset: -5.5px -1.5px; } /* o chip tem borda de 1,5px: estende a partir da borda, não do preenchimento */
.pchip::before { display: none; }
/* trilho rolado: o item cortado à esquerda some em vez de bater na curva do painel */
.chips.fl, .steps.fl, .shortcuts.fl {
  -webkit-mask-image: linear-gradient(90deg, transparent 12px, #000 20px); mask-image: linear-gradient(90deg, transparent 12px, #000 20px);
}
/* ainda há itens à direita: o último visível esmaece nos 24px da borda em vez de ser cortado seco */
.chips.fr, .steps.fr, .shortcuts.fr {
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent calc(100% - 4px)); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent calc(100% - 4px));
}
.chips.fl.fr, .steps.fl.fr, .shortcuts.fl.fr {
  -webkit-mask-image: linear-gradient(90deg, transparent 12px, #000 20px, #000 calc(100% - 28px), transparent calc(100% - 4px));
  mask-image: linear-gradient(90deg, transparent 12px, #000 20px, #000 calc(100% - 28px), transparent calc(100% - 4px));
}
.pchip { height: 58px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; border-radius: 18px; border-top-right-radius: 6px; padding: 0 16px; }
.pchip b { font-size: 15px; line-height: 20px; font-weight: 800; }
.pchip span { font-size: 12px; line-height: 16px; font-weight: 500; opacity: .8; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: 24px; background: var(--surface); }
.seg button { height: 40px; border: 0; border-radius: 20px; background: transparent; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(15,27,45,.10), 0 2px 8px -2px rgba(15,27,45,.12); }
[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--surface-3); box-shadow: none; }
.dd { position: relative; }
.dd-btn {
  width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 16px; text-align: left; cursor: pointer;
  border: 0; border-radius: 16px; border-top-right-radius: 4px; background: var(--surface); color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--field-line);
}
.dd-btn[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--accent); }
.dd-btn small { display: block; font-size: 12px; line-height: 16px; color: var(--ink-2); font-weight: 600; }
.dd-btn b { display: block; font-size: 15px; line-height: 20px; font-weight: 600; }
.dd-btn .grow { flex: 1; min-width: 0; }
.dd-menu {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 10; max-height: 300px; overflow-y: auto; padding: 6px 0;
  background: var(--bg); border-radius: 16px; border-top-right-radius: 4px;
  box-shadow: 0 1px 3px rgba(8,14,24,.12), 0 12px 32px -8px rgba(8,14,24,.28);
  animation: ddIn 160ms var(--ease);
}
[data-theme="dark"] .dd-menu { background: var(--surface-3); }
@keyframes ddIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.dd-menu button {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 16px; border: 0; background: none;
  cursor: pointer; text-align: left; font-size: 15px; color: var(--ink);
}
.dd-menu button:hover { background: var(--surface); }
.dd-menu button[aria-selected="true"] { font-weight: 700; color: var(--accent); }

/* ------------------------------------------------------------ campos */
.flabel { display: block; margin: 0 0 8px 4px; font-size: 14px; font-weight: 600; }
.field {
  display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 4px 0 16px;
  border-radius: 16px; border-top-right-radius: 4px; background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--field-line); transition: box-shadow 150ms;
}
.field > .ms { color: var(--ink-2); }
.field:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.field.err { box-shadow: inset 0 0 0 2px var(--crit-line); }
.field input, .field textarea {
  flex: 1; min-width: 0; height: 54px; border: 0; background: transparent; outline: none; padding: 0;
  font-size: 16px; font-weight: 500; color: var(--ink); caret-color: var(--accent);
}
.field textarea { height: 132px; padding: 14px 0; resize: none; line-height: 22px; }
.field.area { align-items: flex-start; padding-right: 16px; }
.field input::placeholder, .field textarea::placeholder { color: var(--ink-2); opacity: 1; }
.field .iconbtn { color: var(--ink-2); }
.ferr { display: flex; gap: 8px; align-items: center; margin: 10px 4px 0; color: var(--crit-line); font-size: 14px; font-weight: 600; }
[data-theme="light"] .ferr { color: #B3202C; }
.stepper { display: flex; align-items: center; gap: 4px; flex: none; }
.stepper input {
  width: 52px; height: 48px; text-align: center; border: 0; border-radius: 12px; background: var(--bg); color: var(--ink);
  font-size: 22px; font-weight: 800; outline: none; caret-color: var(--accent); -moz-appearance: textfield;
}
.stepper input:focus { box-shadow: inset 0 0 0 2px var(--accent); }
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.stepper .iconbtn { background: var(--bg); color: var(--ink); }
[data-theme="dark"] .stepper input, [data-theme="dark"] .stepper .iconbtn { background: var(--surface-3); }
.qrow { display: flex; align-items: center; gap: 12px; }
.qrow p { flex: 1; margin: 0; font-size: 15px; line-height: 21px; font-weight: 600; }

/* interruptor e caixa de seleção (Material 3) */
.sw {
  appearance: none; -webkit-appearance: none; position: relative; flex: none; margin: 0; cursor: pointer;
  width: 52px; height: 32px; border-radius: 16px; background: var(--surface-3); box-shadow: inset 0 0 0 2px var(--outline);
  transition: background-color 150ms, box-shadow 150ms;
}
.sw::after {
  content: ""; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--outline);
  transition: all 180ms var(--ease);
}
.sw:checked { background: var(--btn); box-shadow: none; }
.sw:checked::after { top: 4px; left: 24px; width: 24px; height: 24px; background: var(--btn-ink); }
.ck {
  appearance: none; -webkit-appearance: none; flex: none; margin: 0; width: 24px; height: 24px; border-radius: 7px; border-top-right-radius: 2px;
  box-shadow: inset 0 0 0 2px var(--outline); cursor: pointer; display: grid; place-items: center; transition: background-color 150ms;
}
.ck:checked { background: var(--btn); box-shadow: none; }
.ck:checked::after {
  content: ""; width: 12px; height: 7px; border-left: 2.5px solid var(--btn-ink); border-bottom: 2.5px solid var(--btn-ink);
  transform: translateY(-2px) rotate(-45deg);
}
.rd { appearance: none; -webkit-appearance: none; flex: none; margin: 0; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--outline); cursor: pointer; }
.rd:checked { box-shadow: inset 0 0 0 2px var(--btn), inset 0 0 0 6px var(--bg), inset 0 0 0 12px var(--btn); }
label.row { cursor: pointer; }

/* ------------------------------------------------------------ avisos, vazio, esqueleto */
.notice {
  display: flex; align-items: flex-start; gap: 12px; padding: 12px 8px 12px 14px; margin-bottom: 20px;
  border-radius: 16px; border-top-right-radius: 4px; font-size: 13px; line-height: 18px; font-weight: 500;
}
.notice > .ms { font-size: 20px; margin-top: 0; }
.notice .nb { flex: 1; padding-top: 1px; }
.notice .nb b { display: block; font-weight: 700; font-size: 14px; line-height: 19px; }
.notice button { align-self: center; min-height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; color: inherit; font-weight: 700; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.notice button:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
.n-offline { background: var(--none); color: var(--none-ink); }
.n-updating { background: var(--accent-soft); color: var(--accent-soft-ink); }
.n-failed { background: var(--bad); color: var(--bad-ink); }
.n-blocked { background: var(--crit); color: var(--crit-ink); }
.n-info { background: var(--surface); color: var(--ink-2); }
.n-updating > .ms { animation: spin 1200ms linear infinite; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 36px 16px; }
.empty .ei { width: 72px; height: 72px; border-radius: 36px; display: grid; place-items: center; background: var(--surface); color: var(--ink-2); }
.empty .ei.crit { background: var(--crit); color: var(--crit-ink); }
.empty p { margin: 0; max-width: 32ch; color: var(--ink-2); font-size: 15px; line-height: 22px; font-weight: 500; }
.empty.btnlike { width: 100%; border: 0; background: none; cursor: pointer; color: inherit; border-radius: 20px; }
.empty.btnlike:hover { background: var(--surface); }
.persist { margin-top: 8px; }
.persist h3 { margin: 0 0 10px; font-size: 16px; font-weight: 700; }
.persist ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 22px; }
.persist p { margin: 12px 0 0; font-size: 13px; line-height: 19px; color: var(--ink-2); }
.sk { background: var(--skel); border-radius: 8px; position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--skel-hi), transparent); transform: translateX(-100%); animation: shimmer 1.3s ease-in-out infinite; }
.hero .sk { background: rgba(255,255,255,.12); }
.hero .sk::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent); }
@keyframes shimmer { to { transform: translateX(100%); } }
.bar { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.bar i { display: block; width: 100%; height: 100%; border-radius: 4px; background: var(--accent); transform-origin: left center; transform: scaleX(var(--v, 0)); transition: transform 300ms var(--ease); }
.bar.indet i { width: 40%; transform: none; animation: indet 1.2s var(--ease) infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.bar.g-GOOD i { background: var(--good-line); } .bar.g-BAD i { background: var(--bad-line); } .bar.g-CRITICAL i { background: var(--crit-line); }

/* ------------------------------------------------------------ folha inferior e snackbar */
.sheet-layer { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.sheet-layer .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 220ms var(--ease); border: 0; padding: 0; width: 100%; cursor: pointer; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 90%; display: flex; flex-direction: column;
  background: var(--bg); border-radius: 32px 8px 0 0; transform: translateY(105%); transition: transform 260ms var(--ease);
  box-shadow: 0 -8px 32px rgba(8,14,24,.18);
}
[data-theme="dark"] .sheet { background: var(--surface); }
.sheet-layer.open { pointer-events: auto; }
.sheet-layer.open .scrim { opacity: 1; }
.sheet-layer.open .sheet { transform: none; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 10px auto 2px; flex: none; }
.sheet-h { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 4px 24px; }
.sheet-h h2 { flex: 1; margin: 0; font-size: 20px; line-height: 26px; font-weight: 800; letter-spacing: -.015em; }
.sheet-b { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 24px 8px; scrollbar-width: thin; }
.sheet-f { flex: none; display: flex; gap: 12px; padding: 12px 24px 20px; }
.sheet-f .btn { flex: 1; }
.snack {
  position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 30; display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 14px; border-top-right-radius: 4px; background: var(--snack); color: var(--snack-ink);
  box-shadow: 0 2px 4px rgba(8,14,24,.12), 0 12px 28px -8px rgba(8,14,24,.36);
  opacity: 0; transform: translateY(16px); transition: opacity 200ms var(--ease), transform 200ms var(--ease); pointer-events: none;
}
.snack.show { opacity: 1; transform: none; }
.snack.lift { bottom: 92px; }
.snack b { display: block; font-size: 14px; line-height: 19px; font-weight: 700; }
.snack div span { display: block; font-size: 13px; line-height: 18px; color: var(--snack-2); }
.snack .ms { color: var(--snack-2); }

/* ------------------------------------------------------------ progresso */
.duo { display: grid; grid-template-columns: 1fr 1fr; }
.duo > div + div { border-left: 1px solid var(--line-strong); padding-left: 18px; }
.duo b { display: block; font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -.025em; }
.duo span { display: block; font-size: 14px; line-height: 19px; color: var(--ink-2); font-weight: 600; }
.foot { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line-strong); font-size: 13px; line-height: 18px; color: var(--ink-2); }
.foot .ms { font-size: 18px; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: 'Figtree', sans-serif; font-variant-numeric: tabular-nums; }
.chart-legend { display: flex; gap: 18px; margin-top: 10px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { display: block; }
.ptype { padding: 16px 0; border-top: 1px solid var(--line); }
.ptype:first-of-type { border-top: 0; padding-top: 4px; }
.ptype-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.ptype-h b { font-size: 16px; font-weight: 700; }
.ptype-h span { font-size: 15px; font-weight: 700; }
.ptype-h span small { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.ptype p { margin: 8px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-2); }
.ptype .hint { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 4px; padding: 10px 6px 10px 14px; border-radius: 14px; border-top-right-radius: 4px; background: var(--surface); font-size: 13px; line-height: 18px; color: var(--ink-2); }

/* ------------------------------------------------------------ gerador */
.steps { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 22px 20px 14px; scrollbar-width: none; scroll-behavior: smooth; scroll-padding-inline: 20px; }
.steps::-webkit-scrollbar { display: none; }
.st {
  flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 6px; border: 0; border-radius: 20px;
  background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.st i { width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 13px; background: var(--bg); color: var(--ink); }
[data-theme="dark"] .st i { background: var(--surface-3); }
.st.done i { background: var(--good); color: var(--good-ink); }
.st.done i .ms { font-size: 17px; }
.st[aria-current="step"] { background: var(--btn); color: var(--btn-ink); font-weight: 700; }
.st[aria-current="step"] i { background: rgba(255,255,255,.22); color: inherit; }
[data-theme="dark"] .st[aria-current="step"] i { background: rgba(3,34,58,.18); }
.st:disabled { cursor: default; }
.stepline { flex: none; height: 3px; margin: 0 20px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.stepline i { display: block; width: 100%; height: 100%; background: var(--accent); border-radius: 2px; transform-origin: left center; transform: scaleX(var(--v, 0)); transition: transform 250ms var(--ease); }
.bbar { flex: none; display: flex; gap: 12px; padding: 12px 20px 14px; background: var(--bg); border-top: 1px solid var(--line); }
.bbar .btn { flex: 1; }
.bgrid { display: grid; grid-template-columns: 54px repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 16px; user-select: none; }
.bh { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-2); padding-bottom: 2px; }
.bs { display: flex; flex-direction: column; justify-content: center; font-size: 12px; line-height: 13px; color: var(--ink-2); }
.bs b { color: var(--ink); font-size: 12px; }
.bc {
  position: relative; height: 42px; border: 0; padding: 0; border-radius: 10px; border-top-right-radius: 3px; cursor: pointer;
  background: var(--bg); box-shadow: inset 0 0 0 1px var(--outline);
  display: grid; place-items: center; color: var(--busy-ink); transition: background-color 120ms;
}
.bc::before { content: ""; position: absolute; inset: -3px; }
.bc:hover { background: var(--surface); }
.bc[aria-pressed="true"] { background: var(--busy); box-shadow: none; }
.bc .ms { font-size: 16px; }
.gtop { margin-top: 10px; }
.blegend { display: flex; gap: 16px; margin-top: 14px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.blegend span { display: inline-flex; align-items: center; gap: 8px; }
.blegend i { width: 22px; height: 22px; border-radius: 6px; border-top-right-radius: 2px; display: grid; place-items: center; font-style: normal; }

<body>
<!--
  AO UERJ · Variante 2 · Banco digital

  Inspiração: apps de banco que o aluno abre todo dia (Nubank, Banco Inter, C6). No Início, o cabeçalho
  azul fica mais alto e funciona como a "área do saldo": saudação, próxima aula em destaque e o CR
  aproximado, com um botão de olho que oculta notas e CR (como ocultar o saldo). Logo abaixo, uma
  fileira rolável de atalhos circulares (Gerador, Mural, Currículo, Pesquisar, Progresso...), seções
  separadas por divisores finos, linhas com chevron, cards só onde agrupam e botões em pílula grandes.

  Paleta: cabeçalho/menu #003468 (PRIMARY atual), destaque do menu #004891 (SECONDARY atual), acento
  #016BA5 (TERTIARY atual) em links e progresso; superfícies #FFFFFF e #F3F5F9; texto #0F1B2D / #5A6475.
  Escuro: cabeçalho #0A2245 (azul UERJ mais profundo, ainda azul), fundo #0D1117, superfícies #161C26, acento #5BB2E8.
  Pastéis de significado do app atual (aprovado verde, reprovado vermelho, cancelado cinza; Manhã
  amarelo, Tarde pêssego, Noite azul-claro; saúde da nota e das vagas), com versões escuras legíveis.

  Tipo: Figtree (400/500/600/700/800), números tabulares e firmes. Ícones: Material Symbols Outlined 400.

  Preservado do atual: azul UERJ atrás de tudo (barra de status, cabeçalho e menu lateral); painel claro
  com o canto superior esquerdo de 48px; cards, campos e chips com o canto superior direito quase reto;
  cabeçalho com menu à esquerda, título centralizado (no Início, o período 2026.2) e logo AO à direita
  abrindo "Sobre"; menu lateral azul atrás do conteúdo (drawerType 'back'), com destaque que desliza até a
  rota ativa e "Sair" no rodapé; Login com topo azul e logo grande; rotas, títulos e textos reais do app.
-->
<div class="stage" id="stage">

          <svg width="11" height="18" viewBox="0 0 11 18"><path d="M3.5 1h4v1.5H10V17H1V2.5h2.5z"/></svg>

        <div class="sheet-layer" id="sheetLayer">

          <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
        </div>
        <div class="snack" id="snack" role="status" aria-live="polite"></div>

<script>

var NAV = [
  { group: 'Acadêmico', items: [
    ['home', 'Início', 'home'],
    ['progress', 'Meu Progresso', 'insights'],
    ['realizadas', 'Disciplinas Realizadas', 'task_alt'],
    ['curriculo', 'Disciplinas do Currículo', 'account_tree'],
    ['universais', 'Disciplinas Universais', 'public'],
    ['pesquisa', 'Pesquisa de Disciplinas', 'search'],

  { group: 'Ferramentas', items: [

    ['board', 'Mural de Mensagens', 'forum'],
  ] },
  { group: null, items: [['about', 'Sobre', 'info']] },
];
var SHORTCUTS = [
  ['generator', 'Gerador', 'edit_calendar'],
  ['board', 'Mural', 'forum'],
  ['curriculo', 'Currículo', 'account_tree'],
  ['pesquisa', 'Pesquisar', 'search'],
  ['progress', 'Progresso', 'insights'],
  ['realizadas', 'Realizadas', 'task_alt'],
  ['universais', 'Universais', 'public'],
];

var activeIds = {};
D.enrolled.forEach(function (s) { if (s.status === 'ACTIVE') activeIds[s.id] = true; });
var currentCraPeriod = D.periodList.filter(function (p) { return p.isCurrentCra; })[0];

var S = {
  route: 'home', p: new URLSearchParams(), theme: 'light', embed: false, capture: false,

  gen: {

    busy: {}, prio: {}, preset: 0, type: 'MANDATORY', q: '', sel: {},

/* ================================================================ roteamento por hash */
function parseHash() {
  var h = location.hash.replace(/^#\/?/, '');
  var qi = h.indexOf('?');

}
function hrefFor(r) {
  var qi = r.indexOf('?');

  var p = new URLSearchParams(qi < 0 ? '' : r.slice(qi + 1));
  p.set('theme', S.theme);

  if (S.capture) p.set('capture', '1');
  return '#/' + route + '?' + p.toString();
}
function nav(r) {

}
function applyHash() {
  var ph = parseHash(), p = ph.params, route = ROUTES[ph.route] ? ph.route : 'home';
  S.route = route; S.p = p; S.dd = null;
  S.theme = p.get('theme') === 'dark' ? 'dark' : 'light';
  if (p.get('embed') === '1') S.embed = true;
  if (p.get('capture') === '1') S.capture = true;
  S.state = p.get('state');
  S.drawer = p.get('drawer') === '1';
  if (p.has('hide')) S.hide = p.get('hide') === '1';
  if (route === 'home') { S.day = D.now.weekday; }
  if (route === 'generator') {
    var st = parseInt(p.get('step'), 10);
    S.gen.step = st >= 1 && st <= 7 ? st : 1;
    S.gen.phase = S.state === 'empty' ? 'empty' : S.state === 'generating' ? 'generating' : S.state === 'idle' ? 'idle' : 'done';
    S.gen.fetched = D.generator.fetchResults.length;
  }
  if (route === 'login') {
    S.login = S.state === 'error'
      ? { mat: D.student.matricula, pass: 'senhadoaluno', show: false, loading: false, err: D.copy.loginWrong }
      : S.state === 'loading'
        ? { mat: D.student.matricula, pass: 'senhadoaluno', show: false, loading: true, err: '' }
        : { mat: '', pass: '', show: false, loading: false, err: '' };
  }
  if (route === 'progress') S.unconfigured = S.state === 'unconfigured';
  if (route === 'subject') { S.subj.id = p.get('id') || 'IME02-10892'; S.subj.from = p.get('from') || 'pesquisa'; }
  if (route === 'board-chat') S.board.subject = p.get('id') || 'IME02-10892';
  if (route === 'realizadas' && p.get('period')) S.real.period = p.get('period');
  if (route === 'pesquisa' && S.state === 'empty') S.pes.hist = [];
  if (route === 'universais') S.uni = S.state === 'empty' ? { dept: 'Instituto de Artes', q: 'Libras' } : { dept: '', q: '' };
  layout();

}

function edgeFade(el) {
  if (!el) return;

}
function fadeRails() { $$('#screen .chips, #screen .steps, #screen .shortcuts').forEach(edgeFade); }
function scrollRailTo(rail, item) {
  /* Leva o item ativo à margem de 20px do conteúdo. No fim do trilho a rolagem para no máximo,
     que deixa o último item na margem direita de 20px; o item cortado à esquerda some no
     esmaecimento da borda (.fl). */
  if (!rail || !item) return;
  var max = rail.scrollWidth - rail.clientWidth;
  var s = Math.min(item.offsetLeft - rail.offsetLeft - 20, max);
  rail.style.scrollBehavior = 'auto';

}

/* ================================================================ Meu Progresso */
function craChart() {
  var pts = D.craPoints, W = 372, H = 204, L = 30, R = 2, T = 14, B = 28, PAD = 22;
  var vals = [];
  pts.forEach(function (p) { vals.push(p.cra, p.periodAverage); });
  /* eixo em notas inteiras (5,0 · 6,0 · 7,0 · 8,0 · 9,0): do piso do menor valor ao teto do maior */
  var lo = Math.floor(Math.min.apply(null, vals)), hi = Math.ceil(Math.max.apply(null, vals));
  if (hi - lo < 2) hi = lo + 2;
  var step = hi - lo > 5 ? 2 : 1;
  function x(i) { return L + PAD + (W - L - R - PAD * 2) * (pts.length === 1 ? 0.5 : i / (pts.length - 1)); }
  function y(v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); }
  var s = '';
  for (var g = lo; g <= hi + 1e-9; g += step) {
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g).toFixed(1) + '" y2="' + y(g).toFixed(1) + '" style="stroke:var(--line);stroke-width:1"/>' +
      '<text x="' + (L - 8) + '" y="' + (y(g) + 4).toFixed(1) + '" text-anchor="end" style="fill:var(--ink-2);font-size:11px;font-weight:600">' + fmt(g) + '</text>';
  }
  /* média de cada período: série secundária, tracejada e mais clara, com pontos pequenos */
  var avg = pts.map(function (p, i) { return x(i).toFixed(1) + ',' + y(p.periodAverage).toFixed(1); }).join(' ');
  s += '<polyline points="' + avg + '" style="fill:none;stroke:var(--chart-bar);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round"/>';
  pts.forEach(function (p, i) {
    s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.periodAverage).toFixed(1) + '" r="3" style="fill:var(--chart-bar)"/>';
  });
  var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.cra).toFixed(1); }).join(' ');
  s += '<path d="' + d + '" style="fill:none;stroke:var(--bg);stroke-width:7;stroke-linejoin:round;stroke-linecap:round"/>' +
    '<path d="' + d + '" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round"/>';
  /* rótulos só no primeiro ponto (acima) e no atual (abaixo, à esquerda, longe da série tracejada);
     o contorno da cor do fundo descola o texto das linhas */
  var halo = 'paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;';
  pts.forEach(function (p, i) {
    var last = i === pts.length - 1, labeled = i === 0 || last;
    s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.cra).toFixed(1) + '" r="' + (last ? 5.5 : 4) + '" style="fill:' + (last ? 'var(--accent)' : 'var(--bg)') + ';stroke:var(--accent);stroke-width:2.5"/>' +
      (labeled ? '<text x="' + (last ? x(i) - 9 : x(i)).toFixed(1) + '" y="' + (y(p.cra) + (last ? 21 : -12)).toFixed(1) + '" text-anchor="' + (last ? 'end' : 'middle') + '" style="' + halo + 'fill:var(--ink);font-size:' + (last ? 13 : 12) + 'px;font-weight:' + (last ? 800 : 700) + '">' + fmt(p.cra, 2) + '</text>' : '') +
      '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" style="fill:var(--ink-2);font-size:11px;font-weight:600">' + p.label + '</text>';
  });
  var aria = 'Evolução do CR aproximado por período: ' + pts.map(function (p) { return p.label + ', CR ' + fmt(p.cra, 2) + ', média do período ' + fmt(p.periodAverage, 2); }).join('; ');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + aria + '">' + s + '</svg>' +
    '<div class="chart-legend"><span><svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><path d="M1 6H21" style="stroke:var(--accent);stroke-width:2.5;stroke-linecap:round"/><circle cx="11" cy="6" r="3.5" style="fill:var(--bg);stroke:var(--accent);stroke-width:2.5"/></svg>CR acumulado (aprox.)</span>' +
    '<span><svg width="22" height="12" viewBox="0 0 22 12" aria-hidden="true"><path d="M0 6H22" style="stroke:var(--chart-bar);stroke-width:2;stroke-dasharray:5 4"/><circle cx="11" cy="6" r="3" style="fill:var(--chart-bar)"/></svg>Média do período</span></div>';
}
function ptype(t, P) {
  var label = TYPE_PLURAL[t];
  if (t === 'MANDATORY') {
    var pct = P.percent[t];
    return '<div class="ptype"><div class="ptype-h"><b>' + label + '</b><span class="num">' + P.completed[t] + ' <small>de ' + P.totals[t] + ' disciplinas</small></span></div>' +
      '<div class="bar" role="progressbar" aria-label="' + label + '" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><i style="--v:' + (pct / 100) + '"></i></div>' +
      '<p>' + plural(P.remaining[t], 'disciplina restante', 'disciplinas restantes') + ' · ' + pct + '%</p></div>';

  var req = P.requiredCredits[t], done = P.completedCredits[t];

}

/* ================================================================ Gerador de Grade */
var STEP_LABELS = ['Qtd. Disciplinas', 'Horários Ocupados', 'Prioridades', 'Selecionar Disciplinas', 'Carregar Dados', 'Turmas', 'Gerar Grade'];
var GSTEPS = {};
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function slotIdx(id) { for (var i = 0; i < D.SLOTS.length; i++) if (D.SLOTS[i].id === id) return i; return -1; }
function isInt(v) { return typeof v === 'number' && isFinite(v) && Math.floor(v) === v; }
function genValid() {
  var g = S.gen;
  var okMin = isInt(g.min) && g.min >= 1 && g.min <= 12;
  var okMax = isInt(g.max) && g.max >= 1 && g.max <= 12;
  return { min: okMin, max: okMax, order: !(okMin && okMax) || g.min <= g.max };
}
function genErrText() {
  var v = genValid();
  if (!v.min || !v.max) return 'Escolha um número entre 1 e 12.';
  if (!v.order) return 'O máximo precisa ser igual ou maior que o mínimo.';
  return '';
}
function countOn(obj) { return Object.keys(obj).filter(function (k) { return obj[k]; }).length; }
function genCanNext() {
  var g = S.gen;
  if (g.step === 1) return !genErrText();
  if (g.step === 4) return countOn(g.sel) > 0;
  if (g.step === 5) return g.fetched >= D.generator.fetchResults.length;
  if (g.step === 6) return countOn(g.csel) > 0;
  return true;
}
function groupFull(key) {
  return D.WEEKDAYS.every(function (w) {
    return D.SLOTS.every(function (s) { return s.id[0] !== key || S.gen.busy[w.n + '-' + s.id]; });
  });
}
function presetActive(p) {
  var on = Object.keys(S.gen.prio).filter(function (k) { return S.gen.prio[k]; });
  return on.length === p.keys.length && p.keys.every(function (k) { return S.gen.prio[k]; });
}

VIEWS.generator = function () {
  var g = S.gen, step = g.step;
  var top = '<nav class="steps" id="steps" aria-label="Passos do gerador">' + STEP_LABELS.map(function (l, i) {
    var n = i + 1, done = n < step, cur = n === step;
    return '<button class="st' + (done ? ' done' : '') + '" type="button" data-a="gstep" data-v="' + n + '"' + (cur ? ' aria-current="step"' : '') + (n > step ? ' disabled' : '') + '>' +
      '<i>' + (done ? ic('check') : n) + '</i>' + l + '</button>';
  }).join('') + '</nav><div class="stepline" role="progressbar" aria-label="Passo ' + step + ' de 7" aria-valuenow="' + step + '" aria-valuemin="1" aria-valuemax="7"><i style="--v:' + (step / 7).toFixed(3) + '"></i></div>';
  var prev = step > 1 ? '<button class="btn outline" type="button" data-a="gprev">' + ic('arrow_back', 's20') + 'Anterior</button>' : '';
  var next = step < 7 ? '<button class="btn" type="button" data-a="gnext" id="gnext"' + (genCanNext() ? '' : ' aria-disabled="true"') + '>Próximo' + ic('arrow_forward', 's20') + '</button>' : '';
  return {
    top: top, body: GSTEPS[step](), bottom: '<div class="bbar">' + prev + next + '</div>',
    after: function () {
      scrollRailTo($('#steps'), $('.st[aria-current]'));
    },
  };
};
function refreshGenNext() {

/* passo 1 */
function qrow(k, q, val, bad) {

    '<input id="in-' + k + '" class="num" type="number" min="1" max="12" inputmode="numeric" data-in="g' + k + '" value="' + (isInt(val) ? val : '') + '" aria-labelledby="q-' + k + '"' + (bad ? ' aria-invalid="true"' : '') + ' aria-describedby="genErr">' +
    '<button class="iconbtn" type="button" data-a="gnum" data-v="' + k + ':1" aria-label="Aumentar">' + ic('add') + '</button></div></div>';

function genInfo(res) {
  return '<div class="card"><div class="duo"><div><b class="num">' + res.credits + '</b><span>Créditos</span></div><div><b class="num">' + res.workload + ' h</b><span>Carga horária</span></div></div></div>' +

    }).join('') + '</ul>';
}
function genTable(res) {
  var used = {}, minI = 99, maxI = -1, sat = false;
  res.items.forEach(function (it, i) {
    it.meetings.forEach(function (m) {
      if (m.day === 6) sat = true;
      for (var k = slotIdx(m.from); k <= slotIdx(m.to); k++) { used[m.day + '-' + k] = i; minI = Math.min(minI, k); maxI = Math.max(maxI, k); }
    });
  });
  var days = D.WEEKDAYS.filter(function (w) { return sat || w.n < 6; });
  var t = '<div class="tt" style="grid-template-columns:40px repeat(' + days.length + ',minmax(0,1fr))" role="img" aria-label="Quadro de horários da grade ' + (S.gen.grade + 1) + '"><span></span>' +
    days.map(function (w) { return '<span class="th">' + w.short + '</span>'; }).join('');
  for (var k = minI; k <= maxI; k++) {
    t += '<span class="tl num">' + D.SLOTS[k].id + '</span>';
    days.forEach(function (w) {
      var i = used[w.n + '-' + k];
      t += i == null ? '<span class="tc"></span>' : '<span class="tc on">' + 'ABCDEFG'[i] + '</span>';
    });
  }
  t += '</div>';
  return t + '<ul class="list" style="margin-top:10px">' + res.items.map(function (it, i) {
    return '<li><div class="row static" style="min-height:52px;padding:8px 0"><span class="letter" aria-hidden="true">' + 'ABCDEFG'[i] + '</span><span class="rt"><b>' + esc(it.name) + '</b><span>Turma ' + it['class'] + '</span></span></div></li>';
  }).join('') + '</ul>';
}

A.gclear = function () { S.gen.busy = {}; refreshBusy(); };
A['gprio-preset'] = function (i) {
  S.gen.prio = {};
  D.generator.priorityPresets[+i].keys.forEach(function (k) { S.gen.prio[k] = true; });
  render();
};
A.gtype = function (v) { S.gen.type = v; render(); };
A.ggen = function () {
  S.gen.phase = 'generating'; render();
  setTimeout(function () { S.gen.phase = 'done'; S.gen.grade = 0; S.gen.tab = 'INFO'; render(); }, 1300);
};
A['ggen-other'] = function () {
  var next = (S.gen.grade + 1) % D.generator.results.length;
  S.gen.phase = 'generating'; render();
  setTimeout(function () { S.gen.phase = 'done'; S.gen.grade = next; render(); }, 1000);
};
A.ggrade = function (v) { S.gen.grade = +v; render(); };
A.gtab = function (v) { S.gen.tab = v; render(); };
/* menus suspensos */
A.dd = function (v) { S.dd = S.dd === v ? null : v; render(); };
A.ddpick = function (v, t) {
  var id = t.dataset.dd;
  if (id === 'teacher') S.gen.teacher = v;
  if (id === 'period') S.board.period = v;
  if (id === 'dept') S.uni.dept = v;
  S.dd = null; render();
  var b = $('.dd-btn[data-v="' + id + '"]'); if (b) b.focus({ preventScroll: true });
};
/* mural */
A.copy = function (v) {
  var m = chatMsgs()[+v];
  if (!m) return;
  try { if (navigator.clipboard) navigator.clipboard.writeText(m.text).catch(function () {}); } catch (e) { /* file:// */ }
  snack(D.copy.copied, D.copy.copiedDetail, 'content_copy');
};
function sendMsg() {
  var b = S.board, text = b.draft.trim();
  if (!text) return;
  (b.msgs[b.subject] = b.msgs[b.subject] || []).push({ author: D.student.name.split(' ').slice(0, 2).join(' '), at: NOW_DATE, time: D.now.time, text: text, mine: true });
  b.draft = '';
  if (b.period !== D.student.period) b.period = D.student.period;
  render();
  var i = $('#draft'); if (i) i.focus({ preventScroll: true });
}
/* listas */
A.rperiod = function (v) {
  S.real.period = v;
  $$('#pchips .chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c.dataset.v === v)); });
  renderPart('rlist', realList());
};
A.ctype = function (v) { S.cur.type = v; render(); };
A.ctaken = function (v) { S.cur.taken = v === '1'; render(); };
A.uclear = function () { S.uni = { dept: '', q: '' }; render(); };
A.pclear = function () { S.pes.hist = []; render(); };
function doSearch() {
  var q = S.pes.q.trim().toUpperCase().replace(/\s+/g, '');
  var m = q.match(/^([A-Z]{2,6}\d{2}-)?(\d{5})$/);
  if (!m) { snack(D.copy.invalidCode, D.copy.invalidCodeDetail, 'error'); return; }
  var id = q;
  if (!m[1]) {
    var all = D.curriculum.concat(D.universals);
    for (var i = 0; i < all.length; i++) if (all[i].id.split('-').pop() === m[2]) { id = all[i].id; break; }
  }
  var s = findSubject(id);
  if (s) S.pes.hist = [{ id: s.id, name: s.name, credits: s.credits, workload: s.workload }].concat(S.pes.hist.filter(function (h) { return h.id !== s.id; })).slice(0, 8);
  nav('subject?id=' + encodeURIComponent(id) + '&from=pesquisa');
}
/* créditos */
A.cnum = function (v) {
  var p = v.split(':'), k = p[0], d = +p[1];
  var cur = parseInt(S.draft[k], 10) || 0;
  S.draft[k] = Math.max(0, Math.min(99, cur + d));
  var inp = $('#c-' + k); if (inp) inp.value = S.draft[k];
};
A.creset = function () { S.draft = { RESTRICTED: '', DEFINED: '', UNIVERSAL: '' }; renderSheet(); };
A.csave = function () {
  var d = S.draft, cfg = {};
  ['RESTRICTED', 'DEFINED', 'UNIVERSAL'].forEach(function (k) { cfg[k] = parseInt(d[k], 10) || 0; });
  S.unconfigured = !cfg.RESTRICTED && !cfg.DEFINED && !cfg.UNIVERSAL;
  S.credits = cfg;
  closeSheet(); render();
  snack('Créditos salvos', 'O progresso no currículo foi atualizado.', 'check_circle');
};
/* reportar problema */
A.rnext = function (v, t) {
  if (t.getAttribute('aria-disabled') === 'true') return;
  S.report.step = 2; renderSheet();
  var ta = $('#rtext'); if (ta && !S.capture) ta.focus();
};
A.rback = function () { S.report.step = 1; renderSheet(); };
A.rsend = function (v, t) {
  if (t.getAttribute('aria-disabled') === 'true') return;
  closeSheet(); snack('Relato enviado. Obrigado!', '', 'check_circle');
};
/* login */
function doLogin() {
  var L = S.login;
  if (L.loading) return;
  if (!L.mat.trim() || !L.pass) { L.err = D.copy.loginEmpty; render(); return; }
  L.err = ''; L.loading = true; render();
  setTimeout(function () { L.loading = false; nav('home'); }, 1200);
}

/* ================================================================ entradas */
function clearBtn(id, val) { var b = $('[data-a="clear"][data-v="' + id + '"]'); if (b) b.hidden = !val; }
function clearLoginErr() {
  if (!S.login.err) return;
  S.login.err = '';
  renderPart('loginErr', '');
  $$('.login .field').forEach(function (f) { f.classList.remove('err'); });
  $$('.login input').forEach(function (i) { i.setAttribute('aria-invalid', 'false'); });
}
function onInput(key, val, el) {
  switch (key) {
    case 'mat':
      S.login.mat = val.replace(/\D/g, '').slice(0, 12);
      if (el && el.value !== S.login.mat) el.value = S.login.mat;
      clearBtn('mat', S.login.mat); clearLoginErr(); break;
    case 'pass': S.login.pass = val; clearLoginErr(); break;
    case 'gmin': case 'gmax':
      S.gen[key.slice(1)] = val === '' ? '' : Number(val); refreshGenErr(); break;
    case 'gq': S.gen.q = val; renderPart('gsubj', genSubjList()); clearBtn('gq', val); break;
    case 'cq': S.cur.q = val; renderPart('clist', curList()); clearBtn('cq', val); break;
    case 'uq': S.uni.q = val; renderPart('ulist', uniList()); clearBtn('uq', val); break;
    case 'pq': S.pes.q = val; clearBtn('pq', val); break;
    case 'draft':
      S.board.draft = val;
      var sb = $('#composer button[type="submit"]'); if (sb) sb.disabled = !val.trim(); break;
    case 'rcode': S.report.code = val; break;
    case 'rtext':
      S.report.text = val;
      var rs = $('#rsend'); if (rs) { if (val.trim()) rs.removeAttribute('aria-disabled'); else rs.setAttribute('aria-disabled', 'true'); } break;
    case 'cRESTRICTED': case 'cDEFINED': case 'cUNIVERSAL':
      S.draft[key.slice(1)] = val === '' ? '' : Math.max(0, parseInt(val, 10) || 0); break;
  }
}
var CH = {
  gprio: function (t) {
    var k = t.value;
    S.gen.prio[k] = t.checked;
    if (t.checked) {
      D.generator.priorities.forEach(function (grp) {
        if (grp.length > 1 && grp.some(function (it) { return it.key === k; })) {
          grp.forEach(function (it) {
            if (it.key !== k) { S.gen.prio[it.key] = false; var o = $('input[data-ch="gprio"][value="' + it.key + '"]'); if (o) o.checked = false; }
          });
        }
      });
    }
    renderPart('ppresets', prioPresets());
  },
  gsel: function (t) {
    S.gen.sel[t.value] = t.checked;
    renderPart('selcount', '<b style="color:var(--ink)">' + plural(countOn(S.gen.sel), 'disciplina selecionada', 'disciplinas selecionadas') + '</b>');
    refreshGenNext();
  },
  gcls: function (t) {
    S.gen.csel[t.value] = t.checked;
    var n = D.generator.classes.filter(function (c) { return S.gen.csel[c.subjectId + '-' + c.classNumber]; }).length;
    renderPart('ccount', plural(n, 'turma selecionada', 'turmas selecionadas'));
    refreshGenNext();
  },
  rpage: function (t) {
    S.report.page = t.value;
    var keep = $('#sheet .sheet-b') ? $('#sheet .sheet-b').scrollTop : 0;
    renderSheet();
    var b = $('#sheet .sheet-b'); if (b) b.scrollTop = keep;
    if (t.value === 'Informações de uma disciplina específica') { var c = $('#rcode'); if (c) { c.scrollIntoView({ block: 'nearest' }); } }
  },
};

/* ================================================================ eventos globais */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-a]');
  if (e.target.closest('#ctrl a')) html.classList.remove('ctrl-open');
  if (S.dd && !e.target.closest('.dd')) { S.dd = null; if (!t) { render(); return; } }
  if (!t) return;
  var a = t.dataset.a;
  if (a === 'copy' && e.target.closest('a')) return;
  if (!A[a]) return;
  if (t.tagName === 'A') e.preventDefault();
  A[a](t.dataset.v, t, e);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (S.dd) { S.dd = null; render(); return; }
    if (S.sheet) { closeSheet(); return; }
    if (S.drawer) { setDrawer(false); var m = $('.hdr .iconbtn'); if (m) m.focus(); return; }
    html.classList.remove('ctrl-open');
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('div[role="button"][data-a]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', function (e) { var k = e.target.dataset && e.target.dataset.in; if (k) onInput(k, e.target.value, e.target); });
document.addEventListener('change', function (e) {
  var t = e.target, k = t.dataset && t.dataset.ch;
  if (k && CH[k]) CH[k](t);
  if (t.dataset && (t.dataset.in === 'gmin' || t.dataset.in === 'gmax') && isInt(S.gen[t.dataset.in.slice(1)])) t.value = S.gen[t.dataset.in.slice(1)];
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  var id = e.target.id;
  if (id === 'loginForm') doLogin();
  else if (id === 'composer') sendMsg();
  else if (id === 'psearch') doSearch();
});
document.addEventListener('pointerdown', function (e) {
  var b = e.target.closest && e.target.closest('.bc');
  if (!b) return;
  clearTimeout(lpT);
  lpT = setTimeout(function () {
    var p = b.dataset.v.split('-'), day = p[0], letter = p[1][0];
    var keys = D.SLOTS.filter(function (s) { return s.id[0] === letter; }).map(function (s) { return day + '-' + s.id; });
    var all = keys.every(function (k) { return S.gen.busy[k]; });
    keys.forEach(function (k) { S.gen.busy[k] = !all; });
    suppressClick = true;
    refreshBusy();
    if (navigator.vibrate) navigator.vibrate(12);
  }, 480);
});
['pointerup', 'pointercancel'].forEach(function (ev) { document.addEventListener(ev, function () { clearTimeout(lpT); }); });
document.addEventListener('contextmenu', function (e) { if (e.target.closest && e.target.closest('.bc')) e.preventDefault(); });
document.addEventListener('scroll', function (e) {
  var t = e.target;
  if (t && t.classList && (t.classList.contains('chips') || t.classList.contains('steps') || t.classList.contains('shortcuts'))) edgeFade(t);
}, true);

/* ================================================================ início */
buildDrawer();
window.addEventListener('hashchange', applyHash);
window.addEventListener('resize', layout);
if (!location.hash || location.hash === '#') history.replaceState(null, '', '#/home?theme=light');
applyHash();
})();
</script>
</body>
</html>
