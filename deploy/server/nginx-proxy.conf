# AO UERJ (server/ do ao-uerj-mobile-ts), incluído nos location /aouerj/ e
# /schedules/. O caminho segue inteiro (o servidor monta os dois prefixos), e
# a porta do processo ativo, azul ou verde, está em
# conf.d/ao-uerj-upstream.conf, que a implantação troca.
proxy_pass http://ao_uerj_server;

# o IP do aluno, para o limite por IP (o servidor confia em um salto: TRUST_PROXY=1)
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
