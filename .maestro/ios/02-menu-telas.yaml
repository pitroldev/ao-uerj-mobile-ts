# iOS: navega pelo menu lateral pelas telas principais (sessão do fluxo 01).
# No iOS, um grupo acessível junta rótulo e valor ("CR aproximado: 7,77"),
# por isso as marcas aceitam texto em volta.
appId: org.reactjs.native.example.aouerjmobile
name: iOS - menu lateral
tags:
  - ios
---
- launchApp
# A folha de novidades reabre se o fluxo anterior não a fechou; no iOS ela
# esconde o resto da tela da árvore de acessibilidade.
- extendedWaitUntil:
    visible: 'Olá, Marina|Funcionalidades exclusivas'
    timeout: 120000
- runFlow: ../subflows/fechar-novidades.yaml
- assertVisible: Olá, Marina
- runFlow:
    file: ../subflows/ir-pelo-menu.yaml
    env:
      TELA: Meu Progresso
      MARCA: '.*CR aproximado.*'
- takeScreenshot: ios-02-meu-progresso
- runFlow:
    file: ../subflows/ir-pelo-menu.yaml
    env:
      TELA: Disciplinas do Currículo
      MARCA: '.*Não atendidas.*'
- takeScreenshot: ios-02-curriculo
- runFlow:
    file: ../subflows/ir-pelo-menu.yaml
    env:
      TELA: Gerador de Grade
      MARCA: '.*Conte-nos um pouco sobre você.*'
- takeScreenshot: ios-02-gerador
- runFlow:
    file: ../subflows/ir-pelo-menu.yaml
    env:
      TELA: Mural de Mensagens
      MARCA: '.*Escolha a disciplina para abrir o mural da turma\..*'
- takeScreenshot: ios-02-mural
- runFlow:
    file: ../subflows/ir-pelo-menu.yaml
    env:
      TELA: Início
      MARCA: Olá, Marina
