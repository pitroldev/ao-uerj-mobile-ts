# Abre a folha de relato e o teclado, sem preencher nem enviar uma mensagem.
appId: com.aouerjmobile
name: Folha inferior e teclado
tags:
  - folha
---
- runFlow: subflows/iniciar-sessao-autenticada.yaml
- tapOn: Sobre o AO UERJ
- scrollUntilVisible:
    element: Reportar problema
    direction: DOWN
    timeout: 15000
- tapOn: Reportar problema
- extendedWaitUntil:
    visible: Passo 1 de 2
    timeout: 10000
- back
- extendedWaitUntil:
    notVisible: Passo 1 de 2
    timeout: 10000
- scrollUntilVisible:
    element: Reportar problema
    direction: DOWN
    timeout: 15000
- tapOn: Reportar problema
- extendedWaitUntil:
    visible: Passo 1 de 2
    timeout: 10000
- tapOn: Quadro de Horários
- tapOn: Próximo
- extendedWaitUntil:
    visible: Passo 2 de 2
    timeout: 10000
- tapOn: Descreva o que aconteceu e o resultado esperado
- assertVisible: Enviar relato
- hideKeyboard
- back
- extendedWaitUntil:
    notVisible: Passo 2 de 2
    timeout: 10000
- scrollUntilVisible:
    element: Sugerir melhoria
    direction: DOWN
    timeout: 15000
- assertVisible: Sugerir melhoria
