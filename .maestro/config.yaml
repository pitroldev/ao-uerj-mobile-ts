# Fluxos Android sobre uma sessão real já autenticada, com consultas ao portal.
# Execute scripts/dev/login.cjs antes. Não coloque credenciais em parâmetros
# do Maestro. Artefatos de falhas podem conter dados pessoais: mantenha-os locais.
# Como rodar: scripts/dev/README.md, "Testes E2E (Maestro)".
#
# `maestro test .maestro` roda só os fluxos deste nível. subflows/ guarda
# trechos usados por `runFlow`; recriacao/ roda em duas etapas, com o adb
# mudando a fonte do sistema entre elas (scripts/dev/e2e-ci.sh).
flows:
  - '*'
