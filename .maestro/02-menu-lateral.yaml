# Smoke de navegação e leitura da conta autenticada, sem conteúdo fixo.
# O helper ignora itens marcados como indisponíveis no menu.
appId: com.aouerjmobile
name: Menu lateral da conta autenticada
tags:
  - navegacao
---
- runFlow: subflows/iniciar-sessao-autenticada.yaml
- runFlow:
    file: subflows/ir-pelo-menu.yaml
    env:
      TELA: Meu Progresso
      MARCA: CR aproximado|Ainda não há histórico ou currículo disponível\.
- runFlow:
    file: subflows/ir-pelo-menu.yaml
    env:
      TELA: Plano até a formatura
      MARCA: Formatura prevista.*|Nada a planejar.*|Não foi possível carregar o currículo e o histórico\.
- runFlow:
    file: subflows/ir-pelo-menu.yaml
    env:
      TELA: Disciplinas Realizadas
      MARCA: Período
- runFlow:
    file: subflows/ir-pelo-menu.yaml
    env:
      TELA: Disciplinas do Currículo
      MARCA: Não atendidas
- runFlow:
    file: subflows/ir-pelo-menu.yaml
    env:
      TELA: Disciplinas Universais
      MARCA: Todos os departamentos
- runFlow:
    file: subflows/ir-pelo-menu.yaml
    env:
      TELA: Pesquisa de Disciplinas
      MARCA: Buscar disciplina
- runFlow:
    file: subflows/ir-pelo-menu.yaml
    env:
      TELA: Gerador de Grade
      MARCA: Conte-nos um pouco sobre você
- runFlow:
    file: subflows/ir-pelo-menu.yaml
    env:
      TELA: Mural de Mensagens
      MARCA: Escolha a disciplina para abrir o mural da turma\.
- runFlow:
    file: subflows/ir-pelo-menu.yaml
    env:
      TELA: Sobre
      MARCA: Reportar problema
- runFlow:
    file: subflows/ir-pelo-menu.yaml
    env:
      TELA: Início
      MARCA: Olá, .+
- tapOn: Sobre o AO UERJ
- scrollUntilVisible:
    element: Reportar problema
    direction: DOWN
    timeout: 15000
