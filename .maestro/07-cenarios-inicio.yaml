# Início nos cenários do modo demo: período de inscrição (RID), período não
# iniciado, Aluno Online bloqueado e layout inesperado. Termina no padrão.
appId: com.aouerjmobile
name: Cenários do Início
tags:
  - cenarios
---
- stopApp

# período de inscrição: sem grade e sem notas, o Início mostra o RID
- runFlow:
    file: subflows/entrar-demo.yaml
    env:
      CENARIO: rid
- extendedWaitUntil:
    visible: RID Parcial
    timeout: 15000
- assertNotVisible: Próxima aula
- takeScreenshot: 07-inicio-rid

# período não iniciado: sem grade, notas nem RID
- runFlow:
    file: subflows/entrar-demo.yaml
    env:
      CENARIO: vazio
- extendedWaitUntil:
    visible: Parece que o período não se iniciou ainda\.
    timeout: 15000
- assertNotVisible: RID Parcial
- takeScreenshot: 07-inicio-vazio

# Aluno Online bloqueado: as leituras acadêmicas falham
- runFlow:
    file: subflows/entrar-demo.yaml
    env:
      CENARIO: bloqueado
- extendedWaitUntil:
    visible: Parece que o Aluno Online está temporariamente bloqueado\. Tente novamente mais tarde\.
    timeout: 30000
- takeScreenshot: 07-inicio-bloqueado

# layout inesperado: erro com "tentar de novo"
- runFlow:
    file: subflows/entrar-demo.yaml
    env:
      CENARIO: erro
- extendedWaitUntil:
    visible: Ops, parece que houve um erro nos seguintes componentes.*
    timeout: 30000
- takeScreenshot: 07-inicio-erro

- runFlow:
    file: subflows/entrar-demo.yaml
    env:
      CENARIO: padrao
- extendedWaitUntil:
    visible: Próxima aula
    timeout: 15000
