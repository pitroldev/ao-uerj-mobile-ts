# Mural: abre a conversa de uma turma, envia uma mensagem (no modo demo ela
# fica só na memória do app) e copia o texto tocando no balão.
# Parâmetro opcional API_LEVEL (ex.: -e API_LEVEL=33): do Android 13 (API 33)
# em diante o próprio sistema confirma a cópia e o app não mostra aviso.
appId: com.aouerjmobile
name: Mural de mensagens
tags:
  - mural
env:
  API_LEVEL: ${API_LEVEL || '0'}
---
- stopApp
- runFlow:
    file: subflows/entrar-demo.yaml
    env:
      CENARIO: padrao
- runFlow: subflows/abrir-conversa.yaml
- assertVisible: IME02-10892 · Turma 2
- extendedWaitUntil:
    visible: Mensagem de Beatriz Nunes.*
    timeout: 15000

# enviar com o teclado aberto: o compositor fica acima dele
- tapOn: Mensagem
- inputText: Mensagem de teste do Maestro
- takeScreenshot: 05-mural-teclado
- tapOn: Enviar mensagem
- extendedWaitUntil:
    visible: Mensagem de você, .*Mensagem de teste do Maestro
    timeout: 15000
- takeScreenshot: 05-mural-enviada

# tocar no balão copia o texto
- tapOn: Mensagem de você, .*Mensagem de teste do Maestro
- runFlow:
    when:
      true: ${Number(API_LEVEL) >= 33}
    commands:
      - assertNotVisible: Copiado com sucesso!
      - takeScreenshot: 05-mural-copia-sistema
- runFlow:
    when:
      true: ${Number(API_LEVEL) > 0 && Number(API_LEVEL) < 33}
    commands:
      - extendedWaitUntil:
          visible: Copiado com sucesso!
          timeout: 5000

# a seta do cabeçalho volta para a lista de disciplinas
- tapOn: Voltar para as disciplinas
- extendedWaitUntil:
    visible: Escolha a disciplina para abrir o mural da turma\.
    timeout: 10000
