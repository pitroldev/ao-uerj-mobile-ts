# Entra na conta de demonstração pelo deep link de debug e espera o Início.
# Parâmetro: CENARIO (padrao, rid, vazio, bloqueado, erro ou lento).
# O link troca a sessão se outro cenário estiver conectado; se for o mesmo,
# só abre o Início (src/app/dev/devLinking.ts).
appId: com.aouerjmobile
---
- openLink: aouerj-dev://demo/${CENARIO}
# A matrícula exibida é a digitada ("demo", "demo-rid"...) e fica no menu
# lateral, que segue na árvore mesmo fechado: distingue a conta nova da
# anterior quando o link troca de cenário.
- runFlow:
    file: esperar-inicio.yaml
    env:
      MATRICULA: "${CENARIO === 'padrao' ? 'demo' : 'demo-' + CENARIO}"
