# Tema pelo botão do rodapé do menu lateral: Escuro e de volta para
# "Padrão do sistema" ao terminar. Altera só a preferência local do aparelho.
appId: com.aouerjmobile
name: Troca de tema
tags:
  - tema
---
- runFlow: subflows/iniciar-sessao-autenticada.yaml
- runFlow: subflows/abrir-menu.yaml
- tapOn: 'Tema: .*'
- extendedWaitUntil:
    visible: Acompanha o modo claro ou escuro do aparelho
    timeout: 10000
- tapOn: Escuro
- extendedWaitUntil:
    visible: 'Tema: Escuro'
    timeout: 10000
- extendedWaitUntil:
    notVisible: Acompanha o modo claro ou escuro do aparelho
    timeout: 10000
- back
- extendedWaitUntil:
    visible: Abrir menu
    timeout: 5000
- assertVisible: Olá, .+

# a escolha vale ao abrir o app de novo
- stopApp
- launchApp
- runFlow: subflows/esperar-inicio.yaml
- runFlow: subflows/abrir-menu.yaml
- assertVisible: 'Tema: Escuro'

- tapOn: 'Tema: Escuro'
- extendedWaitUntil:
    visible: Acompanha o modo claro ou escuro do aparelho
    timeout: 10000
- tapOn: Padrão do sistema
- extendedWaitUntil:
    visible: 'Tema: Padrão do sistema'
    timeout: 10000
- back
- extendedWaitUntil:
    visible: Abrir menu
    timeout: 5000
